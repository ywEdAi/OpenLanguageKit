<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classifier matching</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .cm-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .cm-layout { grid-template-columns: 1fr; } }
  .cm-side { display: grid; gap: 12px; }
  .cm-stage { display: grid; gap: 12px; }
  .table { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .thing { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px 4px; display: grid; justify-items: center; gap: 1px; min-height: 92px; }
  .thing .pic { font-size: 1.9rem; line-height: 1.2; }
  [data-variant="child"] .thing .pic { font-size: 2.4rem; }
  .thing .w { font-size: 1.05rem; }
  .thing .g { font-size: .72rem; color: var(--muted); }
  .thing .tag { font-size: .75rem; border-radius: 999px; padding: 0 8px; }
  .thing[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .thing.ok { background: var(--accent-soft); }
  .thing.gen { background: var(--warn-soft); border-color: var(--warn); }
  .thing.bad { background: var(--bad-soft); border-color: var(--bad); }
  .thing.like { box-shadow: 0 0 0 3px var(--t2); }
  .thing:disabled { cursor: default; opacity: .95; }
  .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .box { border: 2px dashed var(--line); background: var(--bg); border-radius: 12px; padding: 8px; display: grid; gap: 4px; text-align: left; align-content: start; min-height: 96px; }
  .box .bt { font-size: 1.5rem; font-weight: 700; }
  .box .bn { font-size: .7rem; color: var(--muted); }
  .box .feat { font-size: .78rem; color: var(--accent); }
  .box .in { font-size: .9rem; color: var(--ink); }
  .box.hot { border-color: var(--accent); border-style: solid; }
  .box:disabled { cursor: default; }
  .heap { font-size: 1.4rem; letter-spacing: -6px; }
  .pb { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; }
  .pb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pb.right { background: var(--accent-soft); border-color: var(--accent); }
  .pb.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .pb.gen { background: var(--warn-soft); border-color: var(--warn); }
  .pb:disabled { cursor: default; }
  .chipbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts { display: grid; gap: 6px; }
  .opts button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .opts button.right { background: var(--accent-soft); border-color: var(--accent); }
  .opts button.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .q { font-size: 1.5rem; margin: 0; }
  .q .gap { display: inline-block; min-width: 2em; border-bottom: 3px solid var(--accent); text-align: center; color: var(--accent); }
  .big { font-size: 2.6rem; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
  .col { display: grid; gap: 6px; align-content: start; }
  .col .lab { font-size: .8rem; color: var(--muted); }
  .needs { display: flex; flex-wrap: wrap; gap: 8px; }
  .need { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--panel); }
  .need.done { border-color: var(--accent); background: var(--accent-soft); }
  .need .pics { font-size: 1.3rem; }
  .list { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 12px; display: grid; gap: 4px; }
  .list .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .list .row span.t { font-size: 1.15rem; }
  .list .row.bad span.t { color: var(--bad); }
  .list .row.gen span.t { text-decoration: underline wavy var(--warn); }
  .x { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 8px; }
  .checklist { margin: 6px 0 0; padding-left: 20px; }
  .checklist li.no { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .8rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  .reverse { border-left: 4px solid var(--warn); }
  .done { font-size: 2.4rem; }
  .meter { font-size: 1.6rem; font-weight: 700; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'classifier-match-zh';
  var app = document.getElementById('app');
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || {};
  if (entry.block && entry.block !== 'classifier-match') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var file = entry.file || 'data/classifier-match.js';   // fallback while the registry does not list the pack yet
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  var CATS = [
    { id: 'rule', zh: '按规律放（和盒子里其他东西有同一个共同点）', en: 'By the rule (it shares the box’s common property)' },
    { id: 'exception', zh: '规律之外，要单独记', en: 'Outside the rule: remember it separately' },
    { id: 'both', zh: '两个都可以，但意思或语气不同', en: 'Both work, but meaning or tone differs' },
    { id: 'none', zh: '这里不用量词或单位', en: 'No classifier or unit is used here' }
  ];

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'classifier-match', primitive: 'prim:classifier-match', title: title, set: pack.id });
    document.title = title + ' · Classifiers';
    var showGloss = KTBlock.lang !== pack.lang;
    var modes = [{ id: 'sort', label: L('分盒子', 'Sort into boxes') }, { id: 'new', label: L('新东西', 'New things') }, { id: 'order', label: L('自己写单子', 'Write your list') }];
    var st = { mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'sort', setIdx: 0, S: null, record: {}, generic: { used: 0, total: 0 } };
    function child() { return B.variant === 'child'; }
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); newRound(); },
      onVariant: function () { newRound(); } });
    var bar = h('div', { class: 'kb-bar' }), stage = h('div', { class: 'kb-card cm-stage' }), side = h('aside', { class: 'cm-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'cm-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    function box(id) { return id === 'none' ? { t: L('不用量词', 'no classifier') } : pack.boxes[id] || (pack.units || {})[id] || { t: id }; }
    function boxT(id) { var b = box(id); return b.t || b.sg; }
    function feat(id) { var f = pack.features.filter(function (x) { return x.id === id; })[0]; return f ? T(f, 'zh') : ''; }
    function gloss(it) { return showGloss && it.gloss ? T(it.gloss, 'zh') : ''; }
    function chip(id, text) { var s2 = B.status(id); st.record[id] = { text: text, cls: s2 === 'independent' ? 'ind' : s2 === 'wrong' ? 'bad' : 'ast' }; }
    function feedback(t, tone) { var f = stage.querySelector('.kb-feedback'); if (f) { f.textContent = t; f.className = 'kb-feedback ' + (tone || ''); f.hidden = !t; } }
    function usualText(ok) { return ok.map(boxT).join(L('、', ' / ')); }
    function countGeneric(isGen) { st.generic.total++; if (isGen) st.generic.used++; }

    /* ---------- rounds ---------- */
    function newRound() {
      if (st.mode === 'sort') {
        var sets = pack.sets.filter(function (x) { return !child() || x.child; });
        if (!sets.length) sets = pack.sets;
        var set = sets[st.setIdx % sets.length];
        var bx = child() ? set.boxes.slice(0, 3) : set.boxes;
        var items = set.items.filter(function (id) { return pack.items[id].ok.some(function (b) { return bx.indexOf(b) >= 0; }); });
        st.S = { set: set, boxes: bx, items: KTBlock.shuffle(items), placed: {}, wrong: {}, sel: null, hint: {}, like: null, fstep: false, fsel: {}, fdone: {} };
      } else if (st.mode === 'new') {
        var list = pack.newItems.filter(function (it) { return !child() || it.cat === 'rule'; });
        // keep the reverse half in every round: at least a quarter must be exception / both / none
        var rev = KTBlock.shuffle(list.filter(function (it) { return it.cat !== 'rule'; })), rule = KTBlock.shuffle(list.filter(function (it) { return it.cat === 'rule'; }));
        var n = child() ? 5 : 8, nrev = child() ? 0 : Math.max(Math.ceil(n / 4), Math.min(rev.length, 3));
        var q = rev.slice(0, nrev).concat(rule.slice(0, n - nrev));
        if (B.kc) { var mine = list.filter(function (it) { return it.kc === B.kc; }); if (mine.length) q = mine.concat(q.filter(function (x) { return mine.indexOf(x) < 0; })).slice(0, Math.max(n, mine.length)); }
        st.S = { queue: KTBlock.shuffle(q), idx: 0 };
        beginNew();
        return;
      } else {
        var tasks = pack.tasks, task = tasks[st.setIdx % tasks.length];
        st.S = { task: task, lines: [], cur: { num: null, cl: null, noun: null }, result: null };
      }
      render();
    }
    function beginNew() {
      var it = st.S.queue[st.S.idx];
      st.S.cur = it ? { box: null, tried: [], boxDone: false, cat: null, read: null, readTried: [], det: null, detTried: [], hint: 0 } : null;
      if (it) B.emit('view', { item: it.id, mode: 'new' }); else B.emit('complete', { mode: 'new', items: st.S.queue.length });
      render();
    }

    /* ---------- step 1: sort ---------- */
    function place(id, b) {
      var S = st.S, it = pack.items[id], rid = 'sort:' + id;
      if (S.placed[id]) return;
      var ok = it.ok.indexOf(b) >= 0, isGen = !ok && b === pack.generic;
      B.emit('drop', { item: rid, box: b });
      if (isGen) {
        B.hint(rid, 'generic');   // not wrong: understood, but not the usual classifier → recorded as assisted
        B.attempt(rid, { correct: true, response: { box: b, generic: true } });
        B.emit('compare', { item: rid, usual: it.ok });
        S.placed[id] = { box: b, gen: true }; S.sel = null; countGeneric(true); chip(rid, it.w);
        render(); feedback(L('能懂，但更常说：', 'Understood, but people usually say: ') + usualText(it.ok) + L('。可以点“改放”。', '. You can move it.'), 'warn');
        return;
      }
      B.attempt(rid, { correct: ok, response: { box: b } });
      if (ok) {
        S.placed[id] = { box: b }; S.sel = null; if (pack.generic) countGeneric(false);
        chip(rid, it.w);
        render(); feedback(L('对。', 'Right.'));
        maybeFeatureStep();
        return;
      }
      S.wrong[id] = b;
      render();
      var nm = it.w + (gloss(it) ? L('（' + gloss(it) + '）', ' (' + gloss(it) + ')') : '');
      var msg = it.fix ? T(it.fix, 'zh') : L('“' + nm + '”不放在“' + boxT(b) + '”。看看这一盒已有的东西有什么共同点。', '“' + nm + '” does not go in “' + boxT(b) + '”. Look at what the things already in that box have in common.');
      feedback(msg + L(' 再放一次。', ' Try again.'), 'bad');
    }
    function revise(id) {
      var S = st.S, it = pack.items[id];
      B.emit('revise', { item: 'sort:' + id, from: S.placed[id].box });
      st.generic.used = Math.max(0, st.generic.used - 1);
      delete S.placed[id]; S.sel = id; S.wrong[id] = pack.generic;
      render(); feedback(L('选一个更常用的盒子。', 'Choose the more usual box.'));
    }
    function maybeFeatureStep() {
      var S = st.S;
      if (child()) return;
      if (S.items.every(function (id) { return S.placed[id]; }) && !S.fstep) { S.fstep = true; render(); feedback(L('都放好了。现在给每个盒子选一个共同点。', 'All placed. Now choose what each box has in common.')); }
    }
    function chooseFeature(b, f) {
      var S = st.S; if (S.fdone[b]) return;
      var rid = 'feature:' + S.set.id + ':' + b, ok = f === box(b).feature;
      B.attempt(rid, { correct: ok, response: { feature: f } });
      B.emit('select', { item: rid, feature: f });
      S.fsel[b] = f;
      if (ok) { S.fdone[b] = true; chip(rid, boxT(b) + L('：', ': ') + feat(f)); render(); feedback(L('对：“', 'Right: what the “') + boxT(b) + L('”这一盒的共同点是：', '” box has in common: ') + feat(f) + L('。', '.')); return; }
      render(); feedback(L('这个共同点不是所有东西都有。再看盒子里的东西。', 'Not everything in the box has that property. Look at the things again.'), 'bad');
    }

    /* ---------- step 2: new things ---------- */
    function newBox(b) {
      var S = st.S, it = S.queue[S.idx], c = S.cur; if (c.boxDone) return;
      var rid = 'new:' + it.id, ok = b === 'none' ? !it.ok.length : it.ok.indexOf(b) >= 0, isGen = !ok && b === pack.generic && it.ok.length > 0;
      c.tried.push(b); c.box = b;
      B.emit('drop', { item: rid, box: b });
      if (isGen) { B.hint(rid, 'generic'); B.attempt(rid, { correct: true, response: { box: b, generic: true } }); c.boxDone = true; countGeneric(true); chip(rid, it.w); render(); feedback(L('能懂，但更常说：', 'Understood, but people usually say: ') + usualText(it.ok) + L('。现在判断它属于哪一类。', '. Now decide which kind of case it is.'), 'warn'); return; }
      B.attempt(rid, { correct: ok, response: { box: b } });
      if (ok) { c.boxDone = true; if (pack.generic && it.ok.length) countGeneric(false); chip(rid, it.w); render(); feedback(L('对。现在判断它属于哪一类。', 'Right. Now decide which kind of case it is.')); return; }
      render(); feedback(it.ok.length ? L('不是这个。再试一次。', 'Not this one. Try again.') : L('不对。想一想：这里真的需要量词吗？', 'No. Think: is a classifier really needed here?'), 'bad');
    }
    function newCat(cat) {
      var S = st.S, it = S.queue[S.idx], c = S.cur; if (c.cat) return;
      var rid = 'cat:' + it.id, ok = cat === it.cat;
      B.attempt(rid, { correct: ok, response: { category: cat } });
      c.cat = cat; chip(rid, L('类别：', 'kind: ') + it.w);
      render(); feedback((ok ? L('对。', 'Right. ') : L('不对。', 'Not quite. ')) + T(it.note, 'zh'), ok ? '' : 'bad');
      if (ok) B.speak(it.q.replace('＿', it.ok.length ? boxT(it.ok[0]) : '').replace('＿', ''), pack.speech);
    }
    function newRead(r) {
      var S = st.S, it = S.queue[S.idx], c = S.cur; if (c.read === it.read.ok) return;
      var rid = 'read:' + it.id, ok = r === it.read.ok;
      B.attempt(rid, { correct: ok, response: { reading: r } });
      c.read = r; c.readTried.push(r);
      if (ok) { chip(rid, r); render(); feedback(L('对：', 'Right: ') + r); B.speak(r, pack.speech); return; }
      render(); feedback(L('读音不对。看数字和助数词合在一起时有没有变音（っ、浊音、半浊音）。', 'Not the right reading. Check whether number and counter change sound together (small っ, voiced or p-sounds).'), 'bad');
    }
    function newDet(d) {
      var S = st.S, it = S.queue[S.idx], c = S.cur; if (c.det === it.det.ok) return;
      var rid = 'det:' + it.id, ok = d === it.det.ok;
      B.attempt(rid, { correct: ok, response: { det: d } });
      c.det = d; c.detTried.push(d);
      if (ok) { chip(rid, d); render(); feedback(L('对：', 'Right: ') + it.det.q.replace('＿', d)); B.speak(it.det.q.replace('＿', d), pack.speech); return; }
      render(); feedback(L('这个词和你放的盒子对不上：', 'This word does not match the box: ') + L('能一个个数的用 many / a few / fewer，后接复数；一团的用 much / a little / less，不加 -s。', 'things counted one by one take many / a few / fewer and a plural; a mass takes much / a little / less and no -s.'), 'bad');
    }
    function newDone(it, c) { return c.boxDone && c.cat && (!it.read || c.read === it.read.ok) && (!it.det || c.det === it.det.ok); }

    /* ---------- step 3: write the list ---------- */
    function lineText(l) {
      var it = pack.items[l.noun], num = pack.numbers[l.num];
      if (pack.line === 'zh') return num.t + (l.cl === 'none' ? '' : boxT(l.cl)) + it.w;
      if (pack.line === 'ja') return it.w + 'を' + num.t + (l.cl === 'none' ? '' : boxT(l.cl)) + 'ください';
      var one = num.v === 1, u = l.cl !== 'none' ? pack.units[l.cl] : null;
      if (u) return (one ? 'a' : num.t) + ' ' + (one ? u.sg : u.pl) + ' of ' + it.w;
      return one ? (it.a || 'a') + ' ' + it.w : num.t + ' ' + (it.pl || it.w + 's');
    }
    function judgeLine(l) {
      var it = pack.items[l.noun], num = pack.numbers[l.num];
      if (num.bad) return { bad: true, why: T(num.bad, 'zh') };
      if (it.ok.indexOf(l.cl) >= 0) return { ok: true };
      if (l.cl === pack.generic) return { gen: true, why: L('能懂，但更常说：', 'Understood, but people usually say: ') + it.ok.filter(function (b) { return pack.orderCl.indexOf(b) >= 0; }).map(boxT).join(L('、', ' / ')) };
      return { bad: true, why: it.fix ? T(it.fix, 'zh') : L('“' + boxT(l.cl) + '”和“' + it.w + '”对不上', '“' + boxT(l.cl) + '” does not fit “' + it.w + '”') };
    }
    function addLine() {
      var S = st.S, c = S.cur;
      S.lines.push({ num: c.num, cl: c.cl, noun: c.noun });
      B.emit('connect', { item: 'order:' + S.task.id, line: lineText(c) });
      S.cur = { num: null, cl: null, noun: null }; S.result = null; render();
    }
    function checkOrder() {
      var S = st.S, task = S.task, out = [], ok = true;
      function rule(pass, zh, en) { out.push({ ok: pass, t: L(zh, en) }); if (!pass) ok = false; }
      rule(S.lines.length > 0 && S.lines.every(function (l) { return l.num !== null && l.cl && l.noun; }), '每一行都有数、量词（或单位）和名词', 'Every line has a number, a classifier (or unit) and a noun');
      var missing = task.needs.filter(function (n) { return !S.lines.some(function (l) { return l.noun === n.item && pack.numbers[l.num].v === n.n; }); });
      var extra = S.lines.filter(function (l) { return !task.needs.some(function (n) { return n.item === l.noun && n.n === pack.numbers[l.num].v; }); });
      rule(!missing.length && !extra.length && S.lines.length === task.needs.length, '单子和要买的东西一样：每样一行，数目对' + (missing.length ? '（还缺：' + missing.map(function (n) { return pack.items[n.item].w + ' ×' + n.n; }).join('、') + '）' : ''),
        'The list matches what is needed: one line each, right number' + (missing.length ? ' (missing: ' + missing.map(function (n) { return pack.items[n.item].w + ' ×' + n.n; }).join(', ') + ')' : ''));
      var js = S.lines.map(judgeLine), bad = js.filter(function (j) { return j.bad; });
      rule(!bad.length, '量词（或单位）和数词形式都对得上' + (bad.length ? '：' + bad.map(function (j) { return j.why; }).join('；') : ''), 'Every classifier (or unit) and number form fits' + (bad.length ? ': ' + bad.map(function (j) { return j.why; }).join('; ') : ''));
      if (pack.generic) {
        var gen = js.filter(function (j) { return j.gen; }).length, spec = task.needs.filter(function (n) { return pack.items[n.item].ok.indexOf(pack.generic) < 0; }).length;
        rule(!(S.lines.length && gen / S.lines.length > 0.6 && spec > 0), '没有一律用“' + boxT(pack.generic) + '”回避（超过六成算回避）', 'Not avoiding by using “' + boxT(pack.generic) + '” for everything (over 60% counts as avoiding)');
        st.generic.used += gen; st.generic.total += S.lines.length;
      }
      S.result = { ok: ok, lines: out, js: js };
      B.attempt('order:' + task.id, { correct: ok, response: S.lines.map(lineText) });
      chip('order:' + task.id, L('单子 ', 'list ') + (pack.tasks.indexOf(task) + 1));
      render();
    }

    /* ---------- render ---------- */
    function renderBar() {
      bar.innerHTML = '';
      if (st.mode === 'new' && st.S.cur) bar.append(h('span', { class: 'kb-note', text: L('第 ' + (st.S.idx + 1) + ' / ' + st.S.queue.length + ' 个', 'Item ' + (st.S.idx + 1) + ' / ' + st.S.queue.length) }));
      if (st.mode === 'sort') bar.append(h('span', { class: 'kb-note', text: T(st.S.set.title, 'zh') }));
