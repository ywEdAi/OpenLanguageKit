<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading-aid fading</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .ra-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .ra-layout { grid-template-columns: 1fr; } }
  .ra-side { display: grid; gap: 12px; }
  .ra-stage { display: grid; gap: 12px; }
  .ra-stage .kb-prompt { margin: 0; }
  .passage { font-size: calc(var(--glyph) * 1.05); line-height: 2.6; padding: 6px 4px; overflow-wrap: anywhere; }
  [data-variant="child"] .passage { font-size: calc(var(--glyph) * 1.1); line-height: 2.9; }
  .passage ruby { ruby-position: over; }
  .passage rt { font-size: .5em; color: var(--accent); letter-spacing: 0; }
  .passage ruby.fixed rt { color: var(--muted); }
  .u { border: 0; background: transparent; padding: 0 1px; margin: 0; font: inherit; line-height: inherit; color: inherit; border-radius: 6px; position: relative; }
  .u:hover { background: var(--accent-soft); }
  .u.st-hide rt { visibility: hidden; }
  .u.st-tap::after { content: ""; position: absolute; left: 50%; bottom: .15em; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--line); }
  [data-theme="dark"] .u.st-tap::after { background: var(--muted); }
  .u.peeked { box-shadow: inset 0 -3px 0 var(--warn); }
  .u.peeked::before { content: "👁"; position: absolute; top: -.2em; right: -.35em; font-size: .38em; line-height: 1; }
  .u.miss { text-decoration: underline wavy var(--bad); text-underline-offset: .35em; }
  .u.miss:has(.dots) { box-shadow: inset 0 -3px 0 var(--bad); }
  .u.keep rt { color: var(--muted); }
  .u.keep::before { content: "★"; position: absolute; top: -.1em; left: -.3em; font-size: .3em; line-height: 1; color: var(--muted); }
  .u .snd { font-size: .45em; vertical-align: super; color: var(--accent); }
  .dots { display: inline-flex; align-items: flex-start; }
  .dots .g { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .dots .g i { display: block; height: 6px; margin-top: 2px; }
  .dots .g i.dot { width: 6px; border-radius: 50%; background: var(--accent); }
  .dots .g i.line { width: 80%; height: 3px; margin-top: 4px; border-radius: 2px; background: var(--accent); }
  .u.st-hide .dots .g i { visibility: hidden; }
  .count { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .count b { font-size: 1.4rem; }
  .iso { font-size: calc(var(--glyph) * 1.6); text-align: center; margin: 4px 0; }
  .iso mark { background: var(--accent-soft); color: inherit; border-radius: 6px; padding: 0 4px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .opt { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 10px 8px; display: flex; gap: 6px; align-items: center; justify-content: center; min-height: 48px; text-align: center; }
  .opt .num { font-size: .7rem; color: var(--muted); }
  .opt .big { font-size: 1.6rem; }
  .opt.right { background: var(--accent-soft); border-color: var(--accent); }
  .opt.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .opt.rev { border-left: 4px solid var(--warn); }
  .opt:disabled { cursor: default; }
  .typein { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .typein input { font-size: 1.2rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; width: min(260px, 100%); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools.c { justify-content: center; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cols h3 { font-size: .85rem; margin: 0 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .85rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  .flag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .reverse { border-left: 4px solid var(--warn); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .steps span { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .steps span.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .list { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; }
  .legend { font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
  .done { font-size: 2.4rem; text-align: center; }
  .kb-bar .kb-variant { flex-wrap: wrap; min-width: 0; max-width: 100%; }
  .kb-bar select { max-width: 100%; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Reading-aid fading (prim:reading-aid-fade). Packs: data/reading-aid-fade.js (format in its header).
 * Modes: read (steps 1 + 3: blind read with peeking, spot checks before the aid is shown, a meaning question; the
 * same units come back in later passages with their aid faded), sort (step 2: classify misreadings, including the
 * reverse-half category), keep (reverse half: aids that should not fade, and reading ≠ understanding).
 * Fade state lives in localStorage per pack (kt-raf-<set>). ?spacing=day requires the two clean reads on different days. */
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'reading-aid-fade-zh';
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || { file: 'data/reading-aid-fade.js', block: 'reading-aid-fade' };
  var app = document.getElementById('app');
  if (entry.block !== 'reading-aid-fade') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var s = document.createElement('script');
  s.src = entry.file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + entry.file; };
  document.head.appendChild(s);

  /* ---- reading normalisation (deterministic) ---- */
  var KANA = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お' };
  (function () {
    var rows = { k: 'かきくけこ', s: 'さしすせそ', t: 'たちつてと', n: 'なにぬねの', h: 'はひふへほ', m: 'まみむめも', r: 'らりるれろ', g: 'がぎぐげご', z: 'ざじずぜぞ', d: 'だぢづでど', b: 'ばびぶべぼ', p: 'ぱぴぷぺぽ', x: 'ぁぃぅぇぉ', l: 'ぁぃぅぇぉ' };
    Object.keys(rows).forEach(function (c) { 'aiueo'.split('').forEach(function (v, j) { KANA[c + v] = rows[c][j]; }); });
    Object.assign(KANA, { ya: 'や', yu: 'ゆ', yo: 'よ', ye: 'いぇ', wa: 'わ', wo: 'を', shi: 'し', chi: 'ち', tsu: 'つ', fu: 'ふ', ji: 'じ', si: 'し', ti: 'ち', tu: 'つ', hu: 'ふ', zi: 'じ', di: 'ぢ', du: 'づ',
      fa: 'ふぁ', fi: 'ふぃ', fe: 'ふぇ', fo: 'ふぉ', she: 'しぇ', che: 'ちぇ', je: 'じぇ', xtu: 'っ', ltu: 'っ', xya: 'ゃ', xyu: 'ゅ', xyo: 'ょ', lya: 'ゃ', lyu: 'ゅ', lyo: 'ょ', xn: 'ん', thi: 'てぃ', dhi: 'でぃ' });
    var yo = { k: 'き', g: 'ぎ', n: 'に', h: 'ひ', m: 'み', r: 'り', b: 'び', p: 'ぴ', sh: 'し', ch: 'ち', j: 'じ', sy: 'し', ty: 'ち', cy: 'ち', zy: 'じ', jy: 'じ', dy: 'ぢ' };
    var sm = { a: 'ゃ', u: 'ゅ', o: 'ょ' };
    Object.keys(yo).forEach(function (c) { 'auo'.split('').forEach(function (v) { var key = (c.length === 1 ? c + 'y' : c) + v; KANA[key] = yo[c] + sm[v]; }); });
  })();
  /** romaji → hiragana. final=false leaves an unfinished tail (e.g. "k", a lone "n") in `rest`. */
  function romaji(str, final) {
    var s = str.toLowerCase(), out = '', i = 0;
    while (i < s.length) {
      var c = s[i];
      if (!/[a-z'\-]/.test(c)) { out += c; i++; continue; }
      if (c === '-') { out += 'ー'; i++; continue; }
      if (c === "'") { i++; continue; }
      if (c === 'n') {
        var nx = s[i + 1];
        if (nx === 'n' || nx === "'") { out += 'ん'; i += 2; continue; }
        if (nx === undefined) { if (final) { out += 'ん'; i++; continue; } break; }
        if (!/[aiueoy]/.test(nx)) { out += 'ん'; i++; continue; }
      }
      if (c === s[i + 1] && /[bcdfghjkmpqrstvwxyz]/.test(c)) { out += 'っ'; i++; continue; }
      var hit = null;
      for (var n = 3; n >= 1; n--) { var k = s.substr(i, n); if (KANA[k]) { hit = k; break; } }
      if (hit) { out += KANA[hit]; i += hit.length; continue; }
      var tail = s.slice(i);
      if (!final && Object.keys(KANA).some(function (k) { return k.indexOf(tail) === 0; })) break;
      out += c; i++;
    }
    return { kana: out, rest: s.slice(i) };
  }
  function hira(s) { return s.replace(/[\u30a1-\u30f6]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
  function normKana(s) { s = s.replace(/[\s　・]/g, ''); return hira(romaji(s, true).kana); }
  var TM = { 'ā': 'a1', 'á': 'a2', 'ǎ': 'a3', 'à': 'a4', 'ē': 'e1', 'é': 'e2', 'ě': 'e3', 'è': 'e4', 'ī': 'i1', 'í': 'i2', 'ǐ': 'i3', 'ì': 'i4', 'ō': 'o1', 'ó': 'o2', 'ǒ': 'o3', 'ò': 'o4', 'ū': 'u1', 'ú': 'u2', 'ǔ': 'u3', 'ù': 'u4', 'ǖ': 'v1', 'ǘ': 'v2', 'ǚ': 'v3', 'ǜ': 'v4', 'ü': 'v0' };
  /** pinyin (tone marks or numbers) → {letters, tones}. Neutral tone (5/0/unmarked) is not counted. */
  function py(s) {
    s = s.toLowerCase().normalize('NFC').replace(/u:/g, 'v');
    var letters = '', tones = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (TM[ch]) { letters += TM[ch][0]; if (TM[ch][1] !== '0') tones += TM[ch][1]; }
      else if (/[a-z]/.test(ch)) letters += ch;
      else if (/[1-4]/.test(ch)) tones += ch;
    }
    return { letters: letters, tones: tones };
  }

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'reading-aid-fade', primitive: 'prim:reading-aid-fade', title: title, set: pack.id });
    document.title = title + ' · Reading-aid fading';
    var U = pack.units, kinds = pack.kinds, groups = pack.groups || {};
    var EN = KTBlock.lang === 'en';
    var spacingDay = params.get('spacing') === 'day';
    function child() { return B.variant === 'child'; }
    var modes = [{ id: 'read', label: L('读一段', 'Read a passage') }, { id: 'sort', label: L('归类读错', 'Sort the misreadings') }, { id: 'keep', label: L('不该撤的', 'When not to fade') }];
    var groupIds = Object.keys(groups);
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'read',
      group: groups[params.get('focus')] ? params.get('focus') : (groupIds[0] || null),
      phase: 'read', passage: null, round: 0, peeked: {}, allShown: false, checks: [], cIdx: 0, typed: true,
      missed: {}, roundWrong: {}, ownErrors: [], queue: [], qIdx: 0, answered: null, msg: null, changes: null, meaning: null
    };

    /* ---- persistent fade state ---- */
    var KEY = 'kt-raf-' + pack.id;
    var mem = B.store(KEY) || {};
    mem.units = mem.units || {}; mem.withAid = mem.withAid || {}; mem.noAid = mem.noAid || {}; mem.next = mem.next || {}; mem.round = mem.round || 0; mem.history = mem.history || [];
    function save() { B.store(KEY, mem); }
    function us(id) { return mem.units[id] || (mem.units[id] = { state: 'tap', clean: [] }); }
    function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); enterMode(); },
      onVariant: function () { render(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card ra-stage' });
    var side = h('aside', { class: 'ra-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'ra-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    var warned = false;
    function speak(text) {
      if (!B.speak(text, pack.speech) && !warned) { warned = true; st.msg = { t: L('这个浏览器不能播放语音：请大人读出来。', 'This browser cannot play speech: ask an adult to read it aloud.'), tone: 'warn' }; render(); }
    }

    /* ---- passages and rounds ---- */
    function groupPassages() { return pack.passages.filter(function (p) { return !st.group || p.tag === st.group; }); }
    function unitsIn(p) { var seen = {}, out = []; p.tokens.forEach(function (t) { if (t && t.u && !seen[t.u]) { seen[t.u] = 1; out.push(t.u); } }); return out; }
    function fadeTargets(p) { return unitsIn(p).filter(function (id) { return !U[id].keep; }); }
    function withAidCount(p) { return fadeTargets(p).filter(function (id) { return us(id).state !== 'removed'; }).length; }
    function checkId(u) { return 'chk:' + st.passage.id + '#' + st.round + ':' + u; }
    function startPassage() {
      var list = groupPassages();
      if (!list.length) { st.passage = null; render(); return; }
      var gk = st.group || '_';
      var i = (mem.next[gk] || 0) % list.length;
      mem.next[gk] = i + 1; mem.round += 1; save();
      st.passage = list[i]; st.round = mem.round; st.phase = 'read'; st.peeked = {}; st.allShown = false; st.checks = []; st.cIdx = 0; st.roundWrong = {}; st.missed = {}; st.msg = null; st.changes = null; st.meaning = null; st.answered = null;
      st.startCount = withAidCount(st.passage);
      B.emit('view', { passage: st.passage.id, round: st.round, withAid: st.startCount, targets: fadeTargets(st.passage).length });
      render();
    }
    function visible(id) {
      if (st.allShown || st.peeked[id]) return true;
      return us(id).state === 'shown';
    }
    function peek(id) {
      var u = U[id];
      if (st.mode !== 'read' || !st.passage) return;
      if (st.phase === 'done') { if (pack.aid !== 'pinyin') speak(u.say || (pack.aid === 'kana' ? u.aid : u.text)); return; }
      if (!visible(id) || u.aid === null) {
        if (!st.peeked[id]) { st.peeked[id] = true; B.reveal(checkId(id)); }
        if (u.aid === null || pack.aid === 'ipa') speak(u.say || u.text);
        else if (pack.aid === 'kana') speak(u.aid);
        render();
      }
    }
    function showAll() {
      if (!st.allShown) {
        st.allShown = true;
        if (st.phase !== 'done') {
          unitsIn(st.passage).forEach(function (id) { B.hint(checkId(id), 'all-shown'); });
          st.msg = { t: L('全段注音已打开：这一段后面的作答都不算独立。', 'All readings are now shown: no answer in this passage counts as independent from here on.'), tone: 'warn' };
        }
        B.emit('request_hint', { passage: st.passage.id, round: st.round, all: true, beforeDone: st.phase !== 'done' });
      }
      render();
    }
    function startChecks() {
      var ids = fadeTargets(st.passage);
      var peeked = KTBlock.shuffle(ids.filter(function (id) { return st.peeked[id]; }));
      var rest = KTBlock.shuffle(ids.filter(function (id) { return !st.peeked[id]; }));
      var n = Math.min(ids.length, child() ? 2 : 4);
      var pick = peeked.slice(0, Math.floor(n / 2)).concat(rest).slice(0, n);
      if (pick.length < n) pick = pick.concat(peeked.slice(Math.floor(n / 2))).slice(0, n);
      st.checks = KTBlock.shuffle(pick).map(function (id) {
        var u = U[id];
        var aidState = st.allShown ? 'all-shown' : st.peeked[id] ? 'peeked' : us(id).state === 'shown' ? 'shown' : 'hidden';
        if (aidState === 'shown') B.hint(checkId(id), 'aid-shown');
        var right = u.ans != null ? u.ans : u.aid;
        var opts = KTBlock.shuffle([{ show: right, ok: true }].concat(u.opts.map(function (o) { return { show: o[0], kind: o[1] }; })));
        if (child()) opts = KTBlock.shuffle([opts.find(function (o) { return o.ok; })].concat(opts.filter(function (o) { return !o.ok; }).slice(0, 1)));
        return { id: id, aidState: aidState, opts: opts, done: false, picked: null };
      });
      st.typed = !!pack.input && !child();
      st.phase = 'check'; st.cIdx = 0; st.msg = null;
      B.emit('view', { passage: st.passage.id, phase: 'check', items: st.checks.map(function (c) { return c.id; }) });
      render();
      focusInput();
    }
    function focusInput() { setTimeout(function () { var i = stage.querySelector('.typein input'); if (i) i.focus(); }, 0); }
    function judgeTyped(u, val) {
      var right = u.ans != null ? u.ans : u.aid;
      if (pack.input === 'pinyin') {
        var a = py(val), b = py(right);
        if (!a.letters) return null;
        if (a.letters === b.letters && a.tones === b.tones) return { ok: true };
        for (var i = 0; i < u.opts.length; i++) { var o = py(u.opts[i][0]); if (o.letters === a.letters && o.tones === a.tones) return { ok: false, kind: u.opts[i][1], said: u.opts[i][0] }; }
        if (a.letters === b.letters) return { ok: false, kind: 'tone', said: val, toneMissing: !a.tones };
        return { ok: false, kind: null, said: val };
      }
      var k = normKana(val);
      if (!k) return null;
      if (k === normKana(right)) return { ok: true };
      for (var j = 0; j < u.opts.length; j++) if (normKana(u.opts[j][0]) === k) return { ok: false, kind: u.opts[j][1], said: u.opts[j][0] };
      return { ok: false, kind: null, said: k };
    }
    function answerCheck(c, res, format) {
      if (c.done) return;
      var u = U[c.id], right = u.ans != null ? u.ans : u.aid;
      var rec = B.attempt(checkId(c.id), { correct: res.ok, response: { unit: c.id, answer: res.said || res.answer || right, format: format, aidState: c.aidState, peeked: !!st.peeked[c.id] } });
      c.done = true; c.ok = res.ok; c.independent = res.ok && !rec.first.assisted && c.aidState === 'hidden';
      if (res.ok) {
        if (c.independent) { mem.noAid[c.id] = true; delete mem.withAid[c.id]; }
        else if (!mem.noAid[c.id]) mem.withAid[c.id] = true;
        save();
        st.msg = { t: (c.independent ? L('对，而且没看注音。', 'Right, and without the reading aid.') : L('对。不过这一次', 'Right. But this time ') + aidStateText(c.aidState) + L('，记为“带注音读对”。', ', so it counts as “right with the aid”.')), tone: '' };
      } else {
        st.roundWrong[c.id] = true; st.missed[c.id] = true;
        st.ownErrors.push({ id: 'own:' + st.round + ':' + c.id, u: c.id, said: res.said, kind: res.kind || null });
        var ref = sameCharKnown(c.id);
        if (ref) B.emit('compare', { item: checkId(c.id), with: ref });
        st.msg = { t: (pack.aid === 'dots' ? L('这个词是 ', 'The word is ') + u.text + (u.aid === null ? '' : ' ' + right) : L('正确读法：', 'The right reading: ') + right) + (res.toneMissing ? L('（没有写声调。用调号或数字 1–4 写上声调）', ' (no tone given: add tone marks or the numbers 1–4)') : '') +
          (ref ? L('。对照你读对过的：', '. Compare with one you have read right: ') + U[ref].text + ' ' + (U[ref].ans || U[ref].aid) : '') + L('。它在原文里已经划了波浪线。', '. It is now underlined in the passage.'), tone: 'bad' };
      }
      render();
    }
    function aidStateText(a) { return a === 'shown' ? L('注音是显示着的', 'the aid was showing') : a === 'peeked' ? L('你偷看过注音', 'you peeked at the aid') : a === 'all-shown' ? L('全段注音打开过', 'all readings had been shown') : L('看过提示', 'a hint was used'); }
    function sameCharKnown(id) {
      var t = U[id].text;
      return Object.keys(U).find(function (k) { return k !== id && (mem.noAid[k] || mem.withAid[k]) && U[k].text.split('').some(function (ch) { return /[\u3400-\u9fff]/.test(ch) && t.indexOf(ch) >= 0; }); }) || null;
    }
    function nextCheck() {
      st.cIdx++; st.msg = null;
      if (st.cIdx >= st.checks.length) {
        if (st.passage.q) { st.phase = 'question'; st.meaning = { picked: null, opts: st.passage.q.opts.map(function (o, i) { return { o: o, ok: i === st.passage.q.ok }; }) }; st.meaning.opts = KTBlock.shuffle(st.meaning.opts); }
        else finishRound();
      }
      render(); focusInput();
    }
    function answerMeaning(i) {
      var m = st.meaning, o = m.opts[i];

        h('span', { text: L('显示：上方直接有注音（偷看过或读错过）', 'Shown: the aid is visible (after a peek or a misreading)') }),
        h('span', { text: L('点开：字下有一个小点，点一下才显示', 'Click to show: a small dot under the word') }),
        h('span', { text: L('撤除：没有小点。仍然可以点，但点了会恢复注音', 'Removed: no dot. You can still click, but that brings the aid back') }),
        h('span', { text: L('👁 = 这一段偷看过；波浪线 = 抽查读错；★ = 一直可以点看（人名等）', '👁 = peeked in this passage; wavy line = misread in a check; ★ = always clickable (names etc.)') })]));
      if (st.mode === 'sort' || st.mode === 'keep') side.append(h('div', { class: 'kb-card reverse' }, [h('b', { text: L('反向那一半', 'The reverse half') }),
        h('p', { class: 'kb-note', text: L('多音字换了词、熟字训、人名地名，注音可以一直保留可点；读音对了，意思仍可能错，所以每段都有意思题。', 'A polyphone in a new word, jukujikun and names can keep a clickable aid; a right reading can still go with a wrong meaning, which is why every passage has a meaning question.') })]));
    }
    function render() {
      renderBar(); stage.innerHTML = '';
      if (st.mode === 'read') renderRead(); else renderQueue();
      renderSide();
    }

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
      var n = parseInt(e.key, 10);
      var btns = [].slice.call(stage.querySelectorAll('.opts .opt:not(:disabled)'));
      if (n >= 1 && n <= 9 && btns.length && !stage.querySelector('.opt.right')) { var b = stage.querySelectorAll('.opts .opt')[n - 1]; if (b && !b.disabled) { e.preventDefault(); b.click(); } }
      else if (e.key === 'Enter' && e.target === document.body) { var p = stage.querySelector('.tools .kb-btn.primary'); if (p) { e.preventDefault(); p.click(); } }
    });

    if (st.mode === 'read') startPassage(); else enterMode();
  }
})();
</script>
</body>
</html>
