<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading select</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .rs-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .rs-layout { grid-template-columns: 1fr; } }
  .rs-side { display: grid; gap: 12px; }
  .rs-stage { display: grid; gap: 12px; }
  .rs-stage .kb-prompt { margin: 0; }
  .passage { font-size: calc(var(--glyph) * 1.05); line-height: 2.7; overflow-wrap: anywhere; }
  .passage rt { font-size: .5em; color: var(--accent); }
  .passage ruby.fixed rt { color: var(--muted); }
  .passage mark { background: var(--warn-soft); color: inherit; border-radius: 4px; }
  .slot { border: 0; border-bottom: 3px solid var(--accent); background: var(--accent-soft); border-radius: 6px 6px 0 0; padding: 0 3px; margin: 0 1px; font: inherit; line-height: inherit; color: inherit; position: relative; }
  .slot.active { outline: 3px solid var(--accent); outline-offset: 1px; }
  .slot.pass { background: transparent; border-bottom-color: var(--t2); }
  .slot.ast { border-bottom-color: var(--warn); }
  .slot.bad { border-bottom-color: var(--bad); }
  .slot rt { color: var(--accent); }
  .slot .no { position: absolute; left: -.2em; bottom: -.9em; font-size: .35em; color: var(--muted); line-height: 1; }
  .slot .first { position: absolute; right: -.5em; bottom: -1.1em; font-size: .32em; line-height: 1.2; padding: 0 3px; border-radius: 4px; background: var(--bad-soft); color: var(--bad); white-space: nowrap; }
  .ref { color: var(--muted); }
  .ref .passage { font-size: calc(var(--glyph) * .9); line-height: 2.4; }
  .row { display: grid; gap: 6px; }
  .row h3 { font-size: .85rem; margin: 0; color: var(--muted); font-weight: 600; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .opts.bases { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .opt { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 8px; display: flex; gap: 6px; align-items: center; min-height: 44px; text-align: left; }
  .opt .num { font-size: .72rem; color: var(--muted); min-width: 1em; }
  .opt .rd { font-size: 1.25rem; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt.rev { border-left: 4px solid var(--warn); }
  .opt.right { border-color: var(--t2); }
  .opt:disabled { cursor: default; opacity: .75; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .fam { font-size: .92rem; margin: 0; padding-left: 18px; }
  .flag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .reverse { border-left: 4px solid var(--warn); }
  .cards { display: flex; flex-wrap: wrap; gap: 6px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: .9rem; }
  .card.nomemo { border-color: var(--warn); background: var(--warn-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .8rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  textarea { width: 100%; min-height: 70px; font-size: 1.15rem; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .occ { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
  .occ .ctx { font-size: 1.15rem; }
  .occ .ctx mark { background: var(--accent-soft); color: inherit; padding: 0 3px; border-radius: 4px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick .kb-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .done { font-size: 2.4rem; text-align: center; }
  .kb-bar .kb-variant { flex-wrap: wrap; min-width: 0; max-width: 100%; }
  .kb-bar select { max-width: 100%; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Reading select (prim:reading-select). Packs: data/reading-select.js (format in its header).
 * Modes: pick (step 1: choose a reading and a basis for each marked place in a short text), shift (step 2: the
 * same form in a new sentence — does the reading change, and why), make (step 3: write a sentence with the
 * form twice in two readings; checked only against the pack's controlled word list, otherwise self-report).
 * A slot passes only if the reading AND the basis are acceptable. The reverse half is the "no rule, learn it"
 * basis plus slots where two readings are both right. */
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'reading-select-zh';
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || { file: 'data/reading-select.js', block: 'reading-select' };
  var app = document.getElementById('app');
  if (entry.block !== 'reading-select') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var s = document.createElement('script');
  s.src = entry.file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + entry.file; };
  document.head.appendChild(s);

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'reading-select', primitive: 'prim:reading-select', title: title, set: pack.id });
    document.title = title + ' · Reading select';
    var bases = pack.bases, baseIds = Object.keys(bases), groups = pack.groups || {}, groupIds = Object.keys(groups);
    var LETTERS = 'abcdefgh';
    var tlang = pack.lang === 'zh' ? 'zh-CN' : pack.lang;
    function child() { return B.variant === 'child'; }
    var modes = [{ id: 'pick', label: L('先读后定', 'Read, then decide') }, { id: 'shift', label: L('换句子', 'New sentence') }, { id: 'make', label: L('自己造句', 'Write your own') }];
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'pick',
      group: groups[params.get('focus')] ? params.get('focus') : (groupIds[0] || null),
      pIdx: 0, passage: null, slots: [], active: 0, sel: {}, res: {}, hints: {}, msg: null,
      queue: [], qIdx: 0, cards: [], solvedCtx: {}, make: null, makeN: 0
    };
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); enterMode(); },
      onVariant: function () { render(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card rs-stage' });
    var side = h('aside', { class: 'rs-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'rs-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    /* ---- slots ---- */
    function slotsOf(tokens) { return tokens.filter(function (t) { return t && t.s; }).map(function (t) { return t.s; }); }
    var FAM = T(pack, 'fam') || {};
    function fam(slot) { return FAM[slot.f || slot.t] || {}; }
    function itemId(slot) { return (st.mode === 'shift' ? 'shift:' : 'pick:') + slot.id; }
    function basisFaded(slot) { return child() || (st.solvedCtx[slot.t] || []).length >= 2; }
    function setPassage() {
      var list = pack.passages.filter(function (p) { return !st.group || p.tag === st.group; });
      st.passage = list[st.pIdx % list.length];
      st.slots = slotsOf(st.passage.tokens); st.active = 0; st.sel = {}; st.res = {}; st.hints = {}; st.msg = null;
      B.emit('view', { passage: st.passage.id, slots: st.slots.map(function (x) { return x.id; }) });
      render(); focusSlot();
    }
    function enterMode() {
      st.msg = null;
      if (st.mode === 'pick') { setPassage(); return; }
      if (st.mode === 'shift') {
        st.queue = KTBlock.shuffle(pack.shift).slice(0, child() ? 5 : pack.shift.length); st.qIdx = 0;
        loadShift(); return;
      }
      st.make = { c: null, text: '', occ: [], picks: {}, result: null };
      render();
    }
    function loadShift() {
      var it = st.queue[st.qIdx];
      st.sel = {}; st.res = {}; st.hints = {}; st.msg = null; st.active = 0;
      st.slots = it ? slotsOf(it.tokens) : [];
      if (it) B.emit('view', { item: 'shift:' + st.slots[0].id, mode: 'shift' }); else B.emit('complete', { mode: 'shift', items: st.queue.length });
      render(); focusSlot();
    }
    function focusSlot() { setTimeout(function () { var b = stage.querySelector('.slot.active'); if (b) b.focus(); }, 0); }
    function activate(i) { st.active = i; st.msg = null; B.emit('highlight', { item: itemId(st.slots[i]) }); render(); focusSlot(); }
    function choose(kind, v) {
      var slot = st.slots[st.active]; if (!slot) return;
      var r = st.res[slot.id]; if (r && r.pass) return;
      var sel = st.sel[slot.id] || (st.sel[slot.id] = {});
      sel[kind] = v;
      B.emit('select', { item: itemId(slot), reading: kind === 'r' ? v : undefined, basis: kind === 'b' ? v : undefined });
      if (kind === 'r' && pack.lang === 'ja') B.speak(v, pack.speech);
      if (sel.r && (sel.b || basisFaded(slot))) submit(); else render();
    }
    function submit() {
      var slot = st.slots[st.active], sel = st.sel[slot.id] || {};
      var needB = !basisFaded(slot);
      if (!sel.r || (needB && !sel.b)) return;
      var rOk = slot.ok.indexOf(sel.r) >= 0, bOk = !needB || slot.b.indexOf(sel.b) >= 0;
      var prev = st.res[slot.id];
      if (prev && !prev.pass) B.hint(itemId(slot), prev.rOk ? 'basis-shown' : 'family-shown');
      var rec = B.attempt(itemId(slot), { correct: rOk && bOk, response: { reading: sel.r, basis: needB ? sel.b : null, readingOk: rOk, basisOk: bOk, basisAsked: needB } });
      var res = st.res[slot.id] = { pass: rOk && bOk, rOk: rOk, bOk: bOk, first: prev ? prev.first : { r: sel.r, b: sel.b } };
      if (needB && sel.b === 'memo' && !st.cards.some(function (c) { return c.id === slot.id; })) {
        st.cards.push({ id: slot.id, t: slot.t, r: slot.ok[0], memoOk: slot.b.indexOf('memo') >= 0 });
        B.emit('explain', { item: itemId(slot), basis: 'memo', exceptionCard: true, cards: st.cards.length });
      }
      if (res.pass) {
        var status = B.status(itemId(slot));
        if (status === 'independent' && needB) { var l = st.solvedCtx[slot.t] || (st.solvedCtx[slot.t] = []); if (l.indexOf(slot.id) < 0) l.push(slot.id); }
        st.msg = { t: L('对：', 'Right: ') + slot.t + ' ' + sel.r + (needB ? L('，依据：', ', because: ') + T(bases[sel.b], 'label') : '') + (status === 'independent' ? '' : L('（不是第一次就对，记为提示后完成）', ' (not right first time; recorded as assisted)')) + (slot.note ? L('。', '. ') + T(slot, 'note') : ''), tone: slot.b.indexOf('memo') >= 0 && slot.b.length === 1 ? 'warn' : '' };
        if (st.mode === 'shift') st.msg.t += ' ' + shiftChange();
        if (needB && (st.solvedCtx[slot.t] || []).length === 2 && status === 'independent') st.msg.t += L(' 「' + slot.t + '」已在两个语境里第一次就选对，以后只问读音，不再问依据。', ' 「' + slot.t + '」 has now been right first time in two contexts; from now on only its reading is asked, not the basis.');
        if (pack.lang === 'ja') B.speak(sel.r, pack.speech);
      } else if (!rOk) {
        var f = fam(slot)[sel.r];
        B.emit('compare', { item: itemId(slot), reading: sel.r, family: f || null });
        st.msg = { t: f ? L('“' + sel.r + '”这个读音出现在这些词里：' + f + '。和这里一样吗？再选一次。', '“' + sel.r + '” is the reading in these words: ' + f + '. Is this place like them? Choose again.') : L('“' + sel.r + '”不是「' + slot.t + '」在常用词里的读法。再选一次。', '“' + sel.r + '” is not a reading of 「' + slot.t + '」 in common words. Choose again.'), tone: 'warn' };
        delete sel.r;
      } else {
        st.msg = { t: L('读音对了，但依据不对，不记为通过。这里可以说：', 'The reading is right but the reason is not, so it does not pass. A reason that works here: ') + slot.b.map(function (b) { return T(bases[b], 'label'); }).join(L(' 或 ', ' or ')) + L('。再选一次依据。', '. Choose the reason again.'), tone: 'warn' };
        delete sel.b;
      }
      render();
      if (rec && res.pass) focusSlot();
    }
    function shiftChange() {
      var it = st.queue[st.qIdx], refR = it.ref.filter(function (t) { return t && t.r; })[0].r, slot = st.slots[0];
      return slot.ok.indexOf(refR) >= 0 && slot.ok.length === 1 ? L('读音和原来一样，没有变。', 'The reading is the same as before: no change.') : slot.ok.indexOf(refR) >= 0 ? L('原来的读音这里也可以。', 'The earlier reading also works here.') : L('读音变了：原来是 ' + refR + '。', 'The reading changed: it was ' + refR + '.');
    }
    function hint(n) {
      var slot = st.slots[st.active]; if (!slot) return;
      var hs = st.hints[slot.id] || (st.hints[slot.id] = {});
      if (hs[n]) return;
      hs[n] = true; B.hint(itemId(slot), n);
      if (n === 1) st.msg = { t: pack.lang === 'ja' ? L('想一想：这个字在这里是哪个词的一部分？后面有没有送假名？前面有没有数字？', 'Think: which word is this kanji part of here? Is there okurigana after it? A number before it?') : L('想一想：这个字在这里是哪个词的一部分？是动词、副词还是形容词？前面有没有数字？', 'Think: which word is this character part of here? Is it a verb, an adverb or an adjective? Is there a number before it?'), tone: 'warn' };
      render();
    }
    function nextSlot() {
      var i = st.slots.findIndex(function (x, j) { return j > st.active && !(st.res[x.id] && st.res[x.id].pass); });
      if (i < 0) i = st.slots.findIndex(function (x) { return !(st.res[x.id] && st.res[x.id].pass); });
      if (i >= 0) activate(i);
      else if (st.mode === 'pick') { B.emit('complete', { passage: st.passage.id }); st.msg = null; render(); }
    }

    /* ---- make (step 3) ---- */
    function analyse() {
      var m = st.make, text = m.text, occ = [];
      for (var i = 0; i < text.length; i++) if (text.substr(i, m.c.c.length) === m.c.c) occ.push(i);
      m.occ = occ.map(function (pos) {
        var best = null;
        m.c.words.forEach(function (w) {
          var k = w[0].indexOf(m.c.c);
          while (k >= 0) {
            if (text.substr(pos - k, w[0].length) === w[0] && (!best || w[0].length > best.w[0].length)) best = { w: w, conflict: false };
            else if (best && text.substr(pos - k, w[0].length) === w[0] && w[0].length === best.w[0].length && w[1] !== best.w[1]) best.conflict = true;
            k = w[0].indexOf(m.c.c, k + 1);
          }
        });
        return { pos: pos, known: best && !best.conflict ? best.w : null };
      });
      m.picks = {}; m.result = null;
      B.emit('select', { item: 'make', char: m.c.c, occurrences: occ.length });
      render();
    }
    function submitMake() {
      var m = st.make, occ = m.occ.slice(0, 2), id = 'make:' + m.c.c + '#' + (++st.makeN);
      var picks = occ.map(function (o, i) { return m.picks[i] || {}; });
      if (occ.length < 2) { m.result = { t: L('「' + m.c.c + '」要在句子里出现两次。', '「' + m.c.c + '」 has to appear twice in the sentence.'), tone: 'warn' }; render(); return; }
      if (picks.some(function (p) { return !p.r || (!child() && !p.b); })) { m.result = { t: L('两处都要标出读音' + (child() ? '' : '和依据') + '。', 'Mark the reading' + (child() ? '' : ' and the reason') + ' for both places.'), tone: 'warn' }; render(); return; }
      var same = picks[0].r === picks[1].r;
      var verdict = occ.map(function (o, i) { if (!o.known) return null; return { r: o.known[1] === picks[i].r, b: child() || o.known[2].indexOf(picks[i].b) >= 0, w: o.known }; });
      var response = { sentence: m.text, readings: picks.map(function (p) { return p.r; }), bases: picks.map(function (p) { return p.b || null; }), known: verdict.map(function (v) { return v ? v.w[0] : null; }) };
      if (same) {
        B.attempt(id, { correct: false, response: response });
        m.result = { t: L('两处标的是同一个读音。这一步要两个不同的读音；只换了意思、没换读音的不算。', 'Both places are marked with the same reading. This step needs two different readings; changing only the meaning does not count.') + knownText(verdict), tone: 'bad' };
      } else if (verdict.every(function (v) { return v; })) {
        var ok = verdict.every(function (v) { return v.r && v.b; });
        B.attempt(id, { correct: ok, response: response });
        m.result = { t: (ok ? L('核对过了，两处的读音和依据都成立。', 'Checked: both readings and both reasons hold.') : L('页面核对了这两处：', 'The page checked both places: ')) + knownText(verdict), tone: ok ? '' : 'bad' };
      } else {
        B.attempt(id, { correct: true, selfReport: true, response: response });
        m.result = { t: L('有一处所在的词不在页面的词表里，页面判断不了，这一句记为自评（不算作答）。', 'At least one place is in a word the page does not have in its list, so it cannot judge; this sentence is recorded as a self-report (not scored).') + knownText(verdict) + L(' 可以请老师或搭档看一下。', ' Ask a teacher or partner to look at it.'), tone: 'warn' };
      }
      render();
    }
    function knownText(verdict) {
      var parts = verdict.map(function (v, i) {
        if (!v) return null;
        return L('第 ' + (i + 1) + ' 处在“' + v.w[0] + '”里，读 ' + v.w[1] + (v.r ? '' : '（你标错了）') + (child() || v.b ? '' : '，依据可以是：' + v.w[2].map(function (b) { return T(bases[b], 'label'); }).join(' 或 ')), 'Place ' + (i + 1) + ' is in “' + v.w[0] + '”, read ' + v.w[1] + (v.r ? '' : ' (you marked it wrong)') + (child() || v.b ? '' : '; a reason that works: ' + v.w[2].map(function (b) { return T(bases[b], 'label'); }).join(' or ')));
      }).filter(Boolean);
      return parts.length ? ' ' + parts.join(L('；', '; ')) + L('。', '.') : '';
    }

    /* ---- render ---- */
    function tokensEl(tokens, interactive) {
      var slots = slotsOf(tokens), act = st.slots[st.active];
      var actIdx = -1;
      tokens.forEach(function (t, i) { if (t && t.s && act && t.s.id === act.id) actIdx = i; });
      var showCtx = act && st.hints[act.id] && st.hints[act.id][2];
      return h('div', { class: 'passage', lang: tlang }, tokens.map(function (t, i) {
        if (typeof t === 'string') {
          if (showCtx && interactive && (i === actIdx - 1 || i === actIdx + 1)) {
            var n = i === actIdx - 1 ? act.hl[0] : act.hl[1];
            if (n > 0) {
              if (i === actIdx - 1) return h('span', {}, [t.slice(0, t.length - n), h('mark', { text: t.slice(t.length - n) })]);
              return h('span', {}, [h('mark', { text: t.slice(0, n) }), t.slice(n)]);
            }
          }
          return document.createTextNode(t);
        }
        if (t.t) return h('ruby', { class: 'fixed' }, [t.t, h('rt', { text: t.r })]);
        var slot = t.s, k = slots.indexOf(slot), res = st.res[slot.id], sel = st.sel[slot.id] || {};
        var stat = B.status(itemId(slot));
        var cls = 'slot' + (interactive && st.slots[st.active] === slot ? ' active' : '') + (res && res.pass ? ' pass ' + (stat === 'independent' ? '' : 'ast') : res ? ' bad' : '');
        var shown = res && res.pass ? (st.sel[slot.id] || {}).r : (sel.r || '？');
        var firstWrong = res && res.first && slot.ok.indexOf(res.first.r) < 0 ? res.first.r : null;
        return h('button', { class: cls, onclick: interactive ? function () { activate(k); } : null, 'aria-label': L('第 ' + (k + 1) + ' 处：' + slot.t + '，候选：' + slot.r.join('、'), 'Place ' + (k + 1) + ': ' + slot.t + ', options: ' + slot.r.join(', ')) },
          [h('ruby', {}, [slot.t, h('rt', { text: shown })]), h('span', { class: 'no', 'aria-hidden': 'true', text: String(k + 1) }), firstWrong ? h('span', { class: 'first', title: L('第一次选的', 'First choice'), text: firstWrong }) : null]);
      }));
    }
    function feedbackEl(m) { return m ? h('div', { class: 'kb-feedback ' + (m.tone || ''), role: 'status', text: m.t }) : document.createTextNode(''); }
    function panel() {
      var slot = st.slots[st.active]; if (!slot) return document.createTextNode('');
      var res = st.res[slot.id], sel = st.sel[slot.id] || {}, needB = !basisFaded(slot), passed = res && res.pass;
      var hs = st.hints[slot.id] || {};
      var box = h('div', { class: 'row' });
      box.append(h('p', { class: 'kb-prompt' }, [L('第 ' + (st.active + 1) + ' 处「', 'Place ' + (st.active + 1) + ': 「'), h('b', { lang: tlang, text: slot.t }), L('」在这里怎么读？', '」 — how is it read here?') + (needB ? L('为什么？', ' Why?') : '')]));
      box.append(h('h3', { text: L('读音（数字键）', 'Reading (number keys)') }));
      box.append(h('div', { class: 'opts' }, slot.r.map(function (r, i) {
        return h('button', { class: 'opt' + (passed && slot.ok.indexOf(r) >= 0 ? ' right' : ''), 'aria-pressed': sel.r === r ? 'true' : 'false', disabled: passed, onclick: function () { choose('r', r); } }, [h('span', { class: 'num', text: String(i + 1) }), h('span', { class: 'rd', lang: tlang, text: r })]);
      })));
      if (needB) {
        box.append(h('h3', { text: L('依据（字母键）', 'Reason (letter keys)') }));
        box.append(h('div', { class: 'opts bases' }, baseIds.map(function (b, i) {
          return h('button', { class: 'opt' + (bases[b].reverse ? ' rev' : '') + (passed && slot.b.indexOf(b) >= 0 && sel.b === b ? ' right' : ''), 'aria-pressed': sel.b === b ? 'true' : 'false', disabled: passed, onclick: function () { choose('b', b); } }, [h('span', { class: 'num', text: LETTERS[i].toUpperCase() }), h('span', { text: T(bases[b], 'label') })]);
        })));
      } else if (!child()) box.append(h('p', { class: 'kb-note', text: L('「' + slot.t + '」已经两次在不同语境第一次就选对，这里只选读音。', '「' + slot.t + '」 has been right first time in two contexts, so only the reading is asked here.') }));
      if (hs[3]) {
        var f = fam(slot);
        box.append(h('ul', { class: 'fam', lang: tlang }, slot.r.map(function (r) { return h('li', { text: r + '：' + (f[r] || L('（常用词里没有这个读法）', '(not a reading in common words)')) }); })));
      }
      box.append(feedbackEl(st.msg));
      var tools = [];
      if (!passed) {
        tools.push(h('button', { class: 'kb-btn', disabled: !!hs[1], onclick: function () { hint(1); } }, L('提示 1：问一个问题', 'Hint 1: a question')));
        tools.push(h('button', { class: 'kb-btn', disabled: !!hs[2], onclick: function () { hint(2); } }, L('提示 2：标出关键的上下文', 'Hint 2: mark the deciding context')));
        tools.push(h('button', { class: 'kb-btn', disabled: !!hs[3], onclick: function () { hint(3); } }, L('提示 3：每个读音的例词', 'Hint 3: example words for each reading')));
      } else if (st.mode === 'pick') tools.push(h('button', { class: 'kb-btn primary', onclick: nextSlot }, L('下一处 →', 'Next place →')));
      else tools.push(h('button', { class: 'kb-btn primary', onclick: function () { st.qIdx++; loadShift(); } }, L('下一句 →', 'Next sentence →')));
      if (!passed && st.mode === 'shift') tools.push(h('button', { class: 'kb-btn', onclick: function () { st.qIdx++; loadShift(); } }, L('跳过', 'Skip')));
      box.append(h('div', { class: 'tools' }, tools));
      return box;
    }
    function renderBar() {
      bar.innerHTML = '';
      if (st.mode === 'pick') {
        if (groupIds.length > 1) bar.append(h('label', { class: 'kb-variant' }, [L('范围 ', 'Scope '), h('select', { onchange: function (e) { st.group = e.target.value; st.pIdx = 0; B.emit('highlight', { focus: st.group }); setPassage(); } },
          groupIds.map(function (g) { return h('option', { value: g, text: T(groups[g], 'label'), selected: st.group === g }); }))]));
        bar.append(h('button', { class: 'kb-btn', onclick: function () { st.pIdx++; setPassage(); } }, L('换一段', 'Next text')));
      } else if (st.mode === 'shift') {
        if (st.queue.length) bar.append(h('span', { class: 'kb-note', text: L('第 ' + Math.min(st.qIdx + 1, st.queue.length) + ' / ' + st.queue.length + ' 句', 'Sentence ' + Math.min(st.qIdx + 1, st.queue.length) + ' / ' + st.queue.length) }));
        bar.append(h('button', { class: 'kb-btn', onclick: enterMode }, L('换一轮', 'New round')));
      }
    }
    function renderPick() {
      var p = st.passage, left = st.slots.filter(function (x) { return !(st.res[x.id] && st.res[x.id].pass); }).length;
      stage.append(h('p', { class: 'kb-note', text: T(p, 'title') + L(' · 标出的 ' + st.slots.length + ' 处，还剩 ' + left + ' 处', ' · ' + st.slots.length + ' marked places, ' + left + ' left') }));
      stage.append(tokensEl(p.tokens, true));
      if (!left) {
        stage.append(h('div', { class: 'kb-feedback' }, L('这一段都定好了。上面带黄线的是不是第一次就对；红色小标签是第一次选的读音。', 'This text is done. Yellow lines mark places that were not right first time; the small red tag shows the first reading chosen.')),
          h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: function () { st.pIdx++; setPassage(); } }, L('下一段 →', 'Next text →'))]));
        return;
      }
      stage.append(panel());
    }
    function renderShift() {
      var it = st.queue[st.qIdx];
      if (!it) { stage.append(h('div', { class: 'done', text: '✔' }), h('p', { class: 'kb-prompt', text: L('这一轮做完了。', 'Round finished.') }), h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: enterMode }, L('再来一轮', 'Another round'))])); return; }
      stage.append(h('div', { class: 'ref' }, [h('span', { class: 'kb-note', text: L('原来的句子：', 'Before:') }), tokensEl(it.ref, false)]));
      stage.append(h('div', {}, [h('span', { class: 'kb-note', text: L('新的句子：读音变不变？', 'New sentence: does the reading change?') }), tokensEl(it.tokens, true)]));
      stage.append(panel());
    }
    function renderMake() {
      var m = st.make;
      stage.append(h('p', { class: 'kb-prompt', text: L('写一句话，让同一个字出现两次、读两个不同的音，再把两处的读音' + (child() ? '' : '和依据') + '标出来。', 'Write a sentence in which the same character appears twice with two different readings, then mark the reading' + (child() ? '' : ' and the reason') + ' for each place.') }));
      stage.append(h('div', { class: 'pick', role: 'group', 'aria-label': L('选一个字', 'Choose a character') }, pack.make.map(function (c) {
        return h('button', { class: 'kb-btn', lang: tlang, 'aria-pressed': m.c === c ? 'true' : 'false', onclick: function () { m.c = c; m.occ = []; m.result = null; B.emit('select', { item: 'make', char: c.c }); render(); } }, c.c);
      })));
      if (!m.c) { stage.append(h('p', { class: 'kb-note', text: L('先选一个字。', 'Choose a character first.') })); return; }
      stage.append(h('p', { class: 'kb-note', text: L('读音：', 'Readings: ') + m.c.readings.join(' / ') + ' · ' + T(m.c, 'hint') }));
      var ta = h('textarea', { lang: tlang, 'aria-label': L('你的句子', 'Your sentence'), oninput: function (e) { m.text = e.target.value; } });
      ta.value = m.text;
      stage.append(ta, h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: function () { m.text = ta.value.trim(); analyse(); } }, L('找出这个字', 'Find the character'))]));
      if (m.occ.length) {
        m.occ.slice(0, 2).forEach(function (o, i) {
          var p = m.picks[i] || (m.picks[i] = {});
          var ctx = h('div', { class: 'ctx', lang: tlang }, [m.text.slice(Math.max(0, o.pos - 4), o.pos), h('mark', { text: m.c.c }), m.text.slice(o.pos + m.c.c.length, o.pos + m.c.c.length + 4)]);
          stage.append(h('div', { class: 'occ' }, [h('b', { text: L('第 ' + (i + 1) + ' 处', 'Place ' + (i + 1)) }), ctx,
            h('div', { class: 'pick' }, m.c.readings.map(function (r) { return h('button', { class: 'kb-btn', lang: tlang, 'aria-pressed': p.r === r ? 'true' : 'false', disabled: !!m.result && m.result.final, onclick: function () { p.r = r; render(); } }, r); })),
            child() ? null : h('div', { class: 'pick' }, baseIds.map(function (b) { return h('button', { class: 'kb-btn', 'aria-pressed': p.b === b ? 'true' : 'false', onclick: function () { p.b = b; render(); } }, T(bases[b], 'label')); }))]));
        });
        if (m.occ.length > 2) stage.append(h('p', { class: 'kb-note', text: L('只看前两处。', 'Only the first two places are used.') }));
        stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: submitMake }, L('提交', 'Submit'))]));
      } else if (m.text) stage.append(h('p', { class: 'kb-note', text: L('句子里没有「' + m.c.c + '」。', 'The sentence does not contain 「' + m.c.c + '」.') }));
      stage.append(feedbackEl(m.result));
      stage.append(h('p', { class: 'kb-note', text: L('页面只认识词表里的词（' + m.c.words.map(function (w) { return w[0]; }).join('、') + '）。别的用法判断不了，会记为自评。', 'The page only knows the words in its list (' + m.c.words.map(function (w) { return w[0]; }).join(', ') + '). Anything else cannot be judged and is recorded as a self-report.') }));
    }
    function renderSide() {
      side.innerHTML = '';
      var recs = B.items().filter(function (it) { return /^(pick|shift):/.test(it.id); });
      var chips = recs.map(function (it) { var s0 = B.status(it.id); return h('span', { class: 'chip ' + (s0 === 'independent' ? 'ind' : s0 === 'wrong' ? 'bad' : 'ast'), text: (it.first && it.first.response && it.first.response.reading) || it.id }); });
      side.append(h('div', { class: 'kb-card' }, [h('b', { text: L('第一次的选择', 'First choices') }),
        chips.length ? h('div', { class: 'chips', lang: tlang }, chips) : h('p', { class: 'kb-note', text: L('还没有作答。', 'No answers yet.') }),
        h('p', { class: 'kb-note', text: L('读音和依据都对才算通过。绿 = 第一次就对；黄 = 看过提示或词族后改对；红 = 第一次不对。', 'A place passes only if both the reading and the reason are right. Green = right first time; yellow = right after a hint or the word family; red = wrong first time.') })]));
      var noMemo = st.cards.filter(function (c) { return !c.memoOk; });
      side.append(h('div', { class: 'kb-card reverse' }, [h('b', { text: L('例外卡（选了“要单独记”的）', 'Exception cards (marked “learn it as it is”)') }),
        st.cards.length ? h('div', { class: 'cards', lang: tlang }, st.cards.map(function (c) { return h('span', { class: 'card' + (c.memoOk ? '' : ' nomemo'), text: c.t + ' ' + c.r }); })) : h('p', { class: 'kb-note', text: L('还没有。', 'None yet.') }),
        st.cards.length >= 4 && noMemo.length ? h('p', { class: 'kb-note', text: L('例外卡越来越多了。黄色的几张其实有规律可循：' + noMemo.map(function (c) { return c.t; }).join('、') + '。回头看看它们的依据。', 'The exception cards are piling up. The yellow ones actually follow a pattern: ' + noMemo.map(function (c) { return c.t; }).join(', ') + '. Go back and look at their reasons.') }) : null,
        h('p', { class: 'kb-note', text: L('不是所有读音都能从语境推出来：熟字训、地名、口语和书面两读，只能单独记；也有两个读音都对的地方。', 'Not every reading can be worked out from context: jukujikun, place names and spoken-vs-written pairs have to be learned, and sometimes two readings are both right.') })]));
    }
    function render() {
      renderBar(); stage.innerHTML = '';
      if (st.mode === 'pick') renderPick(); else if (st.mode === 'shift') renderShift(); else renderMake();
      renderSide();
    }

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (st.mode === 'make') return;
      var slot = st.slots[st.active]; if (!slot) return;
      var n = parseInt(e.key, 10), li = LETTERS.indexOf(e.key.toLowerCase());
      if (n >= 1 && n <= slot.r.length) { e.preventDefault(); choose('r', slot.r[n - 1]); }
      else if (li >= 0 && li < baseIds.length && !basisFaded(slot)) { e.preventDefault(); choose('b', baseIds[li]); }
      else if (e.key === 'Enter' && st.res[slot.id] && st.res[slot.id].pass) { e.preventDefault(); var b = stage.querySelector('.tools .kb-btn.primary'); if (b) b.click(); }
    });

    enterMode();
  }
})();
</script>
</body>
</html>
