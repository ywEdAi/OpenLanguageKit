<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Contrast</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .sc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .sc-layout { grid-template-columns: minmax(0, 1fr); } }
  .sc-layout > * { min-width: 0; }
  .sc-side { display: grid; gap: 12px; }
  .sc-stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; justify-items: center; text-align: center; }
  .sc-stage .kb-prompt { margin: 0; }
  .sc-play { font-size: 1.15rem; padding: 10px 26px; }
  [data-variant="child"] .sc-play { font-size: 1.5rem; padding: 14px 34px; }
  .sc-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 560px; }
  .sc-card { border: 2px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 130px; justify-content: center; position: relative; }
  .sc-card .pic { font-size: 2.6rem; line-height: 1.15; }
  [data-variant="child"] .sc-card { min-height: 180px; }
  [data-variant="child"] .sc-card .pic { font-size: 4.6rem; }
  .sc-card .pic.num { font-weight: 700; font-size: 2.2rem; }
  [data-variant="child"] .sc-card .pic.num { font-size: 3.6rem; }
  .sc-card .word { font-size: 1.5rem; font-weight: 600; }
  .sc-card .py { font-size: .95rem; color: var(--muted); }
  .sc-card .gl { font-size: .85rem; color: var(--muted); }
  .sc-card .key { position: absolute; top: 6px; left: 8px; font-size: .7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .sc-card.right { border-color: var(--accent); background: var(--accent-soft); }
  .sc-card.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
  .sc-card:disabled { cursor: default; color: inherit; }
  .sc-card.wiggle .pic { animation: sc-hop .5s ease-in-out 3; }
  @keyframes sc-hop { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-14px) rotate(-8deg); } 60% { transform: translateY(-4px) rotate(6deg); } }
  mark.d { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--warn); }
  mark.gap { display: inline-block; width: .7em; height: 1em; vertical-align: -0.1em; background: var(--warn-soft); box-shadow: inset 0 -2px 0 var(--warn); border-radius: 3px; }
  .sc-flip { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 1.3rem; }
  .sc-flip span small { display: block; font-size: .75rem; color: var(--muted); }
  .sc-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 620px; }
  .sc-opt { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 10px 8px; text-align: left; display: flex; gap: 8px; align-items: flex-start; }
  .sc-opt .n { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-top: 2px; }
  .sc-opt.right { background: var(--accent-soft); border-color: var(--accent); }
  .sc-opt.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .sc-opt:disabled { cursor: default; }
  .sc-ref { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .sc-ref .tag { font-size: .8rem; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sc-mx { border-collapse: collapse; width: 100%; font-size: .85rem; }
  .sc-mx th, .sc-mx td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  .sc-mx th { font-weight: 600; color: var(--muted); }
  .sc-mx td.hit { background: var(--accent-soft); }
  .sc-mx td.miss { background: var(--bad-soft); }
  .sc-status { font-size: .88rem; margin: 6px 0 0; }
  .sc-status.ok { color: var(--accent); }
  .sc-status.warn { color: var(--warn); }
  .sc-list { margin: 4px 0 0; padding-left: 18px; font-size: .85rem; }
  .sc-list li { margin: 2px 0; }
  .sc-screen { width: 100%; max-width: 560px; border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px 12px; display: grid; gap: 10px; justify-items: center; }
  .sc-screen.speaker { border-color: var(--warn); }
  .sc-screen.listener { border-color: var(--accent); }
  .sc-screen .who { font-size: .8rem; color: var(--muted); }
  .sc-big { font-size: 2.2rem; font-weight: 700; }
  .flag { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .reverse { border-left: 4px solid var(--warn); }
  .sc-src { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: .9rem; }
  .done { font-size: 2.6rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'sound-contrast-en';
  var reg = (window.KT_REGISTRY && KT_REGISTRY.packs) || {};
  var entry = reg[setId] || {};
  if (entry.block && entry.block !== 'sound-contrast') { document.getElementById('app').textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var file = entry.file || 'data/sound-contrast.js';   // fallback while the registry does not list the pack yet
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else document.getElementById('app').textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; };
  s.onerror = function () { document.getElementById('app').textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'sound-contrast', primitive: 'prim:sound-contrast', title: title, set: pack.id });
    document.title = title + ' · Sound Contrast';
    var showGloss = KTBlock.lang !== pack.lang;
    var modes = [{ id: 'listen', label: L('听辨', 'Which one?') }, { id: 'sort', label: L('归类', 'Sort the sound') }, { id: 'say', label: L('说给人听', 'Say it to someone') }];
    var axes = pack.axes;
    var axisById = {}; axes.forEach(function (a) { axisById[a.id] = a; });
    var focus = params.get('focus');
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'listen',
      axis: axisById[focus] ? focus : (B.variant === 'child' ? 'child' : axes[0].id),
      queue: [], idx: 0, item: null, round: 0,
      mx: {},        // axis -> {aa, ab, ba, bb}  (heard x, chose y), first attempts of step 1 only
      same: {},      // axis -> {n, saidDiff}
      say: {}        // axis -> [{target, heard, src, ok}]
    };
    function child() { return B.variant === 'child'; }
    function childPairs() { var out = []; axes.forEach(function (a) { a.pairs.forEach(function (p) { if (p.child) out.push({ axis: a, pair: p }); }); }); return out; }

    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); newRound(); },
      onVariant: function () { if (child() && st.axis !== 'child' && childPairs().length) st.axis = 'child'; if (!child() && st.axis === 'child') st.axis = axes[0].id; newRound(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card sc-stage' });
    var side = h('aside', { class: 'sc-side' });
    document.getElementById('app').append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'sc-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    /* ---- speech ---- */
    var warned = false;
    function say(w) { return w.say || w.text; }
    function note(t) { var c = stage.querySelector('.cap'); if (c) c.textContent = t || ''; }
    function speakText(text, opts) {
      opts = opts || {};
      var r = B.speak(text, opts.locale || pack.speech, opts);
      if (!r && !warned) { warned = true; note(L('这个浏览器不能播放语音：请换一个浏览器，或由老师现场读。', 'This browser cannot play speech: use another browser, or have a teacher read aloud.')); }
      return r;
    }
    function speakWord(w, opts) { return speakText(say(w), opts); }
    function seq(list) {
      var r = B.speakSequence(list.map(function (x) { return { text: say(x.w), rate: x.rate, pause: x.pause == null ? 450 : x.pause }; }), pack.speech);
      if (!r && !warned) { warned = true; note(L('这个浏览器不能播放语音。', 'This browser cannot play speech.')); }
      return r;
    }
    function hasExactVoice(locale) {
      try { return window.speechSynthesis.getVoices().some(function (v) { return v.lang.replace('_', '-') === locale; }); } catch (e) { return false; }
    }
    /** Play a variant: another locale if the device has that exact voice, otherwise slow speech. Returns the variant actually used. */
    function playVariant(w, v) {
      if (v.how === 'locale' && hasExactVoice(v.locale)) { speakText(say(w), { locale: v.locale }); return 'locale'; }
      speakText(say(w), { rate: 0.5 }); return 'rate';
    }
    function sayInstruction(zh, en) {   // child version: instructions are spoken, in the interface language
      speakText(L(zh, en), { locale: KTBlock.lang === 'en' ? 'en-US' : 'zh-CN' });
    }

    /* ---- words ---- */
    function word(p, side) { return side === 'third' ? p.third : p[side]; }
    function other(side) { return side === 'a' ? 'b' : 'a'; }
    function hlNodes(w) {
      var src = w.hl || w.text, out = [], re = /\[([^\]]*)\]/g, last = 0, m;
      while ((m = re.exec(src))) {
        if (m.index > last) out.push(src.slice(last, m.index));
        out.push(m[1] ? h('mark', { class: 'd', text: m[1] }) : h('mark', { class: 'gap', title: L('这里少一拍', 'a beat is missing here'), 'aria-label': L('（缺）', '(missing)') }));
        last = re.lastIndex;
      }
      if (last < src.length) out.push(src.slice(last));
      return out;
    }
    function isNum(pic) { return /^[0-9]+$/.test(pic || ''); }
    function cardBody(w, opt) {
      opt = opt || {};
      var kids = [];
      if (w.pic) kids.push(h('span', { class: 'pic' + (isNum(w.pic) ? ' num' : ''), 'aria-hidden': 'true', text: w.pic }));
      if (!child() || !w.pic) {
        kids.push(h('span', { class: 'word' }, opt.hl ? hlNodes(pack.lang === 'zh' ? { hl: w.text } : w) : (pack.lang === 'zh' ? w.text : w.text)));
        if (w.py) kids.push(h('span', { class: 'py' }, opt.hl ? hlNodes(w) : w.py));
        if (showGloss && T(w, 'gloss')) kids.push(h('span', { class: 'gl', text: T(w, 'gloss') }));
        if (w.nonword) kids.push(h('span', { class: 'gl', text: L('（不是常用词）', '(not an everyday word)') }));
      }
      return kids;
    }
    function wordLabel(w) { return (w.py ? w.text + ' ' + w.py : w.text) + (showGloss && T(w, 'gloss') ? ' (' + T(w, 'gloss') + ')' : ''); }

    /* ---- rounds ---- */
    function axisPairs() {
      if (st.axis === 'child') return childPairs();
      var a = axisById[st.axis];
      return a.pairs.map(function (p) { return { axis: a, pair: p }; });
    }
    function newRound() {
      st.round++;
      var list = axisPairs(), q = [], i, n;
      if (!list.length) { st.queue = []; st.idx = 0; begin(); return; }
      if (st.mode === 'listen') {
        n = child() ? 6 : 12;
        var sides = []; for (i = 0; i < n; i++) sides.push(i % 2 ? 'b' : 'a');
        sides = KTBlock.shuffle(sides);
        var pool = KTBlock.shuffle(list);
        for (i = 0; i < n; i++) {
          var pp = pool[i % pool.length];
          q.push({ kind: 'ab', axis: pp.axis, pair: pp.pair, side: sides[i], left: Math.random() < 0.5 ? 'a' : 'b', id: 'ab:' + pp.axis.id + ':' + pp.pair.id + ':' + sides[i] + ':' + st.round + '.' + i });
        }
        if (!child()) {
          var sd = KTBlock.shuffle(list);
          var mk = function (pp, second, k) { var first = Math.random() < 0.5 ? 'a' : 'b'; return { kind: 'sd', axis: pp.axis, pair: pp.pair, first: first, second: second === 'same' ? first : other(first), truth: second, id: 'sd:' + pp.axis.id + ':' + pp.pair.id + ':' + second + ':' + st.round + '.' + k }; };
          var extra = [mk(sd[0], 'same', 0), mk(sd[1 % sd.length], 'same', 1), mk(sd[2 % sd.length], 'diff', 2)];
          extra.forEach(function (x) { q.splice(1 + Math.floor(Math.random() * (q.length - 1)), 0, x); });
        }
      } else if (st.mode === 'sort') {
        var types = [];
        var withThird = list.filter(function (x) { return x.pair.third; });
        var variants = [];
        list.forEach(function (x) { (x.axis.variants || []).forEach(function (v) { if (v.pair === x.pair.id && variants.indexOf(v) < 0) variants.push({ v: v, x: x }); }); });
        KTBlock.shuffle(variants).slice(0, 2).forEach(function (vv) { types.push({ t: 'variant', x: vv.x, ref: vv.v.side, v: vv.v }); });
        KTBlock.shuffle(withThird).slice(0, 2).forEach(function (x) { types.push({ t: 'third', x: x }); });
        var rest = KTBlock.shuffle(list);
        types.push({ t: 'same', x: rest[0] });
        var k = 0;
        while (types.length < (child() ? 6 : 9)) { types.push({ t: 'other', x: rest[(k + 1) % rest.length] }); k++; }
        q = KTBlock.shuffle(types).map(function (o, j) {
          var ref = o.ref || (Math.random() < 0.5 ? 'a' : 'b');
          return { kind: 'sort', axis: o.x.axis, pair: o.x.pair, ref: ref, test: o.t, variant: o.v || null, id: 'sort:' + o.x.axis.id + ':' + o.x.pair.id + ':' + o.t + ':' + st.round + '.' + j };
        });
      } else {
        n = 5;
        var pl = KTBlock.shuffle(list);
        for (i = 0; i < n; i++) { var p3 = pl[i % pl.length]; q.push({ kind: 'say', axis: p3.axis, pair: p3.pair, side: Math.random() < 0.5 ? 'a' : 'b', left: Math.random() < 0.5 ? 'a' : 'b', phase: 'speak', id: 'say:' + p3.axis.id + ':' + p3.pair.id + ':' + st.round + '.' + i }); }
      }
      st.queue = q; st.idx = 0;
      begin();
    }
    function begin() {
      try { window.speechSynthesis.cancel(); } catch (e) { /* none */ }
      var it = st.queue[st.idx];
      st.item = it ? Object.assign(it, { replays: 0, hints: [], answered: false, pick: null, showWhere: false }) : null;
      if (it) {
        B.emit('view', { item: it.id, mode: st.mode, axis: it.axis.id, pair: it.pair.id });
        if (it.kind === 'ab' || it.kind === 'sd' || it.kind === 'sort') setTimeout(function () { if (st.item === it) playItem(false); }, 350);
      } else B.emit('complete', { mode: st.mode, items: st.queue.length, axis: st.axis });
      render();
    }
    function next() { st.idx++; begin(); }

    /* ---- playback for the current item ---- */
    function playItem(isReplay) {
      var it = st.item; if (!it) return;
      if (isReplay) { if (!it.answered) it.replays++; B.emit('select', { item: it.id, replay: true, beforeAnswer: !it.answered, replays: it.replays }); }
      if (it.kind === 'ab') speakWord(word(it.pair, it.side));
      else if (it.kind === 'sd') seq([{ w: word(it.pair, it.first), pause: 700 }, { w: word(it.pair, it.second) }]);
      else if (it.kind === 'sort') playSort(it);
      renderBar();
    }
    function playSort(it) {
      var ref = word(it.pair, it.ref);
      var test = it.test === 'other' ? word(it.pair, other(it.ref)) : it.test === 'third' ? it.pair.third : ref;
      var done = speakWord(ref);
      Promise.resolve(done).then(function () {
        setTimeout(function () {
          if (st.item !== it) return;
          if (it.test === 'variant') it.usedVariant = playVariant(ref, it.variant);
          else speakWord(test);
        }, 700);
      });
    }

    /* ---- step 1: which one ---- */
    function pickAB(side) {
      var it = st.item; if (!it || it.answered) return;
      var ok = side === it.side;
      it.answered = true; it.pick = side;
      B.attempt(it.id, { correct: ok, response: { heard: it.side, chose: side, replays: it.replays, hints: it.hints.slice(), pair: it.pair.id } });
      var rec = B.items().filter(function (x) { return x.id === it.id; })[0];
      if (rec && rec.attempts === 1) {
        var m = st.mx[it.axis.id] || (st.mx[it.axis.id] = { aa: 0, ab: 0, ba: 0, bb: 0 });
        m[it.side + side]++;
      }
      B.emit('compare', { item: it.id, a: it.pair.a.text, b: it.pair.b.text, order: 'A-B-A' });
      render();
      var w = word(it.pair, it.side);
      if (child()) feedback(L('是这个：', 'It was this one: ') + (w.pic || w.text) + L('。再听一遍两个词。', '. Listen to both words once more.'), '');
      else feedback((ok ? L('对。', 'Right. ') : L('听到的是 ', 'You heard ') + wordLabel(w) + L('，不是 ', ', not ') + wordLabel(word(it.pair, side)) + L('。', '. ')) + L('两个词并排，标色的是不同的地方；现在按 A-B-A 连放一遍。', 'The two words are side by side with the difference marked; now they play A-B-A.'), ok ? '' : 'bad');
      seq([{ w: it.pair.a, pause: 500 }, { w: it.pair.b, pause: 500 }, { w: it.pair.a }]);
    }
    function pickSD(ans) {
      var it = st.item; if (!it || it.answered) return;
      var ok = ans === it.truth;
      it.answered = true; it.pick = ans;
      B.attempt(it.id, { correct: ok, response: { truth: it.truth, answer: ans, replays: it.replays } });
      if (it.truth === 'same') { var s2 = st.same[it.axis.id] || (st.same[it.axis.id] = { n: 0, saidDiff: 0 }); s2.n++; if (ans === 'diff') s2.saidDiff++; }
      render();
      var w1 = word(it.pair, it.first), w2 = word(it.pair, it.second);
      feedback(it.truth === 'same' ? (ok ? L('对，两遍是同一个词：', 'Right, the same word twice: ') + wordLabel(w1) + L('。', '.') : L('其实两遍是同一个词：', 'It was actually the same word twice: ') + wordLabel(w1) + L('。觉得不一样时，先想想差在哪个音。', '. When it sounds different, ask yourself which sound differs.'))
        : (ok ? L('对，先 ', 'Right: first ') + wordLabel(w1) + L('，后 ', ', then ') + wordLabel(w2) + L('。', '.') : L('其实不一样：先 ', 'They were different: first ') + wordLabel(w1) + L('，后 ', ', then ') + wordLabel(w2) + L('。', '.')), ok ? '' : 'bad');
    }

    /* ---- step 2: sort ---- */
    var SORT = ['same', 'variant', 'other', 'third'];
    function sortLabel(k, it) {
      var o = word(it.pair, other(it.ref));
      return k === 'same' ? L('和参照完全一样', 'Exactly the same as the reference')
        : k === 'variant' ? L('同一个词，只是读法不同', 'The same word, said differently')
        : k === 'other' ? L('换成了另一个词：', 'A different word: ') + (child() && o.pic ? o.pic : o.text + (o.py ? ' ' + o.py : ''))
        : L('都不是：第三个词', 'Neither: a third word');
    }
    function pickSort(k) {
      var it = st.item; if (!it || it.answered) return;
      var ok = k === it.test;
      it.answered = true; it.pick = k;
      B.attempt(it.id, { correct: ok, response: { test: it.test, answer: k, replays: it.replays, variantUsed: it.usedVariant || null } });
      render();
      var ref = word(it.pair, it.ref), msg;
      if (it.test === 'variant') {
        var fellBack = it.variant.how === 'locale' && it.usedVariant === 'rate';
        msg = (ok ? L('对。', 'Right. ') : k === 'other' ? L('不是另一个词。', 'It was not a different word. ') : L('两遍听得出不同。', 'The two playings did differ. ')) +
          (fellBack ? L('（这台设备没有英式语音，第二遍改成了慢速。）', '(This device has no voice for that accent, so the second playing was slowed down instead.) ') + L('慢速读，还是同一个词。', 'Said slowly, it is still the same word.') : T(it.variant, 'note')) +
          L(' 不是每个听得出的差异都会换一个词。', ' Not every difference you can hear changes the word.');
      } else if (it.test === 'third') {
        msg = (ok ? L('对。', 'Right. ') : '') + L('第二遍是 ', 'The second word was ') + wordLabel(it.pair.third) + L('：既不是 ', ': neither ') + it.pair.a.text + L(' 也不是 ', ' nor ') + it.pair.b.text + L('。', '.');
      } else if (it.test === 'other') {
        msg = (ok ? L('对。', 'Right. ') : '') + L('参照是 ', 'The reference was ') + wordLabel(ref) + L('，第二遍是 ', '; the second word was ') + wordLabel(word(it.pair, other(it.ref))) + L('。', '.');
      } else {
        msg = (ok ? L('对，', 'Right: ') : L('其实', 'Actually ')) + L('两遍完全一样，都是 ', 'both playings were identical: ') + wordLabel(ref) + L('。', '.');
      }
      feedback(msg, ok ? (it.test === 'variant' ? 'warn' : '') : 'bad');
    }

    /* ---- step 3: say it ---- */
    var src = 'partner';
    function handOver() { var it = st.item; it.phase = 'listen'; B.emit('view', { item: it.id, screen: 'listener' }); render(); }
    function listenerPick(side) {
      var it = st.item; if (!it || it.phase !== 'listen') return;
      var ok = side === it.side;
      it.phase = 'done'; it.pick = side; it.answered = true;
