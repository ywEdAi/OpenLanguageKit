<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blend</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .bl-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .bl-layout { grid-template-columns: 1fr; } }
  .bl-side { display: grid; gap: 12px; }
  .bl-stage { display: grid; gap: 12px; justify-items: center; text-align: center; }
  .bl-stage .kb-prompt { margin: 0; }
  .boxes { display: flex; gap: var(--gap); justify-content: center; flex-wrap: wrap; align-items: flex-end; }
  .boxes.small .bx { --bx: calc(var(--cell) * .8); font-size: calc(var(--glyph) * .8); }
  .bx { --bx: calc(var(--cell) * 1.3); min-width: var(--bx); height: var(--bx); padding: 0 8px; font-size: calc(var(--glyph) * 1.25);
    border: 2px solid var(--t1); border-radius: 8px; background: var(--panel); display: inline-flex; align-items: center; justify-content: center;
    position: relative; transition: transform .15s, background .15s; line-height: 1; }
  .bx.k-v, .bx.k-fin { border-color: var(--t3); border-radius: 999px; }
  .bx.k-mora { border-color: var(--t2); }
  .bx.k-tone { border-color: var(--t4); border-radius: 50%; min-width: calc(var(--bx) * .8); }
  .bx.k-silent { border-style: dashed; border-color: var(--line); color: var(--muted); }
  .bx.k-pause { border-style: dotted; border-color: var(--t2); background: repeating-linear-gradient(135deg, transparent 0 7px, var(--accent-soft) 7px 9px); }
  .bx.k-long { border-color: var(--t2); border-bottom-width: 6px; }
  .bx.lit { background: var(--accent-soft); border-color: var(--accent); transform: translateY(-4px); }
  .bx.tricky { box-shadow: 0 0 0 4px var(--warn); }
  .bx.chg { box-shadow: 0 0 0 4px var(--t2); }
  .bx.d-ok { background: var(--accent-soft); }
  .bx.d-sub { background: var(--bad-soft); border-color: var(--bad); }
  .bx.d-ins { background: var(--warn-soft); text-decoration: line-through; }
  .bx.d-del { border: 2px dashed var(--bad); color: var(--bad); font-size: 1rem; }
  .bx.slot { border-style: dashed; border-color: var(--line); color: var(--muted); }
  .bx.gap { border: 2px dashed var(--accent); }
  .bx small { position: absolute; bottom: -1.3em; left: 0; right: 0; font-size: .65rem; color: var(--muted); white-space: nowrap; }
  .cap { min-height: 1.5em; color: var(--muted); font-size: .9rem; margin: 6px 0 0; }
  .track { width: min(420px, 90%); height: 34px; position: relative; border-bottom: 3px dotted var(--line); }
  .snail { position: absolute; left: 0; bottom: 0; font-size: 1.6rem; transition: left linear; }
  .compare { display: grid; gap: 8px; justify-items: center; margin-top: 4px; }
  .compare .lbl { font-size: .8rem; color: var(--muted); }
  .known { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; color: var(--muted); }
  .known .pic { font-size: 1.8rem; }
  .arrow { font-size: 1.4rem; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; width: 100%; max-width: 620px; }
  .opt { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .opt .pic { font-size: 2.4rem; line-height: 1.2; }
  [data-variant="child"] .opt .pic { font-size: 3.4rem; }
  .opt .gl { font-size: .9rem; }
  .opt .num { font-size: .7rem; color: var(--muted); }
  .opt.notword { border-style: dashed; justify-content: center; }
  .opt.notword .pic { font-size: 1.6rem; }
  .opt.right { background: var(--accent-soft); border-color: var(--accent); }
  .opt.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; }
  .bank .sec { flex-basis: 100%; height: 0; }
  .tile { min-width: calc(var(--cell) * .95); height: calc(var(--cell) * .95); font-size: var(--glyph); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 2px 0 var(--line); }
  .tile:active { transform: translateY(2px); box-shadow: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .done { font-size: 3rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .8rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  .flag { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .reverse { border-left: 4px solid var(--warn); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .legend .bx { --bx: 26px; font-size: .8rem; padding: 0 4px; height: 26px; transform: none; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'blend-en';
  var entry = KT_REGISTRY.packs[setId] || {};
  var file = entry.file;
  if (file && entry.block !== 'blend') { document.getElementById('app').textContent = '数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。'; return; }
  if (!file) { document.getElementById('app').textContent = '未知的数据包：' + setId; return; }
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else document.getElementById('app').textContent = '数据包里没有 ' + setId; };
  s.onerror = function () { document.getElementById('app').textContent = '数据包加载失败：' + file; };
  document.head.appendChild(s);

  /* ---- pure helpers ---- */
  function glyphOf(key) { var i = key.indexOf(':'); return i > 0 ? key.slice(0, i) : key; }
  function rand(a) { return a[Math.floor(Math.random() * a.length)]; }
  /** Levenshtein alignment of two sequences: ops ok / sub / del (in a, missing from b) / ins (extra in b). */
  function align(a, b) {
    var n = a.length, m = b.length, d = [], i, j;
    for (i = 0; i <= n; i++) { d[i] = []; for (j = 0; j <= m; j++) d[i][j] = i === 0 ? j : (j === 0 ? i : 0); }
    for (i = 1; i <= n; i++) for (j = 1; j <= m; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    var ops = []; i = n; j = m;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) { ops.unshift({ op: a[i - 1] === b[j - 1] ? 'ok' : 'sub', a: i - 1, b: j - 1 }); i--; j--; }
      else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { ops.unshift({ op: 'del', a: i - 1 }); i--; }
      else { ops.unshift({ op: 'ins', b: j - 1 }); j--; }
    }
    ops.dist = d[n][m];
    return ops;
  }

  function start(pack) {
    var B = KTBlock.init({ id: 'blend', primitive: 'prim:sound-spelling-blend', title: pack.title, set: pack.id });
    document.title = pack.title + ' · Blend';
    var isZh = pack.lang === 'zh';
    var modes = [{ id: 'read', label: '拼读' }, { id: 'chain', label: '换一个音' }, { id: 'spell', label: '听音摆字' }];
    if (pack.exceptions && pack.exceptions.length) modes.push({ id: 'rule', label: '规则外' });
    var regular = pack.words.filter(function (w) { return !w.pseudo; });
    var byId = {};
    pack.words.concat(pack.exceptions || []).forEach(function (w) { byId[w.id] = w; });
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'read',
      tag: pack.tags && pack.tags[params.get('focus')] ? params.get('focus') : 'all',
      queue: [], idx: 0, item: null, record: {}
    };

    var ui = KTBlock.chrome(B, { title: pack.title, subtitle: pack.subtitle, modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); newRound(); },
      onVariant: function () { if (st.item) { st.item.opts = null; st.item.bank = null; } render(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card bl-stage' });
    var side = h('aside', { class: 'bl-side' });
    document.getElementById('app').append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'bl-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    /* ---- units and speech ---- */
    function unit(key) {
      return (pack.units || {})[key] || { say: glyphOf(key), kind: pack.lang === 'ja' ? 'mora' : 'c' };
    }
    function label(key) { return isZh && pack.toneMarks && pack.toneMarks[key] ? pack.toneMarks[key] : glyphOf(key); }
    function child() { return B.variant === 'child'; }
    var timers = [];
    function clearSeq() { timers.forEach(clearTimeout); timers = []; try { window.speechSynthesis.cancel(); } catch (e) { /* none */ } }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    var warned = false;
    function speak(text, opts) {
      if (!text && !(opts && opts.audio)) return;
      if (!B.speak(text, pack.speech, opts) && !warned) { warned = true; caption('这个浏览器不能播放语音：可以由家长读，或在数据包里放录音（audio）。'); }
    }
    function speakUnit(key) { var u = unit(key); speak(u.say, { audio: u.audio }); }
    function wordText(w) { return w.say || w.text; }
    function speakWord(w, rate) { speak(wordText(w), { audio: w.audio, rate: rate }); }
    function unitMs(key) { var k = unit(key).kind; return k === 'pause' || k === 'silent' ? 650 : (child() ? 1300 : 1000); }
    function wordMs(w, slow) { return (slow ? 900 : 500) + wordText(w).length * (slow ? 260 : 130) + (isZh ? 400 : 0); }

    /* ---- pools and rounds ---- */
    function tagOk(w) { return st.tag === 'all' || w.tag === st.tag; }
    function roundSize() { return child() ? 5 : 8; }
    function newRound() {
      clearSeq();
      var n = roundSize(), q = [];
      var reg = KTBlock.shuffle(regular.filter(tagOk));
      if (!reg.length) reg = KTBlock.shuffle(regular);
      if (st.mode === 'read') q = reg.slice(0, n).map(function (w) { return { kind: 'read', word: w, id: 'read:' + w.id }; });
      if (st.mode === 'spell') {
        var ps = KTBlock.shuffle(pack.words.filter(function (w) { return w.pseudo && tagOk(w); }));
        var np = Math.min(ps.length, Math.ceil(n / 3));
        q = KTBlock.shuffle(reg.slice(0, n - np).concat(ps.slice(0, np))).map(function (w) { return { kind: 'spell', word: w, id: 'spell:' + w.id }; });
      }
      if (st.mode === 'chain') {
        var chains = KTBlock.shuffle((pack.chains || []).filter(function (c) { return c.some(function (id) { return tagOk(byId[id]); }); }));
        if (!chains.length) chains = KTBlock.shuffle(pack.chains || []);
        var steps = 0;
        chains.forEach(function (c) {
          if (steps >= n) return;
          for (var i = 1; i < c.length; i++) { q.push({ kind: 'chain', prev: byId[c[i - 1]], word: byId[c[i]], id: 'chain:' + c[i - 1] + '>' + c[i]}); steps++; }
        });
      }
      if (st.mode === 'rule') {
        var k = child() ? 3 : 5;
        var ex = KTBlock.shuffle(pack.exceptions).slice(0, k);
        q = KTBlock.shuffle(ex.concat(reg.filter(function (w) { return w.pic; }).slice(0, k))).map(function (w) { return { kind: 'rule', word: w, id: 'rule:' + w.id }; });
      }
      st.queue = q; st.idx = 0;
      begin();
    }
    function begin() {
      clearSeq();
      var it = st.queue[st.idx];
      st.item = it ? Object.assign(it, { taps: 0, heardWhole: false, solved: false, answered: false, placed: [], showCount: false, showTricky: false, compare: null, picked: [] }) : null;
      if (it) {
        B.emit('view', { item: it.id, mode: st.mode, pseudo: !!it.word.pseudo, exception: it.kind === 'rule' && !!it.word.rule });
        if (it.kind === 'spell') later(function () { speakWord(it.word); }, 300);
      } else {
        B.emit('complete', { mode: st.mode, items: st.queue.length });
      }
      render();
    }
    function next() { st.idx++; begin(); }
    function caption(t) { var c = stage.querySelector('.cap'); if (c) c.textContent = t || ''; }
    function feedback(t, tone) { var f = stage.querySelector('.kb-feedback'); if (f) { f.textContent = t; f.className = 'kb-feedback ' + (tone || ''); f.hidden = !t; } }
    function mark(it, rec) {
      var f = rec.first;
      st.record[it.id] = { text: it.word.text, cls: !f.correct ? 'bad' : (f.assisted ? 'ast' : 'ind') };
    }

    /* ---- boxes ---- */
    function trickyIndex(w) {
      if (typeof w.tricky === 'number') return w.tricky;
      var idx = w.boxes.findIndex(function (k) { var kd = unit(k).kind; return kd === 'v' || kd === 'fin' || kd === 'pause' || kd === 'long'; });
      return idx < 0 ? 0 : idx;
    }
    function boxRow(w, opt) {
      opt = opt || {};
      return h('div', { class: 'boxes' + (opt.small ? ' small' : '') + (opt.main ? ' main' : ''), 'aria-label': opt.aria || '音格' }, w.boxes.map(function (k, i) {
        var cls = ['bx', 'k-' + unit(k).kind];
        if (opt.tricky === i) cls.push('tricky');
        if (opt.changed && opt.changed.indexOf(i) >= 0) cls.push('chg');
        if (opt.diff && opt.diff[i]) cls.push('d-' + opt.diff[i]);
        var kind = unit(k).kind;
        return h('button', { class: cls.join(' '), dataset: { i: i }, 'aria-label': '第 ' + (i + 1) + ' 格 ' + label(k) + (kind === 'silent' ? '（不发音）' : kind === 'pause' ? '（停一拍）' : ''),
          onclick: opt.onTap ? function () { opt.onTap(i, k); } : null, tabindex: opt.onTap ? null : '-1' },
          [label(k), kind === 'silent' ? h('small', { text: '不发音' }) : kind === 'pause' ? h('small', { text: '停一拍' }) : (isZh ? h('small', { text: kind === 'ini' ? '声母' : kind === 'fin' ? '韵母' : '声调' }) : null)]);
      }));
    }
    function light(i, on) {
      var b = stage.querySelector('.boxes.main [data-i="' + i + '"]');
      if (b) b.classList.toggle('lit', on);
    }
    function tapBox(i, key) {
      var it = st.item;
      if (it.kind === 'rule' && !it.answered) { caption('先判断，再点格子听。'); return; }
      it.taps++;
      clearSeq();
      light(i, true); later(function () { light(i, false); }, unitMs(key));
      speakUnit(key);
      var u = unit(key);
      caption(label(key) + (u.ipa && !child() ? ' ' + u.ipa : '') + (u.cap ? ' · ' + u.cap : ''));
      B.emit('select', { item: it.id, box: i, unit: key });
    }
    /** Light boxes one by one, speaking each unit (hint 1). */
    function playBoxes(w) {
      clearSeq();
      var t = 0;
      w.boxes.forEach(function (k, i) {
        later(function () { light(i, true); speakUnit(k); }, t);
        later(function () { light(i, false); }, t + unitMs(k) - 100);
        t += unitMs(k);
      });
      return t;
    }
    /** 合起来: sweep the boxes, then the whole word slowly, then at normal speed. */
    function blendWord(w) {
      clearSeq();
      var n = w.boxes.length, sweep = 220 * n + 200, slow = wordMs(w, true);
      var snail = stage.querySelector('.snail');
      if (snail) { snail.style.transitionDuration = '0ms'; snail.style.left = '0%'; void snail.offsetWidth; snail.style.transitionDuration = (sweep + slow) + 'ms'; snail.style.left = 'calc(100% - 2rem)'; }
      w.boxes.forEach(function (k, i) { later(function () { light(i, true); }, 220 * i); });
      later(function () { speakWord(w, child() ? 0.45 : 0.55); }, sweep - 150);
      later(function () { w.boxes.forEach(function (k, i) { light(i, false); }); speakWord(w); }, sweep + slow);
    }

    /* ---- options (read / chain) ---- */
    function nearest(w, n, exclude) {
      var cands = regular.filter(function (x) { return x.pic && x.id !== w.id && x.gloss !== w.gloss && x.pic !== w.pic && exclude.indexOf(x.id) < 0; });
      var gw = w.boxes.map(glyphOf);
      cands = KTBlock.shuffle(cands).map(function (x) { return { x: x, d: align(gw, x.boxes.map(glyphOf)).dist + (x.boxes.length === w.boxes.length ? 0 : 0.5) }; });
      cands.sort(function (a, b) { return a.d - b.d; });
      return cands.slice(0, n).map(function (c) { return c.x; });
    }
    function buildOpts(it) {
      var w = it.word, n = child() ? 3 : 4, list;
      if (it.kind === 'read') list = [w].concat(nearest(w, n - 1, []));
      else {
        var pics = child() ? 2 : 3, base = w.pseudo ? [] : [w];
        if (it.prev.pic) base.push(it.prev);
        list = base.concat(nearest(w, Math.max(0, pics - base.length), base.map(function (x) { return x.id; })));
      }
      it.opts = KTBlock.shuffle(list).map(function (x) { return { id: x.id, pic: x.pic, gloss: x.gloss }; });
      if (it.kind === 'chain') it.opts.push({ id: 'notword', pic: '🤔', gloss: '读得出来，但不是一个词' });
    }
    function answerId(it) { return it.word.pseudo ? 'notword' : it.word.id; }
    function optButtons(it) {
      if (!it.opts) buildOpts(it);
      return h('div', { class: 'opts' }, it.opts.map(function (o, i) {
        var cls = 'opt' + (o.id === 'notword' ? ' notword' : '');
        if (it.picked.indexOf(o.id) >= 0) cls += o.id === answerId(it) ? ' right' : ' wrongpick';
        else if (it.solved && o.id === answerId(it)) cls += ' right';
        return h('button', { class: cls, disabled: it.solved, 'aria-label': (i + 1) + '：' + o.gloss, onclick: function () { pick(o.id); } },
          [h('span', { class: 'pic', text: o.pic }), h('span', { class: 'gl', text: o.gloss }), h('span', { class: 'num', text: String(i + 1) })]);
      }));
    }
    function pick(id) {
      var it = st.item;
      if (!it || it.solved || it.picked.indexOf(id) >= 0) return;
      var ok = id === answerId(it);
      var rec = B.attempt(it.id, { correct: ok, response: { pick: id, boxTaps: it.taps, heardWhole: it.heardWhole } });
      it.picked.push(id); it.answered = true;
      if (ok) {
        it.solved = true; mark(it, rec); it.compare = null;
        render();
        if (it.word.pseudo) { feedback('对：' + it.word.text + ' 能按规则读出来，但不是一个词。会读假词，说明用的是规则，不是背下来的。'); blendWord(it.word); }
        else { feedback('对！' + showText(it.word) + ' = ' + it.word.gloss + (rec.first.assisted ? '（提示后答对）' : '')); blendWord(it.word); }
      } else {
        var other = id === 'notword' ? null : byId[id];
        it.compare = other;
        if (other) B.emit('compare', { item: it.id, with: other.id });
        render();
        if (other) { speakWord(other); feedback('你选的是“' + other.gloss + '”，它是 ' + showText(other) + '。上下两行比一比，红色的格子不一样。再读一遍上面那行。', 'bad'); }
        else feedback('它是一个真词，有图。再一格一格读一遍。', 'bad');
      }
    }
    function showText(w) { return isZh ? (w.py + ' ' + w.text) : w.text; }
    function compareRows(target, other) {
      var ops = align(target.boxes.map(glyphOf), other.boxes.map(glyphOf));
      var dt = {}, dO = {};
      ops.forEach(function (o) { if (o.op === 'sub') { dt[o.a] = 'sub'; dO[o.b] = 'sub'; } if (o.op === 'del') dt[o.a] = 'sub'; if (o.op === 'ins') dO[o.b] = 'sub'; });
      return h('div', { class: 'compare' }, [h('span', { class: 'lbl', text: '你选的词：' + other.pic + ' ' + other.gloss }),
        boxRow(other, { small: true, diff: dO, onTap: function (i, k) { speakUnit(k); } }), h('span', { class: 'lbl', text: '和上面题目的格子对齐，红色是不同的格。' })]);
    }

    /* ---- spell ---- */
    function val(k) { return isZh ? k : glyphOf(k); }
    function buildBank(it) {
      var w = it.word, target = w.boxes.map(val), seen = {}, tiles = [], foils = pack.foils || {};
      it.diff = null;
      function add(v) { if (v && !seen[v]) { seen[v] = 1; tiles.push(v); } }
      if (child()) {
        it.missing = trickyIndex(w);
        var want = target[it.missing], f = (foils[w.boxes[it.missing]] || foils[want] || []).map(val);
        add(want); f.forEach(function (x) { if (tiles.length < 3) add(x); });
        var pool = KTBlock.shuffle(Object.keys(pack.units || {}).filter(function (k) { return unit(k).kind === unit(w.boxes[it.missing]).kind && k.indexOf(':') < 0; }).map(val));
        pool.concat(KTBlock.shuffle(allGlyphs())).forEach(function (x) { if (tiles.length < 3) add(x); });
        it.bank = KTBlock.shuffle(tiles);
        it.placed = target.slice(); it.placed[it.missing] = null;
        return;
      }
      target.forEach(add);
      if (isZh) ['1', '2', '3', '4'].forEach(add);
      w.boxes.forEach(function (k) { (foils[k] || foils[glyphOf(k)] || []).slice(0, 2).forEach(function (x) { add(val(x)); }); });
      var fill = KTBlock.shuffle(allGlyphs());
      for (var i = 0; i < fill.length && tiles.length < target.length + 7; i++) add(fill[i]);
      if (it.placed.indexOf(null) >= 0) it.placed = [];
      if (isZh) {
        var order = { ini: 0, fin: 1, tone: 2 };
        it.bank = KTBlock.shuffle(tiles).sort(function (a, b) { return order[unit(a).kind] - order[unit(b).kind]; });
      } else it.bank = KTBlock.shuffle(tiles);
    }
    var glyphCache = null;
    function allGlyphs() {
      if (!glyphCache) { var s = {}; pack.words.forEach(function (w) { w.boxes.forEach(function (k) { if (!isZh || unit(k).kind !== 'tone') s[val(k)] = 1; }); }); glyphCache = Object.keys(s); }
      return glyphCache;
    }
    function tileLabel(v) { return isZh ? label(v) : v; }
    function place(v) {
      var it = st.item;
      if (it.solved) return;
      it.diff = null;
      if (child()) {
        it.placed[it.missing] = v; B.emit('drop', { item: it.id, tile: v, slot: it.missing }); submitSpell(); return;
      }
      it.placed.push(v); B.emit('drop', { item: it.id, tile: v, slot: it.placed.length - 1 });
      if (unit(v).say && !isZh) speakUnit(v);
      render();
    }
    function unplace(i) {
      var it = st.item;
      if (it.solved || child()) return;
      var v = it.placed.splice(i, 1)[0]; it.diff = null;
      B.emit('revise', { item: it.id, removed: v, slot: i });
      render();
    }
    function submitSpell() {
      var it = st.item, w = it.word, target = w.boxes.map(val), got = it.placed.slice();
      if (!got.length) return;
      var ops = align(target, got), ok = ops.dist === 0;
      var rec = B.attempt(it.id, { correct: ok, response: { placed: got, boxCount: got.length, targetCount: target.length, pseudo: !!w.pseudo } });
      it.answered = true;
      if (ok) {
        it.solved = true; mark(it, rec); it.diff = null; render(); blendWord(w);
        feedback('对！' + showText(w) + (w.pseudo ? '——这是个假词，能拼出来说明用的是规则。' : ' = ' + w.gloss) + (rec.first.correct ? '' : '（第一次没摆对，已记下）'));
        return;
      }
      it.diff = ops;
      render();
      var msg = [];
      if (got.length !== target.length) msg.push('目标有 ' + target.length + ' 格，你摆了 ' + got.length + ' 格。');
      if (!isZh && got.join('') === target.join('')) msg.push('字母都对，但分格不对：' + w.boxes.filter(function (k) { return glyphOf(k).length > 1; }).map(glyphOf).join('、') + ' 是一个音，放在一格里。');
      msg.push('红色是摆错的格，黄色划线是多出来的，虚线框是缺的。点格子可以拿掉，再听一遍。');
      feedback(msg.join(''), 'bad');
    }
    function spellRow(it) {
      var w = it.word, cells = [];
      if (it.diff) {
        it.diff.forEach(function (o) {
          if (o.op === 'del') cells.push(h('span', { class: 'bx d-del', text: '缺' }));
          else cells.push(h('button', { class: 'bx d-' + o.op, onclick: function () { it.diff = null; unplace(o.b); } }, tileLabel(it.placed[o.b])));
        });
      } else {
        var n = Math.max(it.placed.length + (it.showCount || child() ? 0 : 1), it.showCount || child() ? w.boxes.length : 0);
        for (var i = 0; i < n; i++) {
          var v = it.placed[i];
          if (v) cells.push(h('button', { class: 'bx' + (it.solved ? ' d-ok' : ''), dataset: { i: i }, 'aria-label': '第 ' + (i + 1) + ' 格 ' + v + '，点一下拿掉', onclick: (function (j) { return function () { unplace(j); }; })(i) }, tileLabel(v)));
          else cells.push(h('span', { class: 'bx slot' + (it.showTricky && i === trickyIndex(w) ? ' tricky' : '') + (child() && i === it.missing ? ' gap' : ''), text: it.showTricky && i === trickyIndex(w) ? tileLabel(val(w.boxes[i])) : '' }));
        }
      }
      return h('div', { class: 'boxes main', 'aria-label': '你摆的格子' }, cells);
    }

    /* ---- rule (reverse half) ---- */
    function judge(irregular) {
      var it = st.item;
      if (it.answered) return;
      var isEx = !!it.word.rule, ok = irregular === isEx;
      var rec = B.attempt(it.id, { correct: ok, response: { judged: irregular ? 'irregular' : 'regular', exception: isEx } });
      it.answered = true; it.solved = true; it.judged = irregular; mark(it, rec);
      render();
      speakWord(it.word);
      if (isEx) feedback((ok ? '对，' : '其实不能硬拼。') + it.word.rule + '；' + it.word.actual + '。这种词要整体记。', ok ? 'warn' : 'bad');
      else feedback((ok ? '对，' : '其实可以。') + '按规则一格一格拼，就是 ' + showText(it.word) + '。', ok ? '' : 'bad');
    }

    /* ---- render ---- */
    function renderBar() {
      bar.innerHTML = '';
      if (pack.tags) {
        bar.append(h('label', { class: 'kb-variant' }, ['范围 ', h('select', { onchange: function (e) { st.tag = e.target.value; B.emit('highlight', { focus: st.tag }); newRound(); } },
          [h('option', { value: 'all', text: '全部', selected: st.tag === 'all' })].concat(Object.keys(pack.tags).map(function (k) { return h('option', { value: k, text: pack.tags[k], selected: st.tag === k }); })))]));
      }
      if (st.item) bar.append(h('span', { class: 'kb-note', text: '第 ' + (st.idx + 1) + ' / ' + st.queue.length + ' 题' }));
      bar.append(h('button', { class: 'kb-btn', onclick: newRound }, '换一轮'));
    }
    function hintTools(it, extra) {
      var w = it.word;
      return h('div', { class: 'tools' }, [
        h('button', { class: 'kb-btn', disabled: it.solved, onclick: function () { B.hint(it.id, 1); playBoxes(w); } }, '提示 1：一格一格放'),
        h('button', { class: 'kb-btn', disabled: it.solved || it.showTricky, onclick: function () {
          it.showTricky = true; B.hint(it.id, 2); render(); var k = w.boxes[trickyIndex(w)]; var u = unit(k);
          caption('注意这一格：' + label(k) + (u.cap ? ' · ' + u.cap : '')); } }, '提示 2：难点在哪'),
        h('button', { class: 'kb-btn', disabled: it.solved, onclick: function () {
          B.reveal(it.id); it.solved = true; st.record[it.id] = { text: w.text, cls: B.status(it.id) === 'wrong' ? 'bad' : 'ast' }; render(); blendWord(w);
          feedback('答案：' + (w.pseudo ? w.text + '（假词，不是一个词）' : showText(w) + ' = ' + w.gloss) + '。这一题记为“看过答案”。', 'warn'); } }, '看答案')
      ].concat(extra || []));
    }
    function renderStage() {
      stage.innerHTML = '';
      var it = st.item;
      if (!it) {
        var done = st.queue.filter(function (q) { return st.record[q.id]; });
        stage.append(h('div', { class: 'done', text: st.queue.length ? '🎉' : '📭' }),
          h('p', { class: 'kb-prompt', text: st.queue.length ? '这一轮做完了：' + done.filter(function (q) { return st.record[q.id].cls === 'ind'; }).length + ' 题第一次就独立做对。' : '这个范围没有可练的题，换一个范围。' }),
          h('button', { class: 'kb-btn primary', onclick: newRound }, '再来一轮'));
        return;
      }
      var w = it.word, tricky = it.showTricky || (it.solved && it.kind === 'rule' && w.rule) ? trickyIndex(w) : -1;
      if (it.kind === 'read' || it.kind === 'chain') {
        if (it.kind === 'chain') {
          var ops = align(it.prev.boxes.map(glyphOf), w.boxes.map(glyphOf)), chg = [];
          ops.forEach(function (o) { if (o.op === 'sub' || o.op === 'ins') chg.push(o.b); });
          var removed = ops.some(function (o) { return o.op === 'del'; });
          stage.append(h('p', { class: 'kb-prompt', text: child() ? '换了一格，变成什么了？' : '换了一格（绿框）' + (removed ? '，或少了一格' : '') + '。先自己读出来，再选它是什么。' }),
            h('div', { class: 'known' }, [h('span', { text: '刚才是' }), boxRow(it.prev, { small: true, onTap: function (i, k) { speakUnit(k); } }), it.prev.pic ? h('span', { class: 'pic', text: it.prev.pic }) : h('span', { text: '（假词）' }), h('span', { class: 'arrow', text: '↓' })]),
            boxRow(w, { onTap: tapBox, tricky: tricky, changed: chg, aria: '新词的音格', main: true }));
        } else {
          stage.append(h('p', { class: 'kb-prompt', text: child() ? '点一点，读一读，是哪个？' : '一格一格点着读，再自己连起来。这是哪个？' }), boxRow(w, { onTap: tapBox, tricky: tricky, aria: '音格', main: true }));
        }
        stage.append(h('p', { class: 'cap' }));
        if (child()) stage.append(h('div', { class: 'track' }, [h('span', { class: 'snail', text: '🐌' })]));
        stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: function () {
          if (!it.answered && !it.heardWhole) { it.heardWhole = true; B.hint(it.id, 3); }
          blendWord(w); B.emit('select', { item: it.id, blend: true, beforeAnswer: !it.answered });
        } }, it.answered || it.heardWhole ? '▶ 合起来' : '▶ 合起来听（算提示）')]));
        stage.append(optButtons(it));
        if (it.compare && !it.solved) stage.append(compareRows(w, it.compare));
        stage.append(hintTools(it));
      } else if (it.kind === 'spell') {
        if (!it.bank) buildBank(it);
        stage.append(h('p', { class: 'kb-prompt', text: child() ? '听一听，缺的那一格是哪个？' : '听一听，用下面的字块把它摆出来：一格放一个音。' }),
          h('div', { class: 'tools' }, [
            h('button', { class: 'kb-btn primary', onclick: function () { speakWord(w); B.emit('select', { item: it.id, replay: true }); } }, '▶ 再听'),
            h('button', { class: 'kb-btn', onclick: function () { speakWord(w, 0.5); B.emit('select', { item: it.id, replay: 'slow' }); } }, '▶ 慢一点')]),
          spellRow(it), h('p', { class: 'cap' }),
          h('div', { class: 'bank', 'aria-label': '字块' }, it.bank.map(function (v, i) {
            var brk = isZh && i > 0 && unit(it.bank[i - 1]).kind !== unit(v).kind;
            return [brk ? h('span', { class: 'sec' }) : null, h('button', { class: 'tile', disabled: it.solved, 'aria-label': '字块 ' + v, onclick: function () { place(v); } }, tileLabel(v))];
          }).reduce(function (a, b) { return a.concat(b); }, [])));
        if (!child()) stage.append(h('div', { class: 'tools' }, [
          h('button', { class: 'kb-btn primary', disabled: it.solved || !it.placed.length, onclick: submitSpell }, '摆好了'),
          h('button', { class: 'kb-btn', disabled: it.solved || !it.placed.length, onclick: function () { it.placed = []; it.diff = null; B.emit('revise', { item: it.id, cleared: true }); render(); } }, '清空'),
          h('button', { class: 'kb-btn', disabled: it.solved || it.showCount, onclick: function () { it.showCount = true; B.hint(it.id, 1); render(); } }, '提示 1：有几格'),
          h('button', { class: 'kb-btn', disabled: it.solved || it.showTricky, onclick: function () { it.showTricky = true; it.showCount = true; B.hint(it.id, 2); render(); } }, '提示 2：给出难点格'),
          h('button', { class: 'kb-btn', disabled: it.solved, onclick: function () {
            B.reveal(it.id); it.solved = true; it.placed = w.boxes.map(val); it.diff = null; st.record[it.id] = { text: w.text, cls: B.status(it.id) === 'wrong' ? 'bad' : 'ast' }; render(); blendWord(w);
            feedback('答案：' + showText(w) + '。这一题记为“看过答案”。', 'warn'); } }, '看答案')]));
        else stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn', disabled: it.solved, onclick: function () { B.hint(it.id, 1); playBoxes(w); } }, '提示：一格一格放')]));
        if (w.pseudo && !it.solved) stage.append(h('p', { class: 'kb-note', text: '这一题可能是假词：能读出来，但不是一个词。按规则拼就行。' }));
      } else if (it.kind === 'rule') {
        stage.append(h('p', { class: 'kb-prompt', text: '按“' + pack.rule + '”一格一格拼，能读对这个词吗？' }),
          h('div', { class: 'known' }, [h('span', { class: 'pic', text: w.pic }), h('span', { text: w.gloss })]),
          boxRow(w, { onTap: tapBox, tricky: tricky, aria: '音格', main: true }), h('p', { class: 'cap' }));
        var yes = h('button', { class: 'opt' + (it.answered && !it.judged ? (w.rule ? ' wrongpick' : ' right') : ''), disabled: it.answered, onclick: function () { judge(false); } }, [h('span', { class: 'pic', text: '✅' }), h('span', { class: 'gl', text: '能，按规则拼就对' }), h('span', { class: 'num', text: '1' })]);
        var no = h('button', { class: 'opt' + (it.answered && it.judged ? (w.rule ? ' right' : ' wrongpick') : ''), disabled: it.answered, onclick: function () { judge(true); } }, [h('span', { class: 'pic', text: '⚠️' }), h('span', { class: 'gl', text: '不能，要整体记' }), h('span', { class: 'num', text: '2' })]);
        stage.append(h('div', { class: 'opts' }, [yes, no]));
        if (it.answered && w.rule) stage.append(h('p', {}, [h('span', { class: 'flag', text: '规则外' }), ' ', w.text + (w.say && w.say !== w.text ? '（' + w.say + '）' : '')]));
        if (it.answered) stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn', onclick: function () { speakWord(w); } }, '▶ 再听真正的读音')]));
      }
      stage.append(h('div', { class: 'kb-feedback', hidden: true }));
      stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn' + (it.solved ? ' primary' : ''), onclick: next }, it.solved ? '下一题 →' : '跳过')]));
    }
    function renderSide() {
      side.innerHTML = '';
      var chips = st.queue.filter(function (q) { return st.record[q.id]; }).map(function (q) { var r = st.record[q.id]; return h('span', { class: 'chip ' + r.cls, text: r.text }); });
      side.append(h('div', { class: 'kb-card' }, [h('b', { text: '这一轮的词卡' }),
        chips.length ? h('div', { class: 'chips' }, chips) : h('p', { class: 'kb-note', text: '还没有作答。' }),
        h('p', { class: 'kb-note', text: '绿 = 第一次就独立做对；黄 = 用过提示、听过整词或看过答案；红 = 第一次做错。第一次作答一经记录不会被覆盖。' })]));
      var legend = isZh ? [['b', '声母'], ['a', '韵母'], ['3', '声调']] : pack.lang === 'ja' ? [['か', '一拍'], ['っ', '促音'], ['ー', '长音']] : [['t', '辅音'], ['a', '元音'], [pack.lang === 'fr' ? 't:0' : 'e:0', '不发音']];
      side.append(h('div', { class: 'kb-card' }, [h('div', { class: 'legend' }, legend.map(function (l) { return h('span', {}, [h('span', { class: 'bx k-' + unit(l[0]).kind, text: label(l[0]) }), ' ' + l[1]]); })),
        pack.voiceNote ? h('p', { class: 'kb-note', text: pack.voiceNote }) : null]));
      if (pack.reverse) side.append(h('div', { class: 'kb-card reverse' }, [h('b', { text: '不按规则的词' }), h('p', { class: 'kb-note', text: pack.reverse })]));
    }
    function render() { renderBar(); renderStage(); renderSide(); }

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
      var it = st.item; if (!it) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) {
        if ((it.kind === 'read' || it.kind === 'chain') && it.opts && it.opts[n - 1]) pick(it.opts[n - 1].id);
        else if (it.kind === 'rule' && n <= 2) judge(n === 2);
      } else if (e.key === 'Enter' && it.solved) { e.preventDefault(); next(); }
    });

    newRound();
  }
})();
</script>
</body>
</html>
