<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story Frames</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .sf-frame { border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--panel); line-height: 0; }
  .sf-frame svg { display: block; width: 100%; height: auto; }
  /* the animated frame: three poses; outside the stepper only the last pose shows */
  .sf-pose { display: none; }
  .sf-p3 { display: inline; }
  [data-step] .sf-pose { display: inline; opacity: 0; transition: opacity .35s; }
  [data-step="1"] .sf-p1, [data-step="2"] .sf-p2, [data-step="3"] .sf-p3 { opacity: 1; }
  [data-step="3"] .sf-wig { animation: sf-wig .28s infinite alternate; }
  @keyframes sf-wig { from { transform: translate(-1.5px, 0); } to { transform: translate(1.5px, -1px); } }
  .sf-hidden { display: grid; place-items: center; aspect-ratio: 4 / 3; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 2rem; background: var(--bg); }
  .sf-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .sf-strip .sf-frame { border-width: 1.5px; border-radius: 8px; }
  .sf-strip .sf-hidden { font-size: 1.1rem; border-radius: 8px; }
  .sf-strip > div { position: relative; }
  .sf-strip .now .sf-frame { box-shadow: 0 0 0 3px var(--accent); }
  .sf-badge { position: absolute; top: -6px; right: -4px; font-size: .7rem; line-height: 1.3; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
  .sf-badge.miss { background: var(--warn); color: #fff; }
  .sf-watch { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .sf-watch { grid-template-columns: 1fr; } }
  .sf-sent { font-size: 1.25rem; line-height: 1.4; margin: 4px 0; }
  [data-variant="child"] .sf-sent { font-size: 1.5rem; }
  .sf-read { color: var(--muted); font-size: .9rem; margin: 0; }
  .sf-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  [data-variant="child"] .kb-btn { padding: 10px 18px; font-size: 1.05rem; }
  .speak-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
  .sf-bets { display: grid; gap: 8px; margin-top: 8px; }
  .sf-bets button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
  .sf-bets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
  .sf-bets .arrow { font-size: 1.5rem; width: 1.6em; text-align: center; }
  .sf-bets b { font-size: 1.1rem; }
  .sf-bets small { color: var(--muted); display: block; }
  .sf-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sf-two > div { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .sf-two h4 { margin: 0; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .sf-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 520px) { .sf-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .sf-card { all: unset; cursor: grab; display: block; border-radius: 14px; }
  .sf-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .sf-card[aria-pressed="true"] .sf-frame { box-shadow: 0 0 0 4px var(--accent); }
  .sf-card.right .sf-frame { border-color: #2e8b57; box-shadow: 0 0 0 2px #2e8b57; }
  .sf-card.hinted .sf-frame { box-shadow: 0 0 0 4px var(--warn); }
  .sf-card p { line-height: 1.35; margin: 4px 2px 0; font-size: .85rem; }
  .sf-time { position: relative; margin-top: 8px; }
  .sf-time .sf-strip { margin: 0; }
  .sf-time svg.lines { display: block; width: 100%; height: 54px; }
  .sf-time svg.lines line { stroke: var(--muted); stroke-width: 1.5; opacity: .6; }
  .sf-time svg.lines line.cross { stroke: var(--bad); stroke-width: 4; opacity: 1; stroke-dasharray: 8 5; }
  .sf-time h4 { margin: 6px 0 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
  .sf-chain { display: flex; flex-wrap: wrap; gap: 8px 4px; align-items: center; }
  .sf-chain .sf-frame { width: 116px; border-width: 1.5px; border-radius: 8px; }
  .sf-slot { border: 2px dashed var(--line); background: var(--bg); border-radius: 12px; min-width: 84px; padding: 4px 6px; text-align: center; font-size: .82rem; line-height: 1.25; }
  .sf-slot .arrow { display: block; font-size: 1.5rem; line-height: 1; }
  .sf-slot[aria-pressed="true"] { border-color: var(--accent); border-style: solid; }
  .sf-slot.right { border-style: solid; border-color: #2e8b57; background: var(--accent-soft); }
  .sf-slot.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
  .sf-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sf-chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; }
  .sf-stepper { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .sf-stepper button.dot { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-weight: 700; }
  .sf-stepper button.dot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sf-lines { display: grid; gap: 6px; margin-top: 8px; }
  .sf-line { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--panel); }
  .sf-line > span { flex: 1; }
  .sf-line button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 34px; height: 34px; }
  .sf-line.right { border-color: #2e8b57; }
  .sf-retell { display: grid; gap: 10px; }
  .sf-rrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; }
  @media (max-width: 520px) { .sf-rrow { grid-template-columns: 84px minmax(0, 1fr); } }
  .sf-rrow .sf-frame { border-width: 1.5px; border-radius: 8px; }
  .sf-rrow input, textarea.sf-text { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
  textarea.sf-text { min-height: 150px; resize: vertical; }
  .sf-cue { display: inline-block; font-size: .82rem; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 1px 10px; margin-bottom: 4px; }
  .sf-thumbs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .sf-thumbs button { all: unset; cursor: pointer; display: block; position: relative; }
  .sf-thumbs button:focus-visible { outline: 3px solid var(--focus); }
  .sf-thumbs .sf-frame { border-width: 1.5px; border-radius: 8px; }
  .sf-thumbs .uncovered .sf-frame { filter: grayscale(1); opacity: .4; }
  .sf-thumbs .tag { position: absolute; left: 2px; bottom: 2px; font-size: .7rem; line-height: 1.3; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 5px; }
  .sf-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: .92rem; }
  .sf-list li { margin: 3px 0; }
  .sf-list li::before { content: '○ '; color: var(--muted); }
  .sf-list li.done::before { content: '✓ '; color: #2e8b57; }
  .sf-list li.no::before { content: '✕ '; color: var(--bad); }
  .sf-pill { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .sf-pill button { border: 0; background: transparent; padding: 4px 12px; }
  .sf-pill button[aria-pressed="true"] { background: var(--accent-soft); }
  .sf-scard { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-top: 6px; display: flex; gap: 8px; align-items: center; background: var(--panel); }
  .sf-scard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .sf-scard span.t { flex: 1; text-align: left; }
  h3.sf-h { margin: 0 0 6px; font-size: 1rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, shuffle = KTBlock.shuffle;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'story-en';
  var entry = KT_REGISTRY.packs[setId] || {};
  var app = document.getElementById('app');
  if (!entry.file) { app.textContent = '未知的数据包：' + setId; return; }
  if (entry.block !== 'story-frames') { app.textContent = '数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在连环画里打开。'; return; }
  var s = document.createElement('script');
  s.src = entry.file;
  s.onload = function () { start(KT_DATA[setId]); };
  s.onerror = function () { app.textContent = '数据包加载失败：' + entry.file; };
  document.head.appendChild(s);

  var ARROW = { seq: '→', same: '⇉', cause: '⇒', contrast: '↯', back: '↶', end: '⇥', trap: '✕' };
  var DIR_ARROW = { on: '→', turn: '↷', close: '⇥', back: '↶' };
  function same(a, b) { return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }
  function mixed(list, avoid) { var out, n = 0; do { out = shuffle(list); n += 1; } while (n < 20 && avoid.some(function (a) { return same(out, a); })); return out; }

  function start(pack) {
    var scene = KT_SCENES[pack.scene];
    var B = KTBlock.init({ id: 'story-frames', primitive: 'prim:sequence-retell', title: pack.title, set: pack.id });
    document.title = pack.title + ' · Story Frames';
    var isCJK = pack.lang === 'zh' || pack.lang === 'ja';
    var modes = [{ id: 'watch', label: '预测' }, { id: 'order', label: '排序' }, { id: 'link', label: '连接' }, { id: 'process', label: '过程' }, { id: 'retell', label: '复述' }];
    var st = { mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'watch', showReading: true };
    var W, O, L, R, T, timer = null;
    function child() { return B.variant === 'child'; }
    var ui = KTBlock.chrome(B, { title: pack.title, subtitle: pack.subtitle, modes: modes, mode: st.mode,
      onMode: function (m) { go(m); }, onVariant: function () { resetAll(); render(); } });
    var bar = h('div', { class: 'kb-bar' }), body = h('div', {});
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, body]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    function go(m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); render(); }
    function say(text) { return B.speak(text, pack.speech); }
    function speakBtn(text, label) { return h('button', { class: 'speak-btn', type: 'button', onclick: function () { say(text); } }, label || '▶ 听'); }
    function frame(id, step) {
      var d = h('div', { class: 'sf-frame', role: 'img', 'aria-label': scene.frames[id].alt });
      d.innerHTML = scene.frames[id].svg;                // authored in the data pack, not learner input
      if (step) d.dataset.step = step;
      return d;
    }
    function sentence(o, gloss) {
      return h('div', {}, [h('p', { class: 'sf-sent', lang: pack.lang }, [o.t, o.src === 'kc' ? h('span', { class: 'kb-note', title: '取自课程知识点的例句' }, ' ★') : null]),
        o.r && st.showReading ? h('p', { class: 'sf-read', text: o.r }) : null,
        gloss && o.g ? h('p', { class: 'kb-note', style: 'margin:2px 0 0', text: o.g }) : null]);
    }
    function has(re, text) { return new RegExp(re, 'i').test(text); }
    function tokens(x) { x = x.toLowerCase().replace(/[.,!?;:—\-。，！？、；：“”"']/g, ' '); return isCJK ? x.replace(/\s/g, '').split('') : x.split(/\s+/).filter(Boolean); }
    function overlap(a, b) { var ta = tokens(a), tb = tokens(b); if (!ta.length) return 0; return ta.filter(function (t) { return tb.indexOf(t) >= 0; }).length / ta.length * Math.min(1, ta.length / tb.length + .25); }

    /* ================= 预测：看一幅，猜下一幅 ================= */
    function resetWatch() { W = { shown: 1, pick: null, bets: {} }; }
    function junction(id) {
      var j = scene.junctions.find(function (x) { return x.before === id; });
      if (!j) return null;
      if (child() && j.type === 'dir' && !j.child) return null;
      return j;
    }
    function dirCards() { return child() ? ['on', 'turn'] : ['on', 'turn', 'close', 'back']; }
    function renderWatch() {
      var n = scene.told.length, cur = scene.told[W.shown - 1], next = scene.told[W.shown];
      var strip = h('div', { class: 'sf-strip' }, scene.told.map(function (id, i) {
        var b = W.bets[id];
        return h('div', { class: i === W.shown - 1 ? 'now' : '' }, [i < W.shown ? frame(id) : h('div', { class: 'sf-hidden', text: '?' }),
          b ? h('span', { class: 'sf-badge' + (b.hit ? '' : ' miss'), title: b.hit ? '这里你押中了' : '这里你没押中：故事在这儿拐了弯', text: b.hit ? '押中' : '没押中' }) : null]);
      }));
      var cap = pack.frames[cur], isAnim = scene.anim.frame === cur;
      var big = frame(cur, isAnim ? 3 : null);
      var left = h('div', {}, [big, isAnim ? h('div', { class: 'sf-row' }, [h('button', { class: 'kb-btn', type: 'button', onclick: function () { play(big); } }, '▶ 看它是怎么拔的'), h('button', { class: 'kb-btn', type: 'button', onclick: function () { go('process'); } }, '去说这个过程')]) : null]);
      var right = h('div', { class: 'kb-card' }, [sentence(cap, true), h('div', { class: 'sf-row' }, [speakBtn(cap.t, '▶ 听这一幅')])]);
      var last = W.bets[cur];
      if (last) right.append(h('div', { class: 'sf-two', style: 'margin-top:10px' }, [
        h('div', {}, [h('h4', { text: '你押的' }), h('span', { lang: pack.lang, text: last.label })]),
        h('div', {}, [h('h4', { text: '实际' }), h('span', { lang: pack.lang, text: last.actual })])]),
        h('div', { class: 'kb-feedback' + (last.hit ? '' : ' warn'), role: 'status' }, (last.hit ? '押中了。' : '没押中，没关系：先押再看，才看得见故事在这里怎么走。') + last.why));
      var j = next && junction(next);
      if (!next) {
        right.append(h('div', { class: 'kb-feedback' }, '故事讲完了。押对方向，不等于每一句都听懂了——接着把画排一排。'),
          h('div', { class: 'sf-row' }, [h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { go('order'); } }, '去排序'),
            h('button', { class: 'kb-btn', type: 'button', onclick: function () { W.shown = 1; W.pick = null; render(); } }, '从头再看'),
            h('button', { class: 'speak-btn', type: 'button', onclick: function () { B.speakSequence(scene.told.map(function (id) { return { text: pack.frames[id].t, pause: 350 }; }), pack.speech); } }, '▶ 连着听一遍')]));
      } else if (j) {
        var opts = j.type === 'dir' ? dirCards().map(function (d) { return { id: d, arrow: DIR_ARROW[d], t: pack.directions[d].w, zh: pack.directions[d].zh }; }) :
          (W.pickOrder && W.pickFor === next ? W.pickOrder : (W.pickFor = next, W.pickOrder = shuffle(pack.picks[next]))).map(function (p, k) { return { id: p.t, arrow: '•', t: p.t, r: p.r, right: p.right }; });
        right.append(h('p', { class: 'kb-prompt', style: 'margin-top:14px', text: j.type === 'dir' ? '先押：下一幅，故事会怎么走？押了才能看。' : '先押：下一幅是哪一句？' }),
          h('div', { class: 'sf-bets' }, opts.map(function (o) {
            return h('button', { type: 'button', 'aria-pressed': W.pick === o.id ? 'true' : 'false', onclick: function () { W.pick = o.id; B.emit('select', { item: 'bet:' + next, response: o.id }); render(); } },
              [h('span', { class: 'arrow', 'aria-hidden': 'true', text: o.arrow }), h('span', {}, [h('b', { lang: pack.lang, text: o.t }), o.zh ? h('small', { text: o.zh }) : null, o.r && st.showReading ? h('small', { text: o.r }) : null])]);
          })),
          h('div', { class: 'sf-row' }, [h('button', { class: 'kb-btn primary', type: 'button', disabled: W.pick === null, onclick: function () {
            var actual = j.type === 'dir' ? (child() ? j.child : j.actual) : pack.picks[next].find(function (p) { return p.right; }).t;
            var hit = W.pick === actual;
            B.attempt('bet:' + next, { correct: hit, response: W.pick });       // submitted before the frame is shown
            W.bets[next] = { hit: hit, why: j.why, label: j.type === 'dir' ? pack.directions[W.pick].w : W.pick, actual: j.type === 'dir' ? pack.directions[actual].w : actual };
            W.pick = null; W.shown += 1; B.emit('reveal', { item: 'frame:' + next, afterBet: true }); render();
          } }, '押定，揭晓下一幅')]));
      } else {
        right.append(h('div', { class: 'sf-row' }, [h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { W.shown += 1; B.emit('view', { item: 'frame:' + next }); render(); } }, '下一幅')]));
      }
      body.append(strip, h('div', { class: 'sf-watch' }, [left, right]));
    }
    function play(el, done) {
      clearInterval(timer);
      var k = 1; el.dataset.step = 1;
      timer = setInterval(function () { k += 1; if (k > scene.anim.steps) { clearInterval(timer); if (done) done(); return; } el.dataset.step = k; }, 1100);
    }

    /* ================= 排序：按发生的先后 ================= */
    function resetOrder() { O = { arr: mixed(scene.happened, [scene.happened, scene.told]), sel: null, solved: false, msg: null, tone: '', hint: 0, showText: false, assisted: false }; }
    function move(i, j) {
      if (j < 0 || j >= O.arr.length || O.solved) return;
      var t = O.arr[i]; O.arr[i] = O.arr[j]; O.arr[j] = t;
      B.emit('reorder', { item: 'order', order: O.arr.slice() });
    }
    function renderOrder() {
      var cards = h('div', { class: 'sf-cards' }, O.arr.map(function (id, i) {
        return h('button', { class: 'sf-card' + (O.solved ? ' right' : '') + (O.hint >= 2 && id === scene.flash && !O.solved ? ' hinted' : ''), type: 'button', 'aria-pressed': O.sel === i ? 'true' : 'false',
          'aria-label': '第 ' + (i + 1) + ' 个位置：' + scene.frames[id].alt,
          onclick: function () {
            if (O.solved) return;
            if (O.sel === null) O.sel = i; else if (O.sel === i) O.sel = null; else { move(O.sel, i); O.sel = null; }
            render();
          },
          onkeydown: function (e) {
            if (O.sel !== i || O.solved) return;
            var d = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
            if (!d) return;
            e.preventDefault(); move(i, i + d); O.sel = Math.max(0, Math.min(O.arr.length - 1, i + d)); render();
            var b = body.querySelectorAll('.sf-card')[O.sel]; if (b) b.focus();
          } }, [frame(id), O.showText ? h('p', { lang: pack.lang, text: pack.frames[id].b }) : null]);
      }));
      var card = h('div', { class: 'kb-card', style: 'margin-bottom:12px' }, [
        h('p', { class: 'kb-prompt', text: '把画按事情“发生”的先后排好，从左到右、从上到下。注意：不一定是故事讲的顺序。' }),
        h('p', { class: 'kb-note', text: '点一幅，再点另一幅，两幅交换位置；选中后也可以用键盘 ← → 挪动。' }),
        h('div', { class: 'sf-row' }, [
          O.solved ? null : h('button', { class: 'kb-btn primary', type: 'button', onclick: function () {
            var ok = same(O.arr, scene.happened);
            B.attempt('order', { correct: ok, response: O.arr.slice() });
            if (ok) { O.solved = true; O.sel = null; O.msg = '顺序对了。'; O.tone = ''; B.emit('compare', { item: 'told-vs-happened' }); }
            else {
              O.tone = 'bad';
              O.msg = same(O.arr, scene.told) ? '这是故事“讲”的顺序。问的是“发生”的顺序：有一幅讲在后面，其实发生得更早。' :
                '还不对。现在有 ' + O.arr.filter(function (x, i) { return x === scene.happened[i]; }).length + ' 幅在对的位置。';
            }
            render();
          } }, '检查顺序'),
          O.solved ? null : h('button', { class: 'kb-btn', type: 'button', onclick: function () {
            O.hint = Math.min(2, O.hint + 1); O.assisted = true; B.hint('order', O.hint); O.msg = scene.orderHints[O.hint - 1]; O.tone = 'warn'; render();
          } }, '提示'),
          h('label', { class: 'kb-variant' }, [h('input', { type: 'checkbox', checked: O.showText, onchange: function (e) { O.showText = e.target.checked; B.emit('highlight', { item: 'order', showText: O.showText }); render(); } }), ' 显示句子（去掉了连接词）']),
          O.solved ? h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { go('link'); } }, '去放连接词') : null,
          O.solved ? h('button', { class: 'kb-btn', type: 'button', onclick: function () { resetOrder(); render(); } }, '打乱再排') : null
        ]),
        h('div', { class: 'kb-feedback ' + O.tone, role: 'status', hidden: !O.msg }, O.msg || '')
      ]);
      body.append(card, cards);
      if (O.solved) body.append(timeline());
    }

      body.append(h('div', { class: 'kb-card', style: 'margin-top:12px' }, [
        h('div', { class: 'sf-thumbs' }, scene.told.map(function (id) { return h('div', {}, [frame(id)]); })),
        h('p', { class: 'kb-prompt', style: 'margin-top:12px', text: '看着图，把故事大声讲一遍。讲完后，自己或搭档对照下面几条。' }),
        h('p', { class: 'kb-note', text: '页面没有听，也不会给录音打分。这几条是自评，单独记录，不算答对。' }),
        h('div', {}, pack.selfCheck.map(function (t, i) {
          return h('label', { style: 'display:block;margin:6px 0' }, [h('input', { type: 'checkbox', checked: !!sp.checked[i], disabled: sp.done, onchange: function (e) { sp.checked[i] = e.target.checked; } }), ' ' + t]);
        })),
        sp.done ? h('div', { class: 'kb-feedback' }, '记下了（自评）。' + pack.partner) : null,
        h('div', { class: 'sf-row' }, [
          sp.done ? null : h('button', { class: 'kb-btn primary', type: 'button', onclick: function () {
            var yes = pack.selfCheck.filter(function (_, i) { return sp.checked[i]; });
            if (T.peek) B.reveal('retell-spoken:' + T.level);
            B.attempt('retell-spoken:' + T.level, { selfReport: true, correct: yes.length === pack.selfCheck.length, response: yes });
            sp.done = true; render();
          } }, '记下自评'),
          h('button', { class: 'kb-btn', type: 'button', onclick: function () { T.spoken = null; render(); } }, '改成打字'),
          sp.done ? h('button', { class: 'kb-btn', type: 'button', onclick: function () { T.compare = !T.compare; if (T.compare) B.emit('compare', { item: 'retell-vs-original', spoken: true }); render(); } }, '和原文对照') : null
        ])
      ]));
      if (T.compare) body.append(original());
    }

    function resetAll() { resetWatch(); resetOrder(); resetLink(); resetProcess(); resetRetell(); }
    function render() {
      clearInterval(timer);
      bar.innerHTML = ''; body.innerHTML = '';
      if (pack.readingLabel) bar.append(h('label', { class: 'kb-variant' }, [h('input', { type: 'checkbox', checked: st.showReading, onchange: function (e) { st.showReading = e.target.checked; B.emit('highlight', { showReading: st.showReading }); render(); } }), ' 显示' + pack.readingLabel]));
      bar.append(h('span', { class: 'kb-note', text: '声音来自浏览器的语音合成，只放音，不录音、不打分。' }));
      if (st.mode === 'watch') renderWatch();
      else if (st.mode === 'order') renderOrder();
      else if (st.mode === 'link') renderLink();
      else if (st.mode === 'process') renderProcess();
      else renderRetell();
    }
    resetAll();
    render();
    window.__sfReady = true;
  }
})();
</script>
</body>
</html>
