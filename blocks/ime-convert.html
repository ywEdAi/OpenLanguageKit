<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input-method conversion</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .im-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .im-layout { grid-template-columns: 1fr; } }
  .im-side { display: grid; gap: 12px; }
  .im-stage { display: grid; gap: 12px; }
  .im-stage .kb-prompt { margin: 0; }
  .read { font-size: 1.15rem; letter-spacing: .02em; }
  .bar { min-height: 56px; border: 2px solid var(--accent); border-radius: 10px; background: var(--panel); padding: 8px 12px; font-size: 1.5rem; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: center; overflow-wrap: anywhere; }
  .bar .out { white-space: pre-wrap; }
  .bar .comp { text-decoration: underline; text-underline-offset: 4px; color: var(--accent); }
  .bar .comp .seg { background: var(--accent-soft); text-decoration: underline 3px; }
  .bar .caret { display: inline-block; width: 2px; height: 1.2em; background: var(--ink); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar .ph { color: var(--muted); font-size: 1rem; }
  .cands { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; }
  .cand { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; font-size: 1.25rem; display: inline-flex; gap: 6px; align-items: baseline; }
  .cand .num { font-size: .75rem; color: var(--muted); }
  .cand .ex { font-size: .78rem; color: var(--muted); }
  .cand.hi { border-color: var(--accent); background: var(--accent-soft); }
  .typein { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .typein input { font: inherit; font-size: 1.1rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); width: min(300px, 100%); font-family: ui-monospace, Menlo, monospace; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .trace { margin: 0; padding-left: 20px; font-size: .9rem; display: grid; gap: 2px; }
  .trace .skip { color: var(--muted); }
  .trace .pk { font-weight: 700; color: var(--accent); }
  .trace .first0 { font-size: .75rem; color: var(--warn); }
  .linkbox { position: relative; padding-top: 34px; }
  .linkbox svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .linkbox svg path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
  .sent { font-size: 1.5rem; line-height: 1.8; }
  .sent .ch { border: 0; background: transparent; padding: 0 1px; font: inherit; color: inherit; border-radius: 4px; }
  .sent .ch.mark { box-shadow: inset 0 -3px 0 var(--bad); background: var(--bad-soft); }
  .sent .ch.mark.okm { box-shadow: inset 0 -3px 0 var(--t2); background: transparent; }
  .sent .ch.ctx { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
  .sent .ch.sel { outline: 2px solid var(--accent); }
  .sent .ch.miss { color: var(--bad); text-decoration: underline wavy var(--bad); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .opt { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 8px 10px; display: flex; gap: 6px; align-items: center; text-align: left; min-height: 44px; }
  .opt .num { font-size: .72rem; color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt.right { border-color: var(--t2); background: var(--accent-soft); }
  .opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
  .opt.rev { border-left: 4px solid var(--warn); }
  .opt:disabled { cursor: default; }
  .flag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .reverse { border-left: 4px solid var(--warn); }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .92rem; }
  .stat b { text-align: right; }
  .cmp { font-size: .95rem; }
  .done { font-size: 2.4rem; text-align: center; }
  .kb-note code { font-size: .85rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Input-method conversion (prim:ime-convert). Packs: data/ime-convert.js (format in its header).
 * The page simulates an IME from the pack dictionary (no real IME, no network):
 *   ja: romaji → kana live; Space converts (longest known reading), Space/arrows move, digits pick, Enter commits;
 *       a lone n before a vowel stays な-row (gennin → げんいん, genin → げにん); wo → を, o → お.
 *   zh: letters; candidates for the longest known pinyin prefix; Space commits the highlighted one, digits pick,
 *       Enter commits the letters; ü is typed v.
 * Modes: type (step 1, with a key → candidates → choice trace), judge (step 2: classify marked spots and click the
 * deciding context word; the reverse half is "both are fine"), blind (step 3: shuffled candidates, no trace until
 * submitted, compared with step 1). The final text must match the target exactly (alt lists accepted variants). */
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'ime-convert-zh';
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || { file: 'data/ime-convert.js', block: 'ime-convert' };
  var app = document.getElementById('app');
  if (entry.block !== 'ime-convert') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var s = document.createElement('script');
  s.src = entry.file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + entry.file; };
  document.head.appendChild(s);

  /* ---- romaji → kana (same rules as reading-aid-fade) ---- */
  var KANA = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お' };
  (function () {
    var rows = { k: 'かきくけこ', s: 'さしすせそ', t: 'たちつてと', n: 'なにぬねの', h: 'はひふへほ', m: 'まみむめも', r: 'らりるれろ', g: 'がぎぐげご', z: 'ざじずぜぞ', d: 'だぢづでど', b: 'ばびぶべぼ', p: 'ぱぴぷぺぽ', x: 'ぁぃぅぇぉ', l: 'ぁぃぅぇぉ' };
    Object.keys(rows).forEach(function (c) { 'aiueo'.split('').forEach(function (v, j) { KANA[c + v] = rows[c][j]; }); });
    Object.assign(KANA, { ya: 'や', yu: 'ゆ', yo: 'よ', ye: 'いぇ', wa: 'わ', wo: 'を', shi: 'し', chi: 'ち', tsu: 'つ', fu: 'ふ', ji: 'じ', si: 'し', ti: 'ち', tu: 'つ', hu: 'ふ', zi: 'じ', di: 'ぢ', du: 'づ',
      fa: 'ふぁ', fi: 'ふぃ', fe: 'ふぇ', fo: 'ふぉ', she: 'しぇ', che: 'ちぇ', je: 'じぇ', xtu: 'っ', ltu: 'っ', xya: 'ゃ', xyu: 'ゅ', xyo: 'ょ', lya: 'ゃ', lyu: 'ゅ', lyo: 'ょ', xn: 'ん', thi: 'てぃ', dhi: 'でぃ' });
    var yo = { k: 'き', g: 'ぎ', n: 'に', h: 'ひ', m: 'み', r: 'り', b: 'び', p: 'ぴ', sh: 'し', ch: 'ち', j: 'じ', sy: 'し', ty: 'ち', cy: 'ち', zy: 'じ', jy: 'じ', dy: 'ぢ' };
    var sm = { a: 'ゃ', u: 'ゅ', o: 'ょ' };
    Object.keys(yo).forEach(function (c) { 'auo'.split('').forEach(function (v) { KANA[(c.length === 1 ? c + 'y' : c) + v] = yo[c] + sm[v]; }); });
  })();
  function romaji(str, final) {
    var s = str.toLowerCase(), out = '', i = 0;
    while (i < s.length) {
      var c = s[i];
      if (!/[a-z'\-]/.test(c)) { out += c; i++; continue; }
      if (c === '-') { out += 'ー'; i++; continue; }
      if (c === "'") { i++; continue; }
      if (c === 'n') {
        var nx = s[i + 1];
        if (nx === 'n' || nx === "'") { out += 'ん'; i += 2; continue; }
        if (nx === undefined) { if (final) { out += 'ん'; i++; continue; } break; }
        if (!/[a-z]/.test(nx)) { out += 'ん'; i++; continue; }
        if (!/[aiueoy]/.test(nx)) { out += 'ん'; i++; continue; }
      }
      if (c === s[i + 1] && /[bcdfghjkmpqrstvwxyz]/.test(c)) { out += 'っ'; i++; continue; }
      var hit = null;
      for (var n = 3; n >= 1; n--) { var k = s.substr(i, n); if (KANA[k]) { hit = k; break; } }
      if (hit) { out += KANA[hit]; i += hit.length; continue; }
      var tail = s.slice(i).replace(/[^a-z].*$/, '');
      if (!final && tail === s.slice(i) && Object.keys(KANA).some(function (k) { return k.indexOf(tail) === 0; })) break;
      out += c; i++;
    }
    return { kana: out, rest: s.slice(i) };
  }
  function kata(s) { return s.replace(/[ぁ-ゖ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) + 0x60); }); }
  /** Levenshtein alignment (as in blend.html): ops ok / sub / del (in a only) / ins (in b only). */
  function align(a, b) {
    var n = a.length, m = b.length, d = [], i, j;
    for (i = 0; i <= n; i++) { d[i] = []; for (j = 0; j <= m; j++) d[i][j] = i === 0 ? j : (j === 0 ? i : 0); }
    for (i = 1; i <= n; i++) for (j = 1; j <= m; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    var ops = []; i = n; j = m;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) { ops.unshift({ op: a[i - 1] === b[j - 1] ? 'ok' : 'sub', a: i - 1, b: j - 1 }); i--; j--; }
      else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { ops.unshift({ op: 'del', a: i - 1 }); i--; }
      else { ops.unshift({ op: 'ins', b: j - 1 }); j--; }
    }
    return ops;
  }

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'ime-convert', primitive: 'prim:ime-convert', title: title, set: pack.id });
    document.title = title + ' · IME';
    var JA = pack.ime === 'romaji', tlang = pack.lang === 'zh' ? 'zh-CN' : pack.lang;
    var kinds = pack.kinds, kindIds = Object.keys(kinds);
    var PUNCT = JA ? { '.': '。', ',': '、', '?': '？', '!': '！' } : { '.': '。', ',': '，', '?': '？', '!': '！' };
    function child() { return B.variant === 'child'; }
    var modes = [{ id: 'type', label: L('打出来', 'Type it') }, { id: 'judge', label: L('找同音错', 'Spot the mistakes') }, { id: 'blind', label: L('不看排序再打', 'Type with shuffled candidates') }];
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'type',
      queue: [], qIdx: 0, item: null, msg: null, own: [], groupLog: {}, counts: { homophone: 0, keys: 0 }, newGroup: { n: 0, ok: 0 }
    };
    var ime;
    function resetIme() { ime = { comp: '', cands: null, hi: 0, conv: false, seg: '', commits: [], order: {} }; }
    resetIme();
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); enterMode(); },
      onVariant: function () { render(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'kb-card im-stage' });
    var side = h('aside', { class: 'im-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'im-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    /* ---- simulated IME ---- */
    function output() { return ime.commits.map(function (c) { return c.text; }).join(''); }
    function itemKey() { return (st.mode === 'blind' ? 'blind:' : 'type:') + st.item.id; }
    function lookup(comp) {
      var key = JA ? romaji(comp, true).kana : comp.replace(/'/g, '');
      if (!key) return null;
      for (var n = key.length; n >= 1; n--) {
        var k = key.slice(0, n);
        if (pack.dict[k]) {
          var list = pack.dict[k].slice();
          if (JA) [k, kata(k)].forEach(function (x) { if (list.indexOf(x) < 0) list.push(x); });
          return { key: k, list: shuffled(k, list), rest: key.slice(n) };
        }
      }
      return JA ? { key: key, list: shuffled(key, [key, kata(key)]), rest: '' } : { key: key, list: [], rest: '' };
    }
    function shuffled(k, list) {
      if (st.mode !== 'blind') return list;
      if (!ime.order[k]) ime.order[k] = KTBlock.shuffle(list);
      return ime.order[k];
    }
    function refreshZh() { var r = lookup(ime.comp); ime.cands = r && r.list.length ? r : null; ime.hi = 0; }
    function commit(text, info) {
      var c = { text: text, keys: info.keys, reading: info.reading, cands: info.cands || null, idx: info.idx == null ? -1 : info.idx, raw: !!info.raw, at: output().length };
      ime.commits.push(c);
      B.emit('select', { item: itemKey(), keys: c.keys, candidates: c.cands, picked: text, index: c.idx, raw: c.raw });
    }
    function pick(i) {
      var r = ime.cands; if (!r || !r.list[i]) return;
      if (JA) {
        commit(r.list[i], { keys: ime.keysTyped || ime.comp, reading: r.key, cands: r.list.slice(), idx: i });
        ime.comp = r.rest; ime.conv = false; ime.cands = null; ime.keysTyped = '';
      } else {
        var consumed = consumeZh(r.key);
        commit(r.list[i], { keys: consumed, reading: r.key, cands: r.list.slice(), idx: i });
        refreshZh();
      }
      sync();
    }
    function consumeZh(key) {
      var out = '', n = 0, i = 0;
      while (i < ime.comp.length && n < key.length) { var ch = ime.comp[i]; out += ch; if (ch !== "'") n++; i++; }
      ime.comp = ime.comp.slice(i).replace(/^'+/, '');
      return out;
    }
    function convertJa() {
      if (!ime.conv) {
        var r = lookup(ime.comp); if (!r) return;
        ime.keysTyped = ime.comp; ime.cands = r; ime.conv = true; ime.hi = 0;
        B.emit('highlight', { item: itemKey(), convert: r.key, candidates: r.list });
      } else ime.hi = (ime.hi + 1) % ime.cands.list.length;
      sync();
    }
    function enter() {
      if (JA) {
        if (ime.conv) { pick(ime.hi); return; }
        if (!ime.comp) return;
        var k = romaji(ime.comp, true).kana;
        commit(k, { keys: ime.comp, reading: k, raw: true }); ime.comp = '';
      } else {
        if (!ime.comp) return;
        commit(ime.comp.replace(/'/g, ''), { keys: ime.comp, raw: true }); ime.comp = ''; ime.cands = null;
      }
      sync();
    }
    function punct(ch) {
      if (JA) { if (ime.conv) pick(ime.hi); else if (ime.comp) enter(); }
      else if (ime.comp) { if (ime.cands) pick(ime.hi); else enter(); }
      commit(PUNCT[ch], { keys: ch, raw: true }); sync();
    }
    function backspaceOut() {
      var c = ime.commits[ime.commits.length - 1]; if (!c) return;
      var removed = c.text.slice(-1);
      c.text = c.text.slice(0, -1); c.edited = true;
      if (!c.text) ime.commits.pop();
      B.emit('revise', { item: itemKey(), removed: removed, from: c.cands ? c.cands[c.idx] : c.keys });
      sync();
    }
    var input;
    function sync() {
      if (input) input.value = ime.comp;
      if (!JA && !ime.conv) refreshZh();
      renderIme();
    }
    function onKey(e) {
      if (e.isComposing) return;
      var k = e.key;
      if ((k === 'Enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); submit(); return; }
      if (k === ' ') { e.preventDefault(); if (JA) { if (ime.comp || ime.conv) convertJa(); } else if (ime.cands) pick(ime.hi); else if (ime.comp) enter(); return; }
      if (k === 'Enter') { e.preventDefault(); if (!ime.comp && !ime.conv) submit(); else enter(); return; }
      if (/^[1-9]$/.test(k) && ime.cands && (JA ? ime.conv : true)) { e.preventDefault(); pick(+k - 1); return; }
      if (PUNCT[k]) { e.preventDefault(); punct(k); return; }
      if ((k === 'ArrowDown' || k === 'ArrowRight') && ime.cands && (!JA || ime.conv)) { e.preventDefault(); ime.hi = (ime.hi + 1) % ime.cands.list.length; renderIme(); return; }
      if ((k === 'ArrowUp' || k === 'ArrowLeft') && ime.cands && (!JA || ime.conv)) { e.preventDefault(); ime.hi = (ime.hi - 1 + ime.cands.list.length) % ime.cands.list.length; renderIme(); return; }
      if (k === 'Escape') { e.preventDefault(); if (ime.conv) { ime.conv = false; ime.cands = null; } else { ime.comp = ''; ime.cands = null; } sync(); return; }
      if (k === 'Backspace') {
        if (ime.conv) { e.preventDefault(); ime.conv = false; ime.cands = null; sync(); return; }
        if (!ime.comp) { e.preventDefault(); backspaceOut(); return; }
      }
    }
    function onInput(e) {
      var v = e.target.value, clean = '';
      for (var i = 0; i < v.length; i++) {
        var ch = v[i];
        if (/[a-zA-Z'\-]/.test(ch) || (JA && /[ぁ-ヿ]/.test(ch))) { clean += ch.toLowerCase(); continue; }
        ime.comp = clean;
        if (ch === ' ') { if (JA) { if (ime.comp) convertJa(); } else { refreshZh(); if (ime.cands) pick(0); } clean = ime.comp; }
        else if (/[1-9]/.test(ch)) { if (!JA) refreshZh(); if (ime.cands) pick(+ch - 1); clean = ime.comp; }
        else if (PUNCT[ch]) { punct(ch); clean = ime.comp; }
        else if (/[㐀-鿿]/.test(ch)) { st.msg = { t: L('看起来系统输入法开着。请切换到英文键盘，在这里打拼音或罗马字。', 'It looks like your system input method is on. Switch to an English keyboard and type pinyin or romaji here.'), tone: 'warn' }; }
      }
      if (ime.conv && clean !== ime.comp) { ime.conv = false; ime.cands = null; }
      ime.comp = clean;
      if (!JA) refreshZh();
      if (st.msg && st.msg.tone === 'warn' && !/[㐀-鿿]/.test(v)) { /* keep */ }
      input.value = ime.comp;
      renderIme();
    }

    /* ---- items and checking ---- */
    function enterMode() {
      st.msg = null;
      if (st.mode === 'judge') { buildJudge(); return; }
      var src = st.mode === 'blind' ? pack.blind : pack.items;
      st.queue = KTBlock.shuffle(src).slice(0, child() ? 4 : src.length); st.qIdx = 0;
      loadItem();
    }
    function loadItem() {
      st.item = st.queue[st.qIdx] || null; st.msg = null; st.result = null; st.hints = {}; resetIme();
      if (st.item) B.emit('view', { item: itemKey(), mode: st.mode, group: st.item.group, newGroup: !!st.item.new });
      else B.emit('complete', { mode: st.mode, items: st.queue.length });
      render();
      setTimeout(function () { if (input) input.focus(); }, 0);
    }
    function hint(n) {
      if (st.hints[n] || st.mode === 'blind') return;
      st.hints[n] = true; B.hint(itemKey(), n);
      var tr = st.item.traps.filter(function (t) { return t.kind === 'homophone'; })[0] || st.item.traps[0];
      if (n === 1) st.msg = { t: tr && tr.q ? T(tr, 'q') : L('想一想每个词在句子里是什么意思。', 'Think about what each word means in the sentence.'), tone: 'warn' };
      if (n === 2) st.msg = { t: tr ? L('决定用哪个字的是“' + tr.ctx + '”。', 'The word that decides the character is “' + tr.ctx + '”.') : L('这一句没有特别要注意的地方。', 'Nothing special to watch in this sentence.'), tone: 'warn' };
      if (n === 3) st.msg = { t: L('现在候选旁边会出现例词，对照例词选。', 'Example words now appear next to the candidates; compare them before choosing.'), tone: 'warn' };
      render();
    }
    function trapHits(out, item) {
      var tgt = item.target, ops = align(tgt.split(''), out.split('')), map = {};
      ops.forEach(function (o) { if (o.op === 'ok' || o.op === 'sub') map[o.a] = o.b; });
      var hits = [];
      item.traps.forEach(function (t) {
        var i = tgt.indexOf(t.at); if (i < 0) return;
        var bs = []; for (var k = i; k < i + t.at.length; k++) if (map[k] != null) bs.push(map[k]);
        var got = bs.length ? out.slice(Math.min.apply(null, bs), Math.max.apply(null, bs) + 1) : '';
        var w = t.wrong.find(function (x) { return x === got || (x.length > 1 && out.indexOf(x) >= 0); });
        if (w) hits.push({ t: t, got: w, pos: out.indexOf(w, bs.length ? Math.max(0, Math.min.apply(null, bs) - 2) : 0) });
      });
      return hits;
    }
    function commitAt(pos) { return ime.commits.find(function (c) { return pos >= c.at && pos < c.at + c.text.length; }); }
    function submit() {
      var it = st.item; if (!it || st.result && st.result.ok) return;
      if (ime.comp || ime.conv) { st.msg = { t: L('输入条里还有没确定的字，先按 Enter 或选一个候选。', 'There is still unconfirmed input in the bar: press Enter or choose a candidate first.'), tone: 'warn' }; render(); return; }
      var out = output(); if (!out) return;

      renderBar(); stage.innerHTML = ''; input = null;
      if (!st.item) {
        stage.append(h('div', { class: 'done', text: st.queue.length ? '✔' : '📭' }), h('p', { class: 'kb-prompt', text: st.queue.length ? L('这一轮做完了。', 'Round finished.') : L('没有题。', 'Nothing here.') }),
          h('div', { class: 'tools' }, [h('button', { class: 'kb-btn primary', onclick: enterMode }, L('再来一轮', 'Another round'))]));
      } else if (st.mode === 'judge') renderJudge(); else renderType();
      renderSide();
    }
    document.addEventListener('keydown', function (e) {
      if (st.mode !== 'judge' || !st.item || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= kindIds.length && !st.j.done) { e.preventDefault(); stage.querySelectorAll('.opts .opt')[n - 1].click(); }
      else if (e.key === 'Enter' && e.target === document.body) { var b = stage.querySelector('.tools .kb-btn.primary'); if (b) { e.preventDefault(); b.click(); } }
    });

    enterMode();
  }
})();
</script>
</body>
</html>
