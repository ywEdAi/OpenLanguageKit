<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanzi Parts</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  :root { --dg: 190px; --tile: 46px; --cjk: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; }
  :root[lang="ja"] { --cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif; }
  :root[data-variant="child"] { --dg: 240px; --tile: 64px; }
  .cjk, .big, .slot .g, .tile, .pick button, .chip b, .ftile .g { font-family: var(--cjk); }
  .hp-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .hp-layout { grid-template-columns: 1fr; } }
  .hp-side { display: grid; gap: 12px; }
  .pick { display: flex; flex-wrap: wrap; gap: 4px; max-height: 128px; overflow: auto; padding: 2px; }
  .pick button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; font-size: 1.25rem; padding: 0; }
  [data-variant="child"] .pick button { width: 48px; height: 48px; font-size: 1.6rem; }
  .pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .big { font-size: 7rem; line-height: 1.05; min-width: 1.1em; text-align: center; }
  [data-variant="child"] .big { font-size: 8.5rem; }
  .meta p { margin: 4px 0; }
  .reading { font-size: 1.4rem; font-weight: 600; }
  /* structure diagram: absolute boxes per IDC type */
  .dg { position: relative; width: var(--dg); height: var(--dg); flex: none; }
  .slot { position: absolute; display: flex; align-items: center; justify-content: center; border: 2px solid var(--rc, var(--line));
    border-radius: 10px; background: color-mix(in srgb, var(--rc, var(--line)) 14%, var(--panel)); padding: 4px; }
  .slot .g { font-size: calc(var(--dg) * .22); line-height: 1; }
  .slot .n { position: absolute; top: 2px; right: 5px; font-size: .7rem; color: var(--muted); }
  .slot.outer { z-index: 0; } .slot.inner { z-index: 1; }
  .slot.outer .g { font-size: calc(var(--dg) * .17); }
  .slot.empty { border-style: dashed; background: transparent; }
  .slot.target { box-shadow: 0 0 0 3px var(--focus); }
  .slot.bad { border-color: var(--bad); background: var(--bad-soft); }
  .slot.locked { border-style: double; border-width: 4px; }
  button.slot { cursor: pointer; font: inherit; color: inherit; }
  .r-meaning { --rc: var(--t1); } .r-sound { --rc: var(--t4); } .r-form { --rc: var(--t0); }
  .role { display: inline-block; font-size: .75rem; padding: 0 7px; border-radius: 999px; border: 1px solid var(--rc); color: var(--rc); white-space: nowrap; }
  .parts { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
  .parts li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-left: 4px solid var(--rc); background: color-mix(in srgb, var(--rc) 7%, var(--panel)); border-radius: 8px; }
  .parts .pg { font-size: 2rem; width: 1.3em; text-align: center; font-family: var(--cjk); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: .85rem; }
  .chip b { font-size: 1.15rem; margin-right: 4px; font-weight: 500; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .tiles { display: flex; flex-wrap: wrap; gap: var(--gap); margin: 10px 0; }
  .tile { width: var(--tile); height: var(--tile); font-size: calc(var(--tile) * .55); border: 1px solid var(--line); background: var(--panel); border-radius: 10px; }
  .tile.used { opacity: .25; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .opts button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; min-height: 40px; }
  [data-variant="child"] .opts button { min-height: 56px; padding: 8px 16px; font-size: 1.15rem; }
  .opts button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opts button.right { border-color: var(--accent); background: var(--accent-soft); }
  .opts button.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
  .ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .ftile { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
  .ftile .g { font-size: 2.2rem; line-height: 1.1; }
  .ftile.exc { border-style: dashed; border-color: var(--warn); background: var(--warn-soft); }
  .badge { font-size: .75rem; color: var(--muted); }
  .exc .badge.rel { color: var(--warn); font-weight: 600; }
  .oku { color: var(--muted); }
  .kana { font-family: var(--cjk); }
  .words { margin: 6px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
  .tag { font-size: .7rem; border-radius: 4px; padding: 0 5px; background: var(--accent-soft); margin-left: 4px; }
  .compare { display: flex; gap: 18px; align-items: end; }
  .compare div { text-align: center; } .compare .g { font-size: 3rem; font-family: var(--cjk); display: block; }
  .reverse { border-left: 4px solid var(--warn); }
  .strokes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: .8rem; }
  .strokes svg { width: 44px; height: 44px; display: block; margin: 0 auto; color: var(--ink); }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; }
  /* English interface: <html lang> is "en", so the CJK font for the language being taught comes from data-pack-lang */
  html[lang="en"] body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", var(--cjk); }
  html[lang="en"][data-pack-lang="ja"] { --cjk: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif; }
  html[lang="en"] .strokes { font-size: .72rem; line-height: 1.25; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t, EN = KTBlock.lang === 'en';
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'hanzi-zh';
  var entry = KT_REGISTRY.packs[setId] || {};
  var file = entry.file;
  if (file && entry.block !== 'hanzi-parts') { document.getElementById('app').textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  if (!file) { document.getElementById('app').textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; return; }
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { start(KT_DATA[setId]); };
  s.onerror = function () { document.getElementById('app').textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  /* ---------- structure geometry: [left, top, width, height] in %; first box is the outer part for enclosures ---------- */
  var IDC = {
    '⿰': { name: '左右结构', nameEn: 'left-right structure', boxes: [[0, 0, 40, 100], [43, 0, 57, 100]] },
    '⿱': { name: '上下结构', nameEn: 'top-bottom structure', boxes: [[0, 0, 100, 40], [0, 43, 100, 57]] },
    '⿲': { name: '左中右结构', nameEn: 'left-middle-right structure', boxes: [[0, 0, 31, 100], [34, 0, 32, 100], [69, 0, 31, 100]] },
    '⿳': { name: '上中下结构', nameEn: 'top-middle-bottom structure', boxes: [[0, 0, 100, 31], [0, 34, 100, 32], [0, 69, 100, 31]] },
    '⿴': { name: '全包围结构', nameEn: 'full enclosure', outer: 'flex-start;justify-content:flex-start', boxes: [[0, 0, 100, 100], [26, 26, 48, 48]] },
    '⿵': { name: '上三包围结构', nameEn: 'enclosure from above', outer: 'flex-start', boxes: [[0, 0, 100, 100], [22, 30, 56, 70]] },
    '⿶': { name: '下三包围结构', nameEn: 'enclosure from below', outer: 'flex-end', boxes: [[0, 0, 100, 100], [22, 0, 56, 70]] },
    '⿷': { name: '左三包围结构', nameEn: 'enclosure from the left', outer: 'center;justify-content:flex-start', boxes: [[0, 0, 100, 100], [30, 22, 70, 56]] },
    '⿸': { name: '左上包围结构', nameEn: 'enclosure from the upper left', outer: 'flex-start;justify-content:flex-start', boxes: [[0, 0, 100, 100], [34, 34, 66, 66]] },
    '⿹': { name: '右上包围结构', nameEn: 'enclosure from the upper right', outer: 'flex-start;justify-content:flex-end', boxes: [[0, 0, 100, 100], [0, 34, 66, 66]] },
    '⿺': { name: '左下包围结构', nameEn: 'enclosure from the lower left', outer: 'flex-end;justify-content:flex-start', boxes: [[0, 0, 100, 100], [34, 0, 66, 66]] },
    '⿻': { name: '穿插结构', nameEn: 'overlaid structure', outer: 'center', boxes: [[0, 0, 100, 100], [20, 20, 60, 60]] },
    '独体': { name: '独体字', nameEn: 'single-component character (独体字)', boxes: [[0, 0, 100, 100]] }
  };
  var ROLE = { meaning: '表意（形旁）', sound: '表音（声旁）', form: '只是字形' };
  // English labels: the Chinese terms 形旁 / 声旁 are kept only for the Chinese pack (set in start())
  var ROLE_EN = { meaning: 'meaning part', sound: 'sound part', form: 'shape only' };
  var ROLE_EN_ZH = { meaning: 'meaning part (形旁)', sound: 'sound part (声旁)', form: 'shape only' };
  var STROKES = [
    ['横', 'M6 21 L34 19'], ['竖', 'M20 5 L20 35'], ['撇', 'M28 6 Q25 24 8 34'], ['点', 'M15 11 L25 23'],
    ['捺', 'M8 8 Q19 25 35 32'], ['提', 'M8 31 L32 14'], ['折（横折）', 'M6 10 L30 10 L30 35'], ['钩（竖钩）', 'M22 5 L22 32 L14 26']
  ];
  var STROKES_EN = ['horizontal', 'vertical', 'left-falling', 'dot', 'right-falling', 'rising', 'turn', 'hook'];
  function idcName(k) { var spec = IDC[k] || IDC['独体']; return T(spec, 'name'); }
  function aName(k) { var n = idcName(k); return (/^[aeiou]/.test(n) ? 'an ' : 'a ') + n; }

  /* ---------- reading comparison (zh: pinyin; ja: on-yomi) ---------- */
  var TM = {}; ['āáǎàa', 'ēéěèe', 'īíǐìi', 'ōóǒòo', 'ūúǔùu', 'ǖǘǚǜü'].forEach(function (row) {
    for (var i = 0; i < 4; i++) TM[row[i]] = [row[4], i + 1];
  });
  function pyParse(p) {
    var base = '', tone = 0;
    for (var i = 0; i < p.length; i++) { var m = TM[p[i]]; if (m) { base += m[0]; tone = m[1]; } else base += p[i]; }
    return { base: base, tone: tone };
  }
  var INITS = ['zh', 'ch', 'sh', 'b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'k', 'h', 'j', 'q', 'x', 'r', 'z', 'c', 's', 'y', 'w'];
  function pySplit(b) { for (var i = 0; i < INITS.length; i++) if (b.indexOf(INITS[i]) === 0) return [INITS[i], b.slice(INITS[i].length)]; return ['', b]; }
  function kanaNorm(k) { return k.normalize('NFD').replace(/[゙゚]/g, '').replace(/ウ$/, ''); }
  var REL = { same: '和声旁同音', tone: '只差声调', partial: '声母或韵母相同', near: '相近（清浊或长短不同）', none: '声旁已不提示读音' };
  var REL_EN = { same: 'same sound as the sound part', tone: 'differs only in tone', partial: 'same initial or same final', near: 'close (differs in voicing or length)', none: 'the sound part no longer hints at the reading' };
  var CLUE = { same: '有用', tone: '有用', partial: '部分有用', near: '部分有用', none: '失效' };
  var CLUE_EN = { same: 'useful', tone: 'useful', partial: 'partly useful', near: 'partly useful', none: 'fails' };
  function relText(k) { return EN ? REL_EN[k] : REL[k]; }
  function clueText(k) { return EN ? CLUE_EN[k] : CLUE[k]; }

  function start(pack) {
    var JA = pack.lang === 'ja';
    // Chinese interface: <html lang> follows the pack (as before). English interface: it stays "en" and the pack language picks the CJK font.
    if (EN) { document.documentElement.setAttribute('data-pack-lang', JA ? 'ja' : 'zh'); ROLE = JA ? ROLE_EN : ROLE_EN_ZH; }
    else document.documentElement.lang = JA ? 'ja' : 'zh-CN';
    var title = T(pack, 'title'), cats = T(pack, 'cats') || {};
    var B = KTBlock.init({ id: 'hanzi-parts', primitive: 'prim:character-anatomy', title: title, set: pack.id });
    document.title = title + ' · Hanzi Parts';
    var byGlyph = {}; pack.chars.forEach(function (c) { byGlyph[c.glyph] = c; });
    var comp = {}; pack.components.forEach(function (c) { comp[c.glyph] = c; });
    var modes = [{ id: 'explore', label: L('拆字', 'Take apart') }, { id: 'build', label: L('拼字', 'Build') }, { id: 'family', label: L('同族', 'Families') }, { id: 'guess', label: L('猜一猜', 'Guess') }];
    var seenKey = 'hp-seen-' + pack.id;
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'explore',
      cur: byGlyph[params.get('char')] || pack.chars.find(function (c) { return c.parts.length > 1; }),
      fam: null, build: null, guess: null, solved: {},
      seen: B.store(seenKey) || {}, gStats: { total: 0, unrel: 0 }
    };
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); render(); }, onVariant: function () { st.build = null; st.guess = null; render(); } });
    var bar = h('div', { class: 'kb-bar' });
    var body = h('div');
    var side = h('aside', { class: 'hp-side' });
    document.getElementById('app').append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'hp-layout' }, [body, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    function child() { return B.variant === 'child'; }
    function markSeen(c) { if (!st.seen[c.glyph]) { st.seen[c.glyph] = 1; B.store(seenKey, st.seen); } }
    function compReading(g) { var c = comp[g]; if (!c) return null; return JA ? (c.on || []) : c.pinyin; }
    function relOf(c, part) {
      var r = compReading(part.glyph);
      if (!r || !r.length) return null;
      if (JA) {
        if (c.on.some(function (o) { return r.indexOf(o) >= 0; })) return 'same';
        if (c.on.some(function (o) { return r.some(function (x) { return kanaNorm(x) === kanaNorm(o); }); })) return 'near';
        return 'none';
      }
      var a = pyParse(c.pinyin), b = pyParse(r);
      if (a.base === b.base) return a.tone === b.tone ? 'same' : 'tone';
      var sa = pySplit(a.base), sb = pySplit(b.base);
      return sa[0] === sb[0] || sa[1] === sb[1] ? 'partial' : 'none';
    }
    function soundPart(c) { return c.parts.find(function (p) { return p.role === 'sound'; }); }
    function meaningPart(c) { return c.parts.find(function (p) { return p.role === 'meaning' && p.cat; }); }
    function catLabel(k) { return cats[k] || k; }
    // meaning in the interface language (Chinese pack: its existing English gloss; Japanese pack: the English sibling of the Chinese gloss)
    function meaningOf(c) { return T(c.meaning, 'zh'); }
    function say(c, text) {
      var t = text || c.say || c.glyph;
      B.speak(t, pack.speech, { audio: c.audio }); // silent when speech is unavailable; the button says so
    }
    function note(msg, tone) { var f = body.querySelector('.kb-feedback'); if (f) { f.textContent = msg; f.className = 'kb-feedback ' + (tone || ''); } }

    function readingEl(c) {
      if (!JA) { var t = pyParse(c.pinyin).tone; return h('span', { class: 'reading tone' + t, text: c.pinyin }); }
      return h('span', { class: 'reading kana' }, [c.on.join('・'), c.kun.length ? h('span', { class: 'badge' }, L('　/　', ' / ')) : null, c.kun.length ? kunEl(c.kun) : null]);
    }
    function kunEl(list) {
      var out = h('span');
      list.forEach(function (k, i) {
        var a = k.split('.');
        if (i) out.append('・');
        out.append(a[0]); if (a[1]) out.append(h('span', { class: 'oku', text: a[1] }));
      });
      return out;
    }
    var canSpeak = 'speechSynthesis' in window;
    function playBtn(c, text, label) { return h('button', { class: 'kb-btn', 'aria-label': L('播放读音', 'Play the reading'), disabled: !canSpeak && !c.audio, title: canSpeak ? null : L('这个浏览器不能播放语音', 'This browser cannot play speech'), onclick: function () { say(c, text); } }, '▶ ' + (label || L('听', 'Listen'))); }

    /* structure diagram. slots: [{glyph, role, onclick, cls}] — missing glyph = empty slot */
    function diagram(structure, slots, opts) {
      opts = opts || {};
      var spec = IDC[structure] || IDC['独体'];
      var box = h('div', { class: 'dg', role: 'img', 'aria-label': T(spec, 'name') });
      spec.boxes.forEach(function (b, i) {
        var sl = slots[i] || {};
        var outer = spec.outer && i === 0;
        var cls = 'slot ' + (outer ? 'outer' : 'inner') + (sl.glyph ? ' r-' + (sl.role || 'form') : ' empty') + (sl.cls ? ' ' + sl.cls : '');
        var style = 'left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[2] + '%;height:' + b[3] + '%;' + (outer ? 'align-items:' + spec.outer + ';' : '');
        var el = h(sl.onclick ? 'button' : 'div', { class: cls, style: style, onclick: sl.onclick || null, 'aria-label': sl.glyph ? sl.glyph + (sl.role ? L('，', ', ') + ROLE[sl.role] : '') : L('空位 ', 'Empty slot ') + (i + 1) },
          [h('span', { class: 'g', text: sl.glyph || '' }), opts.numbers ? h('span', { class: 'n', text: String(i + 1) }) : null]);
        box.append(el);
      });
      return box;
    }
    function partSlots(c) { return c.structure === '独体' ? [{ glyph: c.glyph, role: 'form' }] : c.parts.map(function (p) { return { glyph: p.glyph, role: p.role }; }); }

    /* ---------- side cards ---------- */
    function legend() {
      return h('div', { class: 'kb-card' }, [h('b', { text: L('颜色', 'Colours') }), h('div', { class: 'legend' }, Object.keys(ROLE).map(function (r) { return h('span', { class: 'role r-' + r, text: ROLE[r] }); })),
        h('p', { class: 'kb-note', text: L('部件只是线索：形旁给意思的大类，声旁给读音的方向，都可能失效。这里不讲字源故事。', 'Components are only clues: the meaning part gives the broad category of meaning, the sound part points towards the reading, and either can fail. No etymology stories here.') })]);
    }
    function strokeCard(c) {
      return h('details', { class: 'kb-card' }, [h('summary', {}, [h('b', { text: L('基本笔画', 'Basic strokes') }), c ? L('　这个字 ' + c.strokes + ' 画', ' This character: ' + c.strokes + ' strokes') : '']),
        h('div', { class: 'strokes' }, STROKES.map(function (s, si) {
          var svg = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="' + s[1] + '" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + s[1].split(' ')[0].slice(1) + '" cy="' + s[1].split(' ')[1] + '" r="3.2" fill="var(--t4)"/></svg>';
          var d = h('div'); d.innerHTML = svg; d.append(EN ? STROKES_EN[si] + (JA ? '' : ' ' + s[0].replace('（', ' (').replace('）', ')')) : s[0]); return d;
        })),
        h('p', { class: 'kb-note', text: L('红点是起笔处。没有经过授权核对的笔顺数据，这里不演示逐笔笔顺；请对照' + (JA ? '日本学校教学通行笔顺' : '《现代汉语通用字笔顺规范》') + '或字帖。',
          'The red dot is where the stroke starts. There is no licence-checked stroke-order data here, so stroke-by-stroke order is not shown; check it against ' + (JA ? 'the stroke order commonly taught in Japanese schools' : 'the standard 《现代汉语通用字笔顺规范》') + ' or a copybook.') })]);
    }
    function notesFor(pred) {
      return (pack.notes || []).filter(pred).map(function (n) {
        return h('div', { class: 'kb-card reverse' }, [h('b', { text: n.kind === 'sound' ? L('声旁不总可靠', 'The sound part is not always reliable') : L('形旁不总可靠', 'The meaning part is not always reliable') }), h('p', { class: 'kb-note cjk', text: T(n, 'note') })]);
      });
    }

    /* ---------- 拆字 explore ---------- */
    function pickerBar() {
      bar.innerHTML = '';
      bar.append(h('div', { class: 'pick', role: 'group', 'aria-label': L('选一个字', 'Pick a character') }, pack.chars.map(function (c) {
        return h('button', { 'aria-pressed': st.cur === c ? 'true' : 'false', title: meaningOf(c), onclick: function () { selectChar(c); } }, c.glyph);
      })));
    }
    function selectChar(c) { st.cur = c; markSeen(c); B.emit('select', { item: c.glyph }); say(c); render(); }
    function renderExplore() {
      var c = st.cur; markSeen(c);
      pickerBar();
      var meta = h('div', { class: 'meta' }, [
        h('p', {}, [readingEl(c), ' ', playBtn(c)]),

      if ((q.catOpts && !q.ans.cat) || (q.readOpts && !q.ans.read)) { note(L('两个问题都选一个再提交。猜错没关系。', 'Pick an answer for both questions before you submit. A wrong guess is fine.'), 'warn'); return; }
      if (q.catOpts) B.attempt(c.glyph + ':meaning', { correct: q.ans.cat === q.cat, response: q.ans.cat });
      if (q.readOpts) B.attempt(c.glyph + ':sound', { correct: q.ans.read === q.read, response: q.ans.read });
      finishGuess();
    }
    function finishGuess() { var q = st.guess; q.done = true; markSeen(q.c); render(); say(q.c); }
    function renderGuess() {
      if (!st.guess) newGuess();
      var q = st.guess;
      bar.innerHTML = '';
      var left = pack.chars.filter(function (c) { return !st.seen[c.glyph] && guessable(c); }).length;
      bar.append(h('span', { class: 'kb-note', text: L('只出你还没看过的字（剩 ' + left + ' 个）。这是迁移：用部件线索猜，不靠记忆。', 'Only characters you have not seen yet come up (' + left + ' left). This is transfer: guess from the component clues, not from memory.') }),
        h('button', { class: 'kb-btn', onclick: function () { st.seen = {}; B.store(seenKey, {}); st.guess = null; render(); } }, L('清空“已看过”', 'Clear "seen"')));
      body.innerHTML = ''; side.innerHTML = '';
      if (q.empty) { body.append(h('div', { class: 'kb-card', text: L('这个数据包里的字你都看过了。清空“已看过”后可以再来，但那时就不算迁移了。', 'You have seen every character in this data pack. Clear "seen" to go again, but then it no longer counts as transfer.') })); return; }
      var c = q.c, mp = meaningPart(c), sp = soundPart(c);
      var card = h('div', { class: 'kb-card' }, [
        h('div', { class: 'hero' }, [h('div', { class: 'big', text: c.glyph }), diagram(c.structure, partSlots(c)),
          h('div', { class: 'meta' }, c.parts.map(function (p) { return h('p', {}, [h('b', { class: 'cjk', text: p.glyph }), ' ', T(p, 'name'), ' ', h('span', { class: 'role r-' + p.role, text: ROLE[p.role] })]); }))])
      ]);
      function optRow(key, opts, truth, labelFn) {
        return h('div', { class: 'opts' }, opts.map(function (o) {
          var cls = q.done ? (o === truth ? 'right' : (q.ans[key] === o ? 'wrongpick' : '')) : '';
          return h('button', { class: cls, 'aria-pressed': q.ans[key] === o ? 'true' : 'false', disabled: q.done,
            onclick: function () { q.ans[key] = o; B.emit('select', { item: c.glyph, question: key, choice: o }); render(); } }, labelFn(o));
        }));
      }
      if (q.catOpts) card.append(h('p', { class: 'kb-prompt', text: L('① 看表意部件：这个字的意思大概和什么有关？', '① Look at the meaning part: what is the meaning of this character probably related to?') }), optRow('cat', q.catOpts, q.cat, catLabel));
      if (q.readOpts) card.append(h('p', { class: 'kb-prompt', text: L('② 看表音部件：这个字最可能读什么？', '② Look at the sound part: how is this character most likely read?') }), optRow('read', q.readOpts, q.read, function (o) { return h('span', { class: JA ? 'kana' : 'tone' + pyParse(o).tone, text: o }); }));
      if (!q.done) {
        card.append(h('div', { class: 'kb-bar' }, [
          h('button', { class: 'kb-btn primary', onclick: submitGuess }, L('提交', 'Submit')),
          h('button', { class: 'kb-btn', disabled: q.hints >= (sp ? 2 : 1), onclick: function () {
            q.hints++; B.hint(c.glyph + (q.hints === 1 && mp ? ':meaning' : ':sound'), q.hints);
            render();
          } }, L('提示', 'Hint')),
          h('button', { class: 'kb-btn', onclick: function () { if (q.catOpts) B.reveal(c.glyph + ':meaning'); if (q.readOpts) B.reveal(c.glyph + ':sound'); finishGuess(); } }, L('看答案', 'Show the answer'))
        ]));
        if (q.hints >= 1) {
          var hp = mp || sp;
          var known = pack.chars.filter(function (x) { return x !== c && st.seen[x.glyph] && x.parts.some(function (p) { return p.glyph === hp.glyph; }); });
          card.append(h('p', { class: 'kb-feedback warn' }, [L('提示：这个字的“' + hp.glyph + '”你在哪个字里见过？', 'Hint: in which character have you seen the "' + hp.glyph + '" of this character?'), known.length ? L(' 例如 ', ' For example ') + known.slice(0, 4).map(function (x) { return x.glyph; }).join(' ') : '']));
        }
        if (q.hints >= 2 && sp) {
          var same = pack.chars.find(function (x) { return x !== c && st.seen[x.glyph] && x.parts.some(function (p) { return p.glyph === sp.glyph && p.role === 'sound'; }); });
          card.append(h('p', { class: 'kb-feedback warn' }, [L('提示：“' + sp.glyph + '”自己读 ', 'Hint: "' + sp.glyph + '" on its own reads '), h('b', { text: [].concat(compReading(sp.glyph)).join('・') }), same ? L('；' + same.glyph + ' 读 ' + readingKey(same), '; ' + same.glyph + ' reads ' + readingKey(same)) : '', L('。', '.')]));
        }
        card.append(h('div', { class: 'kb-feedback', text: L('猜意思和猜读音分开记录；只对一个不算猜中。', 'Guessing the meaning and guessing the reading are recorded separately; getting only one of them right does not count as a correct guess.') }));
      } else {
        var rel = sp ? relOf(c, sp) : null;
        card.append(h('div', { class: 'kb-feedback' + (rel && CLUE[rel] === '失效' ? ' warn' : '') }, [
          h('p', { style: 'margin:0' }, [L('答案：', 'Answer: '), h('b', { class: 'big', style: 'font-size:1.6rem', text: c.glyph }), ' ', readingEl(c), ' ', playBtn(c), L('　', ' '), EN ? meaningOf(c) + (!JA && c.meaning.en ? ' (' + c.meaning.zh + ')' : '') : c.meaning.zh + (!JA && c.meaning.en ? '（' + c.meaning.en + '）' : '')]),
          mp ? h('p', {}, [L('表意线索 ' + mp.glyph + '（' + catLabel(mp.cat) + '）：', 'Meaning clue ' + mp.glyph + ' (' + catLabel(mp.cat) + '): '), h('b', { text: L('有用', 'useful') }), L('——只告诉你大类，不等于认识这个字。', ' — it only tells you the broad category; that is not the same as knowing the character.')]) : null,
          rel ? h('p', {}, [L('表音线索 ' + sp.glyph + '（' + [].concat(compReading(sp.glyph)).join('・') + '）：', 'Sound clue ' + sp.glyph + ' (' + [].concat(compReading(sp.glyph)).join('・') + '): '), h('b', { text: clueText(rel) }), L('——' + REL[rel] + '。', ' — ' + REL_EN[rel] + '.')]) : null,
          JA && c.zhForm ? h('p', { class: 'kb-note', text: L('中文简体写作 ' + c.zhForm + '。', 'In simplified Chinese it is written ' + c.zhForm + '.') }) : null
        ]), h('div', { class: 'kb-bar' }, [h('button', { class: 'kb-btn primary', onclick: function () { st.guess = null; render(); } }, L('下一个', 'Next')),
          h('button', { class: 'kb-btn', onclick: function () { st.cur = c; st.mode = 'explore'; ui.setMode('explore'); render(); } }, L('拆开看这个字', 'Take this character apart'))]));
      }
      body.append(card);
      notesFor(function (n) { return q.done && n.chars.indexOf(c.glyph) >= 0; }).forEach(function (e) { side.append(e); });
      side.append(h('div', { class: 'kb-card reverse' }, [h('b', { text: L('为什么要猜', 'Why guess') }), h('p', { class: 'kb-note', text: L('每三题里至少一题的声旁不可靠。总选“和声旁同音”的读法，会被这些题卡住——这正是要学会的：线索什么时候管用，什么时候失效。', 'In at least one of every three questions the sound part is unreliable. If you always pick the reading that is "the same as the sound part", these questions will trip you up — and that is exactly what there is to learn: when a clue works and when it fails.') })]));
    }

    function render() {
      if (st.mode === 'explore') renderExplore();
      else if (st.mode === 'family') renderFamily();
      else if (st.mode === 'build') renderBuild();
      else renderGuess();
    }
    render();
  }
})();
</script>
