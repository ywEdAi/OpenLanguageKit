<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Role marking</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .rm-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .rm-layout { grid-template-columns: 1fr; } }
  .rm-side { display: grid; gap: 12px; }
  .rm-stage { display: grid; gap: 12px; }
  .rm-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 700px) { .rm-top { grid-template-columns: 1fr; } }
  .rm-scene { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 4px; }
  .rm-scene svg { width: 100%; height: auto; display: block; }
  .sv-t { fill: var(--ink); font-family: var(--font); }
  .sv-m { fill: var(--muted); font-family: var(--font); }
  .sv-num { fill: var(--accent); font-weight: 700; font-family: var(--font); }
  .sv-frame { fill: var(--panel); stroke: var(--line); stroke-width: 2; }
  .sv-band { fill: var(--accent-soft); }
  .sv-ghost { fill: none; stroke: var(--bad); stroke-width: 2; stroke-dasharray: 5 4; }
  .rm-sent { font-size: 1.35rem; line-height: 2.2; margin: 0; }
  [data-variant="child"] .rm-sent { font-size: 1.6rem; }
  .tok { white-space: nowrap; }
  .tok sup { color: var(--accent); font-weight: 700; font-size: .7rem; margin-right: 1px; }
  .slot { display: inline-block; min-width: 2.2em; text-align: center; border: 2px dashed var(--accent); border-radius: 8px; padding: 0 4px; margin: 0 2px; line-height: 1.5; background: var(--panel); color: var(--accent); }
  .slot.ok { border-style: solid; background: var(--accent-soft); color: var(--ink); }
  .slot.no { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
  .slot.none { color: var(--muted); }
  .fixed { color: var(--ink); }
  .rm-gloss { color: var(--muted); margin: 0; }
  .rm-read { color: var(--muted); font-size: .9rem; margin: 0; }
  .rows { display: grid; gap: 8px; }
  .row { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); display: grid; gap: 6px; }
  .row.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus); }
  .row.good { border-color: var(--accent); background: var(--accent-soft); }
  .row.badrow { border-color: var(--bad); }
  .row-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .row-h .n { color: var(--accent); font-weight: 700; }
  .row-h .w { font-size: 1.15rem; }
  .row-h .r { color: var(--muted); font-size: .85rem; }
  .chipbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .rb { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: .9rem; display: inline-flex; gap: 4px; align-items: center; }
  .rb .dot { width: .7em; height: .7em; border-radius: 50%; background: var(--rc, var(--muted)); display: inline-block; }
  .rb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .rb.right { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .rb.wrongpick { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
  .rb:disabled { cursor: default; }
  .mk { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; min-width: 3em; padding: 6px 10px; font-size: 1.15rem; }
  [data-variant="child"] .mk { min-width: 4em; padding: 10px 14px; font-size: 1.4rem; }
  .mk small { display: block; font-size: .65rem; color: var(--muted); }
  .mk.right { background: var(--accent-soft); border-color: var(--accent); }
  .mk.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .mk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .mk[aria-pressed="true"] small { color: var(--accent-ink); }
  .rtag { display: inline-flex; gap: 4px; align-items: center; font-size: .8rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rc, var(--line)); }
  .rtag .dot { width: .6em; height: .6em; border-radius: 50%; background: var(--rc, var(--muted)); display: inline-block; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .frame-card { border-left: 4px solid var(--warn); }
  .frame-card .ft { font-size: 1.1rem; margin: 0 0 4px; }
  .why .opt { text-align: left; }
  .whyopts { display: grid; gap: 6px; }
  .whyopts button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .whyopts button.right { background: var(--accent-soft); border-color: var(--accent); }
  .whyopts button.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .8rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  .tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .tbl td { border-top: 1px solid var(--line); padding: 4px 2px; vertical-align: top; }
  .reverse { border-left: 4px solid var(--warn); }
  .preview { font-size: 1.3rem; min-height: 1.6em; margin: 0; }
  .checklist { margin: 6px 0 0; padding-left: 20px; }
  .checklist li.ok { color: var(--ink); }
  .checklist li.no { color: var(--bad); }
  .inc { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 2px 10px; }
  .inc[aria-pressed="true"] { border-style: solid; background: var(--accent-soft); border-color: var(--accent); }
  .r-agent { --rc: var(--t1); } .r-figure { --rc: var(--t0); } .r-object { --rc: var(--t4); } .r-recipient { --rc: var(--t3); }
  .r-beneficiary { --rc: var(--t3); } .r-place { --rc: var(--t2); } .r-exist { --rc: var(--t2); } .r-goal { --rc: var(--accent); }
  .r-direction { --rc: var(--accent); } .r-source { --rc: var(--warn); } .r-path { --rc: var(--accent); } .r-instrument { --rc: var(--t0); }
  .r-companion { --rc: var(--t1); } .r-target { --rc: var(--t4); } .r-ref { --rc: var(--t3); }
  .done { font-size: 2.4rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t, EN = KTBlock.lang === 'en';
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'role-marking-en';
  var app = document.getElementById('app');
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || {};
  if (entry.block && entry.block !== 'role-marking') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var file = entry.file || 'data/role-marking.js';   // fallback while the registry does not list the pack yet
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  /* Semantic roles shared by all packs. Labels are interface text; the pack decides which markers fit. */
  var ROLE = {
    agent: ['做事的人', 'Doer', '🙋'], figure: ['在某处的人或物', 'Who or what is somewhere', '📌'], object: ['动作对象', 'Thing acted on', '🎯'],
    recipient: ['接受的人', 'Receiver', '🤲'], beneficiary: ['受益的人（为谁做）', 'Beneficiary (done for whom)', '🎁'],
    place: ['动作发生处', 'Where the action happens', '🏟'], exist: ['存在处（待在哪儿）', 'Where someone or something is', '🏠'],
    goal: ['到达点 / 终点', 'Arrival point / end point', '🏁'], direction: ['方向（朝哪儿去）', 'Direction (heading for)', '🧭'],
    source: ['起点', 'Starting point', '🚩'], path: ['经过的路线', 'Route taken', '🛤'], instrument: ['工具或手段', 'Tool or means', '🔧'],
    companion: ['同伴（和谁一起）', 'Companion (together with)', '👫'], target: ['感受、态度或能力的对象', 'What a feeling, attitude or ability is about', '💭'],
    ref: ['距离的参照点', 'Reference point for distance', '📏']
  };
  var CHILD = { place: ['在哪儿做', 'Where it happens', '🏠'], exist: ['在哪儿', 'Where it is', '🏠'], goal: ['去哪儿', 'Where to', '👣'], direction: ['往哪儿', 'Which way', '👣'], companion: ['和谁', 'With whom', '👫'], agent: ['谁', 'Who', '🙋'], figure: ['谁 / 什么', 'Who / what', '📌'], object: ['什么', 'What', '🎯'] };
  var WHY = [
    { id: 'role', zh: '角色决定：这个角色就用这个标记', en: 'The role decides: this role takes this marker' },
    { id: 'verb', zh: '动词或这个词本身固定要求', en: 'Fixed by the verb or by the word itself' },
    { id: 'split', zh: '母语里的同一个词，在这里要分开选', en: 'One word in your first language splits into different choices here' }
  ];
  var NUM = ['①', '②', '③', '④', '⑤', '⑥'];
  function arr(v) { return v === undefined || v === null ? [] : [].concat(v); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'role-marking', primitive: 'prim:role-marking', title: title, set: pack.id });
    document.title = title + ' · Role marking';
    var showGloss = KTBlock.lang !== pack.lang;
    var SP = pack.space || '';
    var modes = [{ id: 'roles', label: L('连角色', 'Link roles') }, { id: 'mark', label: L('选标记', 'Choose markers') }, { id: 'build', label: L('自己造句', 'Make your own') }];
    var st = { mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'roles', queue: [], idx: 0, S: null, record: {}, firstMarks: {}, build: null };
    function child() { return B.variant === 'child'; }
    function roleLabel(r) { var c = child() && CHILD[r] ? CHILD[r] : ROLE[r]; return c ? c[2] + ' ' + L(c[0], c[1]) : r; }
    function roleShort(r) { var c = ROLE[r]; return c ? L(c[0], c[1]) : r; }
    function markerNote(m) { var o = pack.markers[m]; return o ? T(o, 'note') : ''; }
    function mlabel(m) { return m === '—' ? L('（不用）', '(none)') : m; }

    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); newRound(); },
      onVariant: function () { newRound(); } });
    var bar = h('div', { class: 'kb-bar' }), stage = h('div', { class: 'kb-card rm-stage' }), side = h('aside', { class: 'rm-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'rm-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    /* ---------- scene diagram (labelled SVG, drawn from the roles) ---------- */
    var POS = { agent: [150, 112], figure: [200, 112], object: [235, 112], companion: [92, 112], recipient: [305, 112], beneficiary: [305, 112],
      target: [262, 112], instrument: [205, 168], goal: [362, 92], direction: [362, 92], source: [40, 92], ref: [40, 92], path: [200, 186] };
    function scene(item, opt) {
      opt = opt || {};
      var roleOf = function (n) { return opt.over && opt.over.k === n.k ? opt.over.role : arr(n.role)[0]; };
      var geoOf = function (n) { if (opt.over && opt.over.k === n.k && opt.over.geo) return opt.over.geo; return n.geo; };
      var nouns = item.nouns.filter(function (n) { return !n.offstage; });
      var out = [], P = {}, isTime = item.line === 'time';
      var frame = null, ground = null;
      nouns.forEach(function (n) { var r = roleOf(n); if (!isTime && (r === 'place' || r === 'exist')) { if (geoOf(n)) ground = ground || n; else frame = frame || n; } });
      var used = {};
      function put(n, xy) { var key = xy.join(','); while (used[key]) { xy = [xy[0], xy[1] + 36]; key = xy.join(','); } used[key] = 1; P[n.k] = xy; }
      if (isTime) {
        out.push('<line x1="30" y1="150" x2="370" y2="150" style="stroke:var(--muted);stroke-width:3"/>');
        for (var x = 50; x <= 350; x += 50) out.push('<line x1="' + x + '" y1="144" x2="' + x + '" y2="156" style="stroke:var(--muted);stroke-width:2"/>');
        nouns.forEach(function (n) { var r = roleOf(n); put(n, r === 'source' ? [80, 96] : r === 'goal' ? [320, 96] : [200, 60]); });
      } else if (ground) {
        var g = geoOf(ground), fig = nouns.filter(function (n) { return n !== ground && (roleOf(n) === 'figure' || roleOf(n) === 'agent'); })[0];
        var G = { in: [[310, 150], [200, 140]], on: [[200, 150], [200, 80]], under: [[200, 88], [200, 166]], at: [[250, 120], [150, 120]], beside: [[250, 120], [150, 120]] }[g] || [[250, 120], [150, 120]];
        P[ground.k] = G[0]; if (fig) P[fig.k] = G[1];
        if (g === 'in') out.push('<path d="M140 92 L140 180 L260 180 L260 92" style="fill:none;stroke:var(--t2);stroke-width:4"/><line x1="262" y1="150" x2="284" y2="150" style="stroke:var(--t2);stroke-width:2;stroke-dasharray:3 3"/>');
        if (g === 'on') out.push('<line x1="130" y1="120" x2="270" y2="120" style="stroke:var(--t2);stroke-width:4"/>');
        if (g === 'under') out.push('<line x1="130" y1="128" x2="270" y2="128" style="stroke:var(--t2);stroke-width:4"/>');
        if (g === 'at') out.push('<text x="200" y="128" text-anchor="middle" font-size="22">📍</text>');
        nouns.forEach(function (n) { if (!P[n.k]) put(n, POS[roleOf(n)] || [330, 170]); });
      } else {
        nouns.forEach(function (n) { if (n !== frame) put(n, POS[roleOf(n)] || [200, 112]); });
      }
      if (frame) {
        var fr = roleOf(frame);
        out.unshift('<rect x="68" y="22" width="258" height="182" rx="16" class="sv-frame" style="' + (opt.showRoles ? 'stroke:var(--t2);' : '') + (fr === 'exist' ? 'stroke-dasharray:8 6;' : '') + '"/>' +
          '<text x="80" y="48" font-size="22">' + esc(frame.pic) + '</text><text x="108" y="46" font-size="15" class="sv-t">' + esc(frame.w) + '</text>' +
          '<text x="72" y="48" font-size="12" class="sv-num" text-anchor="end">' + NUM[item.nouns.indexOf(frame)] + '</text>');
        if (opt.over && opt.over.k === frame.k) out.push('<rect x="64" y="18" width="266" height="190" rx="18" class="sv-ghost"/>');
      }
      var hasPath = nouns.some(function (n) { return roleOf(n) === 'path'; });
      if (hasPath) out.unshift('<rect x="20" y="172" width="360" height="34" rx="8" class="sv-band"/>');
      /* arrows only once the roles are known to the learner */
      if (opt.showRoles) {
        var from = nouns.filter(function (n) { return roleOf(n) === 'agent' || roleOf(n) === 'figure'; })[0];
        nouns.forEach(function (n) {
          var r = roleOf(n), a = from && P[from.k], b = P[n.k];
          if (!a || !b || n === from || n === frame) return;
          var col = { object: 'var(--t4)', recipient: 'var(--t3)', beneficiary: 'var(--t3)', goal: 'var(--accent)', direction: 'var(--accent)', source: 'var(--warn)', instrument: 'var(--t0)', companion: 'var(--t1)', target: 'var(--t4)', ref: 'var(--t3)', path: 'var(--accent)' }[r];
          if (!col) return;
          if (r === 'source') out.push(arrow(b, a, col, true));
          else if (r === 'path') out.push(arrow([40, 189], [360, 189], col, true));
          else if (r === 'direction') out.push(arrow(a, [a[0] + (b[0] - a[0]) * .7, a[1] + (b[1] - a[1]) * .7], col, true, true));
          else if (r === 'companion' || r === 'instrument' || r === 'ref') out.push('<line x1="' + a[0] + '" y1="' + (a[1] + 40) + '" x2="' + b[0] + '" y2="' + (b[1] + 40) + '" style="stroke:' + col + ';stroke-width:3;stroke-dasharray:' + (r === 'companion' ? '0' : '3 4') + '"/>');
          else out.push(arrow(a, b, col, r === 'goal' || r === 'beneficiary' || r === 'target'));
        });
      }
      nouns.forEach(function (n) {
        if (n === frame) return;
        var p = P[n.k]; if (!p) return;
        var big = n === ground ? 46 : 32;
        out.push('<text x="' + p[0] + '" y="' + (p[1] + 8) + '" font-size="' + big + '" text-anchor="middle">' + esc(n.pic) + '</text>' +
          '<text x="' + p[0] + '" y="' + (p[1] + (n === ground ? 46 : 36)) + '" font-size="13" text-anchor="middle" class="sv-t">' + esc(n.w) + '</text>' +
          '<text x="' + (p[0] - big / 2 - 4) + '" y="' + (p[1] - big / 2 + 4) + '" font-size="12" class="sv-num" text-anchor="middle">' + NUM[item.nouns.indexOf(n)] + '</text>');
        if (opt.over && opt.over.k === n.k) out.push('<circle cx="' + p[0] + '" cy="' + (p[1] + 6) + '" r="' + (big / 2 + 14) + '" class="sv-ghost"/>');
      });
      if (item.verbPic) out.push('<text x="372" y="200" font-size="20" text-anchor="middle">' + esc(item.verbPic) + '</text>');
      var d = h('div', { class: 'rm-scene', role: 'img', 'aria-label': L('场景图：', 'Scene: ') + (T(item.gloss || {}, KTBlock.lang) || item.nouns.map(function (n) { return n.w; }).join(', ')) });
      d.innerHTML = '<svg viewBox="0 0 400 214" xmlns="http://www.w3.org/2000/svg">' + out.join('') + '</svg>';   // built from authored pack data, text escaped
      return d;
    }
    function arrow(a, b, col, dashed, open) {
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / len, uy = dy / len;
      var x1 = a[0] + ux * 26, y1 = a[1] + uy * 26 - 10, x2 = b[0] - ux * (open ? 0 : 28), y2 = b[1] - uy * (open ? 0 : 28) - 10;
      var hx = x2 - ux * 10, hy = y2 - uy * 10, px = -uy * 6, py = ux * 6;
      return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" style="stroke:' + col + ';stroke-width:3;' + (dashed ? 'stroke-dasharray:7 5;' : '') + '"/>' +
        '<polygon points="' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' ' + (hx + px).toFixed(1) + ',' + (hy + py).toFixed(1) + ' ' + (hx - px).toFixed(1) + ',' + (hy - py).toFixed(1) + '" style="fill:' + (open ? 'none' : col) + ';stroke:' + col + ';stroke-width:2"/>';
    }

    /* ---------- sentence ---------- */
    function isSlot(n) { return n.mark !== undefined; }
    function pos(n) { return n.pos || pack.markerPos; }
    function sentence(item, slotView) {
      var byK = {}; item.nouns.forEach(function (n) { byK[n.k] = n; });
      var parts = item.s.split(/\{(\w+)\}/);
      return h('p', { class: 'rm-sent', lang: pack.lang }, parts.map(function (p, i) {
        if (!(i % 2)) return p;
        var n = byK[p], num = h('sup', { text: NUM[item.nouns.indexOf(n)] });
        var word = h('span', {}, [num, n.w]);
        var slot = isSlot(n) ? slotView(n) : null;
        var kids = pos(n) === 'pre' ? [slot, slot && SP ? SP : null, word] : [word, slot];
        if (n.fixed) kids.push(h('span', { class: 'fixed', text: n.fixed }));
        return h('span', { class: 'tok' }, kids);
      }));
    }
    function filled(item, pick) {
      var byK = {}; item.nouns.forEach(function (n) { byK[n.k] = n; });
      return item.s.split(/\{(\w+)\}/).map(function (p, i) {
        if (!(i % 2)) return p;
        var n = byK[p], m = isSlot(n) ? (pick ? pick(n) : arr(n.mark)[0]) : '';
        if (m === '—') m = '';
        var w = pos(n) === 'pre' ? (m ? m + SP : '') + n.w : n.w + m;
        return w + (n.fixed || '');
      }).join('');
    }
    function glossLine(item) { var g = showGloss && item.gloss ? item.gloss[KTBlock.lang] : ''; return g ? h('p', { class: 'rm-gloss', text: g }) : null; }
    function readLine(n) { return n.r ? h('span', { class: 'r', text: n.r }) : null; }

    /* ---------- rounds ---------- */
    function pool() {
      var items = pack.items.filter(function (it) { return !child() || it.child; });
      if (!items.length) items = pack.items;
      var kc = B.kc, mine = items.filter(function (it) { return kc && arr(it.kc).indexOf(kc) >= 0; });
      var sh = KTBlock.shuffle(items);

      var fake = { nouns: b.nouns.filter(function (n) { return arr(n.roles).length; }).map(function (n) { return { k: n.k, w: n.w, pic: n.pic, role: n.roles[0], geo: n.geo }; }), gloss: b.gloss, verbPic: b.verbPic };
      var sc = scene(fake, { showRoles: !!(U.result && U.result.ok) });
      stage.append(h('div', { class: 'rm-top' }, [sc, h('div', {}, [h('p', { class: 'kb-note', text: L('动词：', 'Verb: ') }), h('p', { class: 'rm-sent', lang: pack.lang, text: b.verb }), glossLine(b)])]));
      stage.append(h('div', { class: 'rows' }, b.nouns.map(function (n) {
        var on = !!U.inc[n.k];
        return h('div', { class: 'row' }, [
          h('div', { class: 'row-h' }, [h('button', { type: 'button', class: 'inc', 'aria-pressed': on ? 'true' : 'false', disabled: U.result && U.result.ok, onclick: function () { U.inc[n.k] = !on; U.result = null; B.emit(on ? 'disconnect' : 'drop', { item: 'build:' + b.id, noun: n.w }); render(); } }, on ? L('✓ 用', '✓ use') : L('＋ 用', '+ use')),
            h('span', { text: n.pic }), h('span', { class: 'w', lang: pack.lang, text: n.w }), readLine(n)]),
          on ? h('div', { class: 'chipbtns', role: 'group', 'aria-label': L('角色', 'Roles') }, rs.map(function (r) {
            return h('button', { type: 'button', class: 'rb r-' + r, 'aria-pressed': U.role[n.k] === r ? 'true' : 'false', disabled: U.result && U.result.ok, onclick: function () { U.role[n.k] = r; U.result = null; B.emit('connect', { item: 'build:' + b.id, noun: n.w, role: r }); render(); } }, [h('span', { class: 'dot' }), roleLabel(r)]);
          })) : null,
          on ? h('div', { class: 'chipbtns', role: 'group', 'aria-label': L('标记', 'Markers') }, markers.map(function (m) {
            return h('button', { type: 'button', lang: pack.lang, class: 'mk', 'aria-pressed': U.mk[n.k] === m ? 'true' : 'false', disabled: U.result && U.result.ok, onclick: function () { U.mk[n.k] = m; U.result = null; B.emit('select', { item: 'build:' + b.id, noun: n.w, marker: m }); render(); } }, mlabel(m));
          })) : null]);
      })));
      stage.append(h('div', { class: 'kb-card' }, [h('b', { text: L('你的句子', 'Your sentence') }), h('p', { class: 'preview', lang: pack.lang, text: buildSentence(b, U) })]));
      stage.append(h('div', { class: 'tools' }, [
        h('button', { class: 'kb-btn primary', type: 'button', disabled: U.result && U.result.ok, onclick: checkBuild }, L('检查', 'Check')),
        b.frameCard ? h('button', { class: 'kb-btn', type: 'button', disabled: U.frame, onclick: function () { U.frame = true; B.hint('build:' + b.id, 1); render(); } }, L('打开格框卡（会记下）', 'Open the frame card (recorded)')) : null,
        U.result && U.result.ok ? h('button', { class: 'kb-btn', type: 'button', onclick: function () { B.speak(U.result.text, pack.speech); } }, L('▶ 听', '▶ Listen')) : null]));
      if (U.frame && b.frameCard) stage.append(h('div', { class: 'kb-card frame-card' }, [h('p', { class: 'ft', lang: pack.lang, text: b.frameCard.t }), h('p', { class: 'kb-note', text: T(b.frameCard, 'note') })]));
      if (U.result) stage.append(h('div', { class: 'kb-feedback' + (U.result.ok ? '' : ' bad') }, [U.result.ok ? L('通过。再大声说一遍这句话。', 'Passed. Now say the sentence aloud.') : L('还没通过：', 'Not yet:'),
        h('ul', { class: 'checklist' }, U.result.lines.map(function (l) { return h('li', { class: l.ok ? 'ok' : 'no', text: (l.ok ? '✓ ' : '✗ ') + l.t }); }))]));
      stage.append(h('p', { class: 'kb-note', text: L('页面只核对你选的角色和标记（按数据包里的角色—标记表），不评判你打出或说出的其他内容。', 'The page only checks the roles and markers you chose (against the role–marker table in the pack); it does not judge anything else you type or say.') }));
    }
    function renderStage() {
      stage.innerHTML = '';
      if (st.mode === 'build') {
        var b = st.queue[st.idx];
        if (!b) { doneView(); return; }
        renderBuild(b);
        stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn' + (st.build.result && st.build.result.ok ? ' primary' : ''), type: 'button', onclick: next }, st.build.result && st.build.result.ok ? L('下一张图 →', 'Next picture →') : L('跳过', 'Skip'))]));
        return;
      }
      var it = st.queue[st.idx];
      if (!it) { doneView(); return; }
      if (st.mode === 'roles') renderRoles(it); else renderMark(it);
      stage.append(h('div', { class: 'kb-feedback', hidden: true }));
      stage.append(h('div', { class: 'tools' }, [h('button', { class: 'kb-btn' + (st.S.solved ? ' primary' : ''), type: 'button', onclick: next }, st.S.solved ? L('下一题 →', 'Next →') : L('跳过', 'Skip'))]));
    }
    function renderSide() {
      side.innerHTML = '';
      var chips = Object.keys(st.record).map(function (k) { var r = st.record[k]; return h('span', { class: 'chip ' + r.cls, lang: pack.lang, text: r.text }); });
      side.append(h('div', { class: 'kb-card' }, [h('b', { text: L('这一组的记录', 'This set') }),
        chips.length ? h('div', { class: 'chips' }, chips) : h('p', { class: 'kb-note', text: L('还没有作答。', 'No answers yet.') }),
        h('p', { class: 'kb-note', text: L('绿 = 第一次就独立做对；黄 = 用过提示或看过答案；红 = 第一次做错。连角色和选标记分开记录。', 'Green = right on your own the first time; yellow = after a hint or the answer; red = wrong the first time. Roles and markers are recorded separately.') })]));
      var rows = Object.keys(st.firstMarks);
      if (rows.length) side.append(h('div', { class: 'kb-card' }, [h('b', { text: L('每个角色你第一次选的标记', 'Your first marker for each role') }),
        h('table', { class: 'tbl' }, rows.map(function (r) { return h('tr', {}, [h('td', {}, roleShort(r)), h('td', { lang: pack.lang }, st.firstMarks[r].map(function (x) { return h('span', { class: 'chip ' + (x.ok ? 'ind' : 'bad'), text: mlabel(x.m) }); }))]); }))]));
      if (pack.reverse) side.append(h('div', { class: 'kb-card reverse' }, [h('b', { text: L('角色是起点，不是全部规则', 'The role is a start, not the whole rule') }), h('p', { class: 'kb-note', text: T(pack, 'reverse') })]));
    }
    function render() { renderBar(); renderStage(); renderSide(); }

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
      var n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
      var it = st.queue[st.idx]; if (!it || st.mode !== 'mark' || !st.S) return;
      var allOk = slotNouns(it).every(function (x) { return st.S.ok[x.k]; });
      if (allOk && it.why && !child() && !st.S.why && n <= 3) { answerWhy(WHY[n - 1].id); return; }
      var f = focusNoun(it); if (!f) return;
      var opts = pack.markerOrder.filter(function (m) { return (f.opts || pack.markerOrder).indexOf(m) >= 0; });
      if (opts[n - 1]) chooseMark(f, opts[n - 1]);
    });
    newRound();
  }
})();
</script>
