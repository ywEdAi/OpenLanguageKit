<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repair and backchannel</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .rb-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .rb-layout { grid-template-columns: 1fr; } }
  .rb-main { display: grid; gap: 12px; min-width: 0; }
  .rb-side { display: grid; gap: 12px; }
  .kb-bar select { max-width: min(62vw, 340px); }
  .role { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; font-size: .92rem; }
  .role b { display: block; font-size: .75rem; color: var(--muted); }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .bub { max-width: 88%; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .bub.other { align-self: flex-start; border-bottom-left-radius: 4px; }
  .bub.me { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent); border-bottom-right-radius: 4px; }
  .bub.narr { align-self: center; border-style: dashed; color: var(--muted); font-size: .9rem; max-width: 100%; background: transparent; }
  .bub .who { display: block; font-size: .72rem; color: var(--muted); }
  .bub .tl { font-size: 1.06rem; }
  .bub .masked { color: var(--muted); letter-spacing: .1em; }
  .bub button { border: 0; background: none; color: var(--accent); padding: 0 0 0 6px; font-size: .85rem; }
  .bub.cur { box-shadow: 0 0 0 3px var(--focus); }
  .actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .actions button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 8px; text-align: left; font-size: .88rem; }
  .actions button .k { color: var(--muted); font-size: .72rem; margin-right: 4px; }
  .actions button.go { border-color: var(--accent); }
  [data-variant="child"] .actions { grid-template-columns: repeat(2, 1fr); }
  [data-variant="child"] .actions button { font-size: 1.1rem; padding: 14px; text-align: center; }
  .actions .ic { font-size: 1.6rem; display: block; }
  .phr { display: grid; gap: 6px; }
  .phr button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .timer { height: 6px; border-radius: 3px; background: var(--accent-soft); margin-bottom: 6px; overflow: hidden; }
  .timer span { display: block; height: 100%; background: var(--warn); width: 100%; transition: width linear; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tline { display: flex; flex-wrap: wrap; gap: 6px; }
  .tline button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: .82rem; }
  .tline button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tline button.ok { border-color: var(--accent); }
  .tline button.bad { border-color: var(--bad); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
  .cats button.right { background: var(--accent-soft); border-color: var(--accent); }
  .cats button.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .pair > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .pair b { display: block; font-size: .75rem; color: var(--muted); }
  .pair ul { margin: 4px 0 0; padding-left: 18px; }
  .endcard { border-left: 4px solid var(--accent); }
  .endcard.fail { border-left-color: var(--bad); }
  .flag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  textarea { width: 100%; min-height: 60px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px; }
  .checks label { display: block; margin: 3px 0; }
  .ackopts { display: grid; gap: 8px; }
  .ackopts button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; }
  .ackopts button.right { background: var(--accent-soft); border-color: var(--accent); }
  .ackopts button.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .partner ol { padding-left: 20px; font-size: .9rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'repair-and-backchannel-en';
  var reg = (window.KT_REGISTRY && KT_REGISTRY.packs) || {};
  var entry = reg[setId] || {};
  if (entry.block && entry.block !== 'repair-and-backchannel') { document.getElementById('app').textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var file = entry.file || 'data/repair-and-backchannel.js';   // fallback while the registry does not list the pack yet
  var s = document.createElement('script');
  s.src = file;
  s.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else document.getElementById('app').textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; };
  s.onerror = function () { document.getElementById('app').textContent = L('数据包加载失败：', 'Could not load the data pack: ') + file; };
  document.head.appendChild(s);

  /* The repair moves, in a fixed order (the row never reorders, so its position gives nothing away). */
  var ACTIONS = [
    { id: 'repeat', zh: '请对方再说一遍', en: 'Ask them to repeat', ic: '👂' },
    { id: 'slow', zh: '请对方说慢一点', en: 'Ask them to slow down', ic: '🐌' },
    { id: 'word', zh: '问一个词', en: 'Ask about a word', ic: '❓' },
    { id: 'confirm', zh: '复述确认', en: 'Check by repeating back', ic: '🔁' },
    { id: 'backchannel', zh: '附和、接话', en: 'Show you are listening', ic: '🙂' },
    { id: 'time', zh: '争取想一想的时间', en: 'Buy time to think', ic: '⏳' },
    { id: 'interrupt', zh: '礼貌地插话', en: 'Interrupt politely', ic: '✋' },
    { id: 'back', zh: '把话题拉回来', en: 'Bring the talk back', ic: '↩️' }
  ];
  var CHILD_ACTIONS = ['repeat', 'slow', 'word'];
  var CATS = [
    { id: 'matched', zh: '对上了（该修复时修复，该放过时放过）', en: 'Right move (repaired when needed, let it go when not)' },
    { id: 'wrongType', zh: '修复了，但类型没对上', en: 'Repaired, but the wrong kind of move' },
    { id: 'blunt', zh: '类型对，但说法生硬或关键信息错了', en: 'Right kind, but blunt wording or a wrong detail' },
    { id: 'pretend', zh: '假装听懂了，或该出声时没出声', en: 'Pretended to understand, or stayed silent when a response was due' },
    { id: 'unneeded', zh: '这里其实不需要打断', en: 'No need to interrupt here' }
  ];
  function act(id) { return ACTIONS.filter(function (a) { return a.id === id; })[0]; }

  function start(pack) {
    var B = KTBlock.init({ id: 'repair-and-backchannel', primitive: 'prim:repair-and-backchannel', title: T(pack, 'title'), set: pack.id });
    document.title = T(pack, 'title') + ' · Repair';
    var modes = [{ id: 'live', label: L('1 当场修复', '1 Repair on the spot') }, { id: 'review', label: L('2 回看', '2 Look back') }, { id: 'say', label: L('3 自己说', '3 Say it yourself') }, { id: 'ack', label: L('4 对方的“嗯”', '4 Their “uh-huh”') }];
    function child() { return B.variant === 'child'; }
    var byId = {}; pack.dialogues.forEach(function (d) { byId[d.id] = d; });
    function pool(mode) {
      var list = pack.dialogues.filter(function (d) { return child() ? d.child : !d.child && (mode === 'say' ? d.step3 : !d.step3); });
      if (!list.length) list = pack.dialogues.filter(function (d) { return child() ? d.child : true; });
      if (B.kc) { var k = list.filter(function (d) { return (d.kcs || []).indexOf(B.kc) >= 0; }); if (k.length) list = k; }
      return list;
    }
    var st = {
      mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'live',
      dlg: null, i: 0, shown: [], pending: null, phraseFor: null, ended: false, timerOn: !child(), textOn: false,
      first: {}, resolved: {}, extra: [], reviewIdx: 0, ackIdx: 0, sayState: null, partner: false, paused: false
    };
    function pickDlg() {
      var focus = params.get('focus'), list = pool(st.mode === 'ack' || st.mode === 'review' ? 'live' : st.mode);
      if (st.mode === 'review') list = pack.dialogues.filter(function (d) { return child() ? d.child : !d.step3 && !d.child; });
      if (byId[focus] && list.indexOf(byId[focus]) >= 0) return focus;
      if (st.dlg && list.indexOf(byId[st.dlg]) >= 0) return st.dlg;
      return list.length ? list[0].id : pack.dialogues[0].id;
    }
    st.dlg = pickDlg();
    var ui = KTBlock.chrome(B, { title: T(pack, 'title'), subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); st.dlg = pickDlg(); B.emit('view', { mode: m, dialogue: st.dlg }); restart(); },
      onVariant: function () { st.timerOn = !child(); st.dlg = pickDlg(); restart(); } });
    var bar = h('div', { class: 'kb-bar' });
    var mainCol = h('div', { class: 'rb-main' });
    var side = h('aside', { class: 'rb-side' });
    document.getElementById('app').append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'rb-layout' }, [mainCol, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id, dialogue: st.dlg });

    function dlg() { return byId[st.dlg]; }
    function mid(mo) { return 'm:' + st.dlg + ':' + mo.id; }
    var warned = false, noteEl = null;
    function speak(text, rate) {
      if (!text) return;
      if (!B.speak(text, pack.speech, rate ? { rate: rate } : {}) && !warned) { warned = true; st.textOn = true; if (noteEl) noteEl.textContent = L('这个浏览器不能播放语音，已改为显示文字（显示文字时完成的记为辅助）。', 'This browser cannot play speech, so the text is shown (moments done with the text showing count as assisted).'); }
    }
    function lineAt(i) { return dlg().lines[i]; }
    function phrasesFor(a, mo) {
      if (a === 'confirm' && mo && mo.confirm) return mo.confirm;
      var list = (pack.phrases[a] || []).map(function (p) { return Object.assign({}, p, { text: fill(p.text, mo) }); });
      if (mo && mo.extraPhrases && mo.extraPhrases[a]) list = list.concat(mo.extraPhrases[a]);
      return list;
    }
    function fill(t, mo) { return t.replace('{w}', mo && mo.word || '…').replace('{x}', mo && mo.x || '…'); }
    function okPhrases(mo) {
      var out = [];
      (mo.ok || []).forEach(function (a) { phrasesFor(a, mo).filter(function (p) { return p.ok; }).forEach(function (p) { out.push(p.text); }); });
      return out;
    }

    /* ---- timer ---- */
    var timer = null;
    function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }
    function startTimer(line) {
      stopTimer();
      if (!st.timerOn || !line.mo || st.mode !== 'live') return;
      var ms = 7000 + (line.o || '').length * 90;
      timer = setTimeout(function () { timer = null; if (st.pending === null && lineAt(st.i) === line) { st.timedOut = true; doAction('none', null); } }, ms);
      st.timerEnd = Date.now() + ms; st.timerMs = ms;
      animateTimer();
    }
    function animateTimer() {
      var b = mainCol.querySelector('.timer span');
      if (!b || !timer) return;
      var rem = Math.max(0, st.timerEnd - Date.now());
      b.style.transitionDuration = '0ms'; b.style.width = (100 * rem / st.timerMs) + '%';
      setTimeout(function () { b.style.transitionDuration = rem + 'ms'; b.style.width = '0%'; }, 30);
    }

    /* ---- live dialogue ---- */
    function restart() {
      stopTimer();
      st.i = 0; st.shown = []; st.pending = null; st.phraseFor = null; st.ended = false; st.extra = []; st.sayState = null; st.paused = false;
      if (st.mode === 'live' || st.mode === 'say') advanceTo(0); else render();
    }
    function advanceTo(i) {
      st.i = i; st.pending = null; st.phraseFor = null; st.sayState = null; st.timedOut = false; st.paused = false; st.hintLvl = 0;
      var line = lineAt(i);
      if (!line) { finish(); return; }
      st.shown.push({ line: line });
      render();
      if (line.o && line.mo && st.textOn && st.mode === 'live') B.hint(mid(line.mo), 'text');   // reading the words is help
      if (line.o) { speak(line.o, line.mo && line.mo.rate); startTimer(line); }
    }
    function cont() {
      var line = lineAt(st.i);
      if (line && line.o && line.mo && st.mode === 'live') { doAction('none', null); return; }
      if (line && line.o && line.mo && st.mode === 'say') { recordSayNone(line); }
      advanceTo(st.i + 1);
    }
    function chooseAction(a) {
      var line = lineAt(st.i);
      if (!line || !line.o) return;
      stopTimer();
      if (child()) { var p = phrasesFor(a, line.mo).filter(function (x) { return x.ok; })[0] || phrasesFor(a, line.mo)[0]; doAction(a, p); return; }
      st.phraseFor = a; render();
    }
    function doAction(a, phrase) {
      var line = lineAt(st.i), mo = line.mo;
      stopTimer();
      st.phraseFor = null;
      if (a !== 'none') st.shown.push({ me: phrase ? phrase.text : '', action: a });
      else if (st.timedOut) st.shown.push({ narr: L('（时间到了，你没有出声）', '(Time ran out; you said nothing)') });
      if (!mo) {
        // an ordinary line: no trouble here. A repair move gets a mild reply and is not scored.
        B.emit('select', { dialogue: st.dlg, line: st.i, action: a, ordinary: true });
        if (a !== 'none') { st.shown.push({ reply: T(pack, 'ordinaryReply') || '…', narr2: L('（这一句没有麻烦，不记分）', '(No trouble in this line; not scored)') }); }
        advanceTo(st.i + 1); return;
      }
      var id = mid(mo), isFirst = !st.first[id];
      var ok = mo.type === 'none' ? (a === 'none' || a === 'backchannel') : ((mo.ok || []).indexOf(a) >= 0);
      var phraseOk = !phrase || phrase.ok !== false;
      if (isFirst) {
        st.first[id] = { action: a, phrase: phrase ? phrase.text : null, phraseOk: phraseOk, timed: st.timerOn, timedOut: !!st.timedOut };
        B.attempt(id, { correct: ok && phraseOk, response: { action: a, phrase: phrase ? phrase.text : null, type: mo.type, timed: st.timerOn, timedOut: !!st.timedOut, textShown: st.textOn } });
      } else {
        B.attempt(id, { correct: ok && phraseOk, response: { action: a, phrase: phrase ? phrase.text : null, type: mo.type } });
      }
      if (mo.type === 'none') {
        if (a !== 'none' && a !== 'backchannel') st.shown.push({ reply: mo.over || T(pack, 'ordinaryReply'), why: T(mo, 'why') });
        st.resolved[id] = true;
        advanceTo(st.i + 1); return;
      }
      if (ok) {
        st.resolved[id] = true;
        var rep = (phrase && phrase.reply) || (mo.reply && mo.reply[a]) || (a === 'repeat' || a === 'slow' ? line.o : '');
        if (phrase && phrase.ok === false && T(phrase, 'why')) st.shown.push({ narr: T(phrase, 'why') });
        if (rep) { st.shown.push({ reply: rep }); speak(rep, a === 'slow' ? 0.65 : null); }
        advanceTo(st.i + 1); return;
      }
      if (a === 'none' || a === 'backchannel') {
        // pretending to understand: the talk goes on and the task goes wrong later
        advanceTo(st.i + 1); return;
      }
      // the wrong kind of repair: the other person answers it, but the trouble is still there; stay on this line
      var stay = (mo.stay && mo.stay[a]) || (a === 'repeat' || a === 'slow' ? line.o : T(pack, 'ordinaryReply'));
      st.shown.push({ reply: stay, narr2: L('（问题还在。可以换一种修复。）', '(The trouble is still there. Try another move.)') });
      speak(stay, a === 'slow' ? 0.65 : null);
      render();
    }
    function finish() {
      st.ended = true; stopTimer();
      var ms = dlg().lines.filter(function (l) { return l.mo; }).map(function (l) { return l.mo; });
      var missed = ms.filter(function (m) { return m.type !== 'none' && !st.resolved[mid(m)]; });
      B.emit('complete', { dialogue: st.dlg, moments: ms.length, missed: missed.map(function (m) { return m.id; }), mode: st.mode });
      render();
    }

    /* ---- rendering helpers ---- */
    function roleCard() {
      var r = dlg().role;
      return h('div', { class: 'kb-card role' }, [h('div', {}, [h('b', { text: L('我是', 'I am') }), T(r, 'me')]), h('div', {}, [h('b', { text: L('对方', 'The other person') }), T(r, 'other')]), h('div', {}, [h('b', { text: L('我要做到', 'What I want') }), T(r, 'goal')])]);
    }
    function otherBubble(text, isCur, idx) {
      var showTxt = st.textOn || !isCur || st.mode === 'review';
      return h('div', { class: 'bub other' + (isCur ? ' cur' : '') }, [h('span', { class: 'who', text: T(dlg().role, 'otherShort') || L('对方', 'Them') }),
        showTxt ? h('span', { class: 'tl', lang: pack.lang, text: text }) : h('span', { class: 'masked', text: L('（只听声音）', '(audio only)') }),
        h('button', { 'aria-label': L('再听', 'Listen again'), onclick: function () { var ln = lineAt(st.i); speak(text, ln && ln.mo && ln.o === text ? ln.mo.rate : null); B.emit('select', { dialogue: st.dlg, replay: idx }); } }, '▶'),
        isCur && !showTxt ? h('button', { onclick: function () { st.textOn = true; var ln = lineAt(st.i); if (ln && ln.mo) B.hint(mid(ln.mo), 'text'); render(); } }, L('显示文字（算辅助）', 'Show text (counts as help)')) : null]);
    }
    function renderChat() {
      var chat = h('div', { class: 'kb-card chat', 'aria-live': 'polite' });
      st.shown.forEach(function (e, k) {
        var isCur = k === st.shown.length - 1 && e.line && e.line.o && !st.ended;
        if (e.line) {
          if (e.line.n) chat.append(h('div', { class: 'bub narr', text: T(e.line, 'n') }));
          if (e.line.m) chat.append(h('div', { class: 'bub me' }, [h('span', { class: 'who', text: L('我', 'Me') }), h('span', { class: 'tl', lang: pack.lang, text: e.line.m })]));
          if (e.line.o) chat.append(otherBubble(e.line.o, isCur, k));
        }
        if (e.me !== undefined) chat.append(h('div', { class: 'bub me' }, [h('span', { class: 'who', text: L('我', 'Me') + ' · ' + L(act(e.action).zh, act(e.action).en) }), e.me ? h('span', { class: 'tl', lang: pack.lang, text: e.me }) : null]));
        if (e.own !== undefined) chat.append(h('div', { class: 'bub me' }, [h('span', { class: 'who', text: L('我（自己说的）', 'Me (my own words)') }), h('span', { class: 'tl', lang: pack.lang, text: e.own || L('（只说了，没打字）', '(said aloud, not typed)') })]));
        if (e.reply) chat.append(h('div', { class: 'bub other' }, [h('span', { class: 'who', text: T(dlg().role, 'otherShort') || L('对方', 'Them') }), h('span', { class: 'tl', lang: pack.lang, text: e.reply })]));
        if (e.narr) chat.append(h('div', { class: 'bub narr', text: e.narr }));
        if (e.narr2) chat.append(h('div', { class: 'bub narr', text: e.narr2 }));
        if (e.why) chat.append(h('div', { class: 'bub narr', text: e.why }));
      });
      return chat;
    }
    function actionRow(line) {
      var list = child() ? ACTIONS.filter(function (a) { return CHILD_ACTIONS.indexOf(a.id) >= 0; }) : ACTIONS;
      var row = h('div', { class: 'actions', role: 'group', 'aria-label': L('修复动作', 'Repair moves') }, list.map(function (a, k) {
        return h('button', { onclick: function () { chooseAction(a.id); } }, [child() ? h('span', { class: 'ic', text: a.ic }) : h('span', { class: 'k', text: String(k + 1) }), L(a.zh, a.en)]);
      }));
      row.append(h('button', { class: 'go', onclick: cont }, [child() ? h('span', { class: 'ic', text: '➡️' }) : h('span', { class: 'k', text: L('回车', 'Enter') }), L('继续听，不出声', 'Keep listening, say nothing')]));
      return row;
    }
    function phraseChoice(a, line) {
      var list = KTBlock.shuffle(phrasesFor(a, line.mo));
      return h('div', { class: 'kb-card' }, [h('p', { class: 'kb-prompt', text: L('你选了“' + act(a).zh + '”。怎么说？', 'You chose “' + act(a).en + '”. How do you say it?') }),
        h('div', { class: 'phr' }, list.map(function (p) { return h('button', { lang: pack.lang, onclick: function () { doAction(a, p); } }, p.text); })),
        h('div', { class: 'tools' }, [h('button', { class: 'kb-btn', onclick: function () { st.phraseFor = null; render(); startTimer(line); } }, L('换一个动作', 'Choose another move'))])]);
    }
    function endCard() {
      var ms = dlg().lines.filter(function (l) { return l.mo; }).map(function (l) { return l.mo; });
      var missed = ms.filter(function (m) { return m.type !== 'none' && !st.resolved[mid(m)]; });
      var over = ms.filter(function (m) { return m.type === 'none' && st.first[mid(m)] && ['none', 'backchannel'].indexOf(st.first[mid(m)].action) < 0; });
      return h('div', { class: 'kb-card endcard' + (missed.length ? ' fail' : '') }, [
        h('p', { class: 'kb-prompt', text: missed.length ? L('对话结束，但有事情出了错：', 'The conversation is over, but something went wrong:') : L('对话结束，事情都办对了。', 'The conversation is over and everything worked out.') }),

            h('ol', {}, ms.map(function (l) { return h('li', {}, [h('span', { lang: pack.lang, text: l.o }), h('div', { class: 'kb-note', text: '→ ' + (T(l.mo, 'partner') || typeName(l.mo.type)) + L('　☐ 用了哪类修复　☐ 得体　☐ 搭档提示过', '  ☐ kind of repair used  ☐ polite  ☐ partner hinted') })]); }))]) : null]));

    if (st.mode === 'live' || st.mode === 'say') restart(); else render();
  }
})();
