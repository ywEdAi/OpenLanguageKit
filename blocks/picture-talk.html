<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picture Talk</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .pt-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .pt-stage { position: sticky; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; z-index: 3; }
  @media (max-width: 860px) { .pt-layout { grid-template-columns: 1fr; } .pt-stage { top: 0; padding: 4px; box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .35); } }
  .pt-stage svg { display: block; width: 100%; height: auto; border-radius: 8px; touch-action: manipulation; }
  .pt-cap { margin: 6px 4px 2px; font-size: .8rem; color: var(--muted); }
  .pt-hit { fill: transparent; stroke: transparent; stroke-width: 3; cursor: pointer; outline: none; }
  .pt-hit:hover, .pt-hit:focus-visible { stroke: var(--accent); stroke-dasharray: 7 6; }
  .pt-hit.sel { stroke: var(--accent); fill: rgba(61, 79, 224, .12); stroke-dasharray: none; }
  .pt-hit.ok { stroke: #2e8b57; fill: rgba(46, 139, 87, .14); stroke-dasharray: none; }
  .pt-hit.ref { stroke: var(--warn); stroke-dasharray: 3 5; }
  .pt-hit.bad { stroke: var(--bad); fill: rgba(161, 61, 70, .14); animation: pt-shake .3s; }
  .pt-hit.flash { animation: pt-flash .7s 3; }
  .pt-hit.off { pointer-events: none; }
  @keyframes pt-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes pt-flash { 50% { stroke: var(--warn); fill: rgba(167, 91, 19, .22); } }
  svg.pt-dimming [id^="el-"] { filter: grayscale(1); opacity: .34; transition: opacity .25s, filter .25s; }
  svg.pt-dimming [id^="el-"].lit { filter: none; opacity: 1; }
  .pt-ghost use { opacity: .5; }
  .pt-ghost ellipse { fill: none; stroke: var(--bad); stroke-width: 2.5; stroke-dasharray: 6 5; }
  .pt-ghost text { font: 600 15px var(--font); fill: var(--bad); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .pt-panel { display: grid; gap: 12px; }
  .pt-sent { font-size: 1.25rem; line-height: 1.35; margin: 4px 0; }
  [data-variant="child"] .pt-sent { font-size: 1.5rem; }
  .pt-read { color: var(--muted); font-size: .9rem; }
  .pt-gloss { color: var(--muted); font-size: .92rem; }
  .pt-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  [data-variant="child"] .kb-btn { padding: 10px 18px; font-size: 1.05rem; }
  .pt-steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .pt-steps button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: .9rem; }
  .pt-steps button[aria-current="step"] { background: var(--accent-soft); border-color: var(--accent); }
  .pt-steps button:disabled { opacity: .45; cursor: default; }
  textarea.pt-draft { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); resize: vertical; }
  .pt-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); margin-top: 8px; }
  .pt-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .pt-card > button.pick { all: unset; cursor: pointer; display: block; width: 100%; }
  .pt-card > button.pick:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .pt-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pt-chip { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .pt-chip.good { background: var(--accent-soft); border-color: transparent; }
  .pt-chip.bad { background: var(--bad-soft); border-color: transparent; }
  .pt-chip.warn { background: var(--warn-soft); border-color: transparent; border-radius: 8px; }
  .pt-cover { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .pt-cover i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .pt-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: .9rem; }
  .pt-list li::before { content: '○ '; color: var(--muted); }
  .pt-list li.done::before { content: '✓ '; color: #2e8b57; }
  .pt-tiles { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; padding: 6px; border-radius: 10px; }
  .pt-tiles.answer { border: 2px dashed var(--line); background: var(--bg); align-items: center; }
  .pt-tile { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; font-size: 1.1rem; box-shadow: 0 2px 0 var(--line); }
  [data-variant="child"] .pt-tile { font-size: 1.35rem; padding: 10px 16px; }
  .pt-tile.fixed { background: var(--warn-soft); }
  .pt-end { color: var(--muted); font-size: 1.1rem; align-self: center; }
  .pt-cats { display: grid; gap: 6px; margin-top: 10px; }
  .pt-cats button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .pt-cats button.right { background: var(--accent-soft); border-color: var(--accent); }
  .pt-cats button.wrongpick { background: var(--bad-soft); border-color: var(--bad); }
  .pt-q { display: grid; gap: 6px; margin-top: 8px; }
  .pt-q button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .pt-q button.done { background: var(--accent-soft); }
  .pt-answer { border-left: 4px solid var(--accent); }
  .pt-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .pt-two { grid-template-columns: 1fr; } }
  .pt-two h4 { margin: 0 0 4px; font-size: .85rem; color: var(--muted); }
  .pt-two p { margin: 2px 0; }
  .speak-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: .9rem; }
  h3.pt-h { margin: 0 0 6px; font-size: 1rem; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var h = KTBlock.h, shuffle = KTBlock.shuffle, L = KTBlock.L, T = KTBlock.t;
  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'picture-en';
  var entry = KT_REGISTRY.packs[setId] || {};
  var app = document.getElementById('app');
  if (!entry.file) { app.textContent = L('未知的数据包：', 'Unknown data pack: ') + setId; return; }
  if (entry.block !== 'picture-talk') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在看图说话里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened in Picture Talk.'); return; }
  var s = document.createElement('script');
  s.src = entry.file;
  s.onload = function () { start(KT_DATA[setId]); };
  s.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + entry.file; };
  document.head.appendChild(s);

  var SVGNS = 'http://www.w3.org/2000/svg';
  var PREP_ZH = { on: '在…上面', under: '在…下面', 'in': '在…里面', next_to: '在…旁边' };
  var PREP_EN = { on: 'on', under: 'under', 'in': 'in', next_to: 'next to' };
  function svgEl(tag, attrs) { var e = document.createElementNS(SVGNS, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
  function esc(x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function norm(x) { return x.toLowerCase().replace(/[\s.,!?;:。，！？、；：]/g, ''); }

  function start(pack) {
    var scene = KT_SCENES[pack.scene];
    var title = T(pack, 'title');
    // a gloss only helps in a language other than the one being taught: an English pack shows none in English mode
    var showGloss = !(KTBlock.lang === 'en' && pack.lang === 'en');
    var B = KTBlock.init({ id: 'picture-talk', primitive: 'prim:picture-describe', title: title, set: pack.id });
    document.title = title + ' · Picture Talk';
    var isCJK = pack.parse.order === 'ref-prep';
    var modes = [{ id: 'point', label: L('指认', 'Point') }, { id: 'describe', label: L('描述', 'Describe') }, { id: 'judge', label: L('判断', 'Judge') }, { id: 'ask', label: L('提问', 'Ask') }];
    var st = { mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'point', hideText: false, showReading: true };
    var P, D, J, A;   // per-mode state
    function child() { return B.variant === 'child'; }
    function active() { return child() ? scene.childEls.slice() : Object.keys(scene.els); }
    function isActive(el) { return active().indexOf(el) >= 0; }
    function nameOf(el) { return pack.els[el].name; }

    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); render(); },
      onVariant: function () { resetAll(); render(); } });

    /* ---- the picture: one stage for every mode ---- */
    var stage = h('div', { class: 'pt-stage' });
    stage.innerHTML = scene.svg;                       // authored in the data pack, not learner input
    var svg = stage.querySelector('svg');
    var svgTitle = svg.querySelector('title'), svgTitleText = T(scene, 'svgTitle');
    if (svgTitle && svgTitleText) svgTitle.textContent = svgTitleText;   // scene.svgTitleEn in English mode; the authored <title> otherwise
    var ghostLayer = svgEl('g', { 'class': 'pt-ghost' });
    var hitLayer = svgEl('g', {});
    svg.append(ghostLayer, hitLayer);
    var hits = {};
    Object.keys(scene.els).sort(function (a, b) { var x = scene.els[a].hit, y = scene.els[b].hit; return y[2] * y[3] - x[2] * x[3]; }).forEach(function (el, i) {
      var b = scene.els[el].hit;
      var r = svgEl('rect', { x: b[0], y: b[1], width: b[2], height: b[3], rx: 14, 'class': 'pt-hit', tabindex: 0, role: 'button', 'aria-label': L('图中区域 ' + (i + 1), 'Picture area ' + (i + 1)) });
      r.addEventListener('click', function () { tap(el); });
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(el); } });
      hits[el] = r; hitLayer.appendChild(r);
    });
    stage.append(h('p', { class: 'pt-cap', text: L('点图上的人或东西。', 'Tap a person or thing in the picture.') }), h('details', { class: 'pt-cap' }, [h('summary', { text: L('图的文字说明（看不清图时用；用了它，任务就变成“从清单到描述”）', 'Text description of the picture (for when you cannot see it well; using it turns the task into "from a list to a description")') }), T(scene, 'alt')]));
    var panel = h('section', { class: 'pt-panel' });
    var bar = h('div', { class: 'kb-bar' });
    var main = h('main', { class: 'kb-main' }, [bar, h('div', { class: 'pt-layout' }, [stage, panel])]);
    app.append(ui.header, main, ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    function clearMarks() {
      Object.keys(hits).forEach(function (el) { hits[el].setAttribute('class', 'pt-hit' + (isActive(el) ? '' : ' off')); });
      ghostLayer.innerHTML = '';
    }
    function mark(el, cls) { if (hits[el]) hits[el].classList.add(cls); }
    function flashEl(el) { var r = hits[el]; r.classList.remove('flash'); void r.getBBox(); r.classList.add('flash'); }
    function setLit(list) {
      svg.classList.toggle('pt-dimming', !!list);
      Object.keys(scene.els).forEach(function (el) { var g = svg.querySelector('#el-' + el); if (g) g.classList.toggle('lit', !!list && list.indexOf(el) >= 0); });
    }
    /** "Where it would be if the sentence were true": a translucent copy next to the real thing. */
    function showGhost(el, prep, ref) {
      var e = scene.els[el].hit, r = scene.els[ref], a = (r.anchor && r.anchor[prep]) || [r.hit[0] + r.hit[2] / 2, r.hit[1] + r.hit[3] / 2 + e[3] / 2];
      var dx = a[0] - (e[0] + e[2] / 2), dy = a[1] - (e[1] + e[3]);
      ghostLayer.innerHTML = '';
      var u = svgEl('use', { href: '#el-' + el, transform: 'translate(' + dx + ' ' + dy + ')' });
      var ring = svgEl('ellipse', { cx: a[0], cy: a[1] - e[3] / 2, rx: e[2] / 2 + 4, ry: e[3] / 2 + 4 });
      var label = svgEl('text', { x: a[0], y: Math.max(16, a[1] - e[3] - 10), 'text-anchor': 'middle' });
      label.textContent = L('按这句话，它在这儿', 'This sentence puts it here');
      ghostLayer.append(u, ring, label);
      mark(ref, 'ref');
    }
    function say(text) { if (B.speak(text, pack.speech) === false) note(L('这个浏览器不能播放语音。', 'This browser cannot play speech.')); }
    function note(msg) { var f = panel.querySelector('.kb-feedback'); if (f) f.textContent = msg; }
    function speakBtn(text, label) { return h('button', { class: 'speak-btn', type: 'button', 'aria-label': L('听', 'Listen'), onclick: function () { say(text); } }, label || L('▶ 听', '▶ Listen')); }
    /** A target-language sentence: text, optional reading line, optional gloss. */
    function sentence(o, opts) {
      opts = opts || {};
      return h('div', {}, [
        opts.hideText ? h('p', { class: 'pt-sent kb-note', text: L('（只听，不看字）', '(listen only, no text)') }) : h('p', { class: 'pt-sent', lang: pack.lang }, [o.t, o.src === 'kc' ? h('span', { class: 'kb-note', title: T(pack, 'sourceNote') }, ' ★') : null]),
        !opts.hideText && o.r && st.showReading ? h('p', { class: 'pt-read', text: o.r }) : null,
        showGloss && opts.gloss && o.g ? h('p', { class: 'pt-gloss', text: o.g }) : null
      ]);
    }

    /* ---- deterministic checks over the pack's controlled vocabulary ---- */
    function has(re, text) { return new RegExp(re, 'i').test(text); }
    function mentions(el, text) {
      return pack.els[el].names.some(function (n) { return isCJK ? text.indexOf(n) >= 0 : has('\\b' + esc(n) + '\\b', text); });
    }
    function claims(el, text) {
      var out = [];
      Object.keys(scene.els).forEach(function (ref) {
        if (ref === el) return;
        pack.els[ref].names.forEach(function (n) {
          Object.keys(pack.parse.preps).forEach(function (prep) {
            pack.parse.preps[prep].some(function (w) {
              var re = isCJK ? esc(n) + esc(w) : '\\b' + esc(w) + '\\s+' + pack.parse.det + '(?:\\w+\\s+)?' + esc(n) + '\\b';
              if (!has(re, text)) return false;
              if (!out.some(function (c) { return c.ref === ref; })) out.push({ prep: prep, ref: ref });
              return true;
            });
          });
        });
      });
      return out;
    }
    function relation(el, ref) {
      var r = (scene.els[el].rel || []).find(function (x) { return x.ref === ref; });
      if (r) return r.ok;
      var back = (scene.els[ref].rel || []).find(function (x) { return x.ref === el; });
      return back && back.ok.indexOf('next_to') >= 0 ? ['next_to'] : null;
    }
    function numberIn(text) {
      var found = null;
      Object.keys(pack.parse.numbers).forEach(function (w) {
        var re = isCJK ? esc(w) + pack.parse.numberUnit : '\\b' + esc(w) + '\\b';
        if (has(re, text) && (found === null || pack.parse.numbers[w] > found)) found = pack.parse.numbers[w];
      });
      return found;
    }
    function analyse(text, el) {
      var r = { name: el ? mentions(el, text) : null, pos: null, num: null, traps: [], struct: null };
      var n = numberIn(text);
      r.hasNum = n !== null; r.hasPos = has(pack.isPosition, text); r.hasAct = has(pack.isAction, text);
      r.hasInferMark = has(pack.parse.inferMark, text);
      (pack.structures || []).some(function (s) { if (has(s.re, text)) { r.struct = s; return true; } return false; });
      pack.traps.forEach(function (t) { if (has(t.re, text)) r.traps.push(T(t, 'msg')); });
      if (el) {
        var cs = claims(el, text), known = cs.map(function (c) { return { c: c, ok: relation(el, c.ref) }; }).filter(function (x) { return x.ok; });
        var bad = known.find(function (x) { return x.ok.indexOf(x.c.prep) < 0; });
        if (bad) r.pos = { status: 'mismatch', prep: bad.c.prep, ref: bad.c.ref };
        else if (known.length) r.pos = { status: 'ok' };
        else if (cs.length || r.hasPos) r.pos = { status: 'unknown' };
        if (n !== null && (n > 1 || scene.els[el].count > 1)) r.num = { status: n === scene.els[el].count ? 'ok' : 'mismatch', n: n };
      }
      return r;
    }
    function factHolds(f) {
      var e = scene.els[f.el];
      if (!e) return false;
      if (f.type === 'count') return e.count === f.n;
      if (f.type === 'doing') return e.act === f.act;
      var ok = relation(f.el, f.ref), holds = !!ok && ok.indexOf(f.prep) >= 0;
      return f.type === 'where' ? holds : holds === f.value;
    }
    function factText(f) {
      if (f.type === 'count') return nameOf(f.el) + ' × ' + f.n;
      if (f.type === 'doing') return nameOf(f.el) + L(' · 动作：', ' · action: ') + f.act;
      var t = nameOf(f.el) + ' · ' + L(PREP_ZH[f.prep], PREP_EN[f.prep]) + ' · ' + nameOf(f.ref);
      return f.type === 'exists' && !f.value ? L('清单里没有这一条：', 'Not in the list: ') + t : t;
    }

    /* ---- word tiles: build a sentence, checked against the accepted wordings ---- */
    function tileBuilder(o) {
      var correctTiles = o.tiles.filter(function (t) { return !/^[?？.。!！]$/.test(t); });
      var bank = shuffle(correctTiles.concat(o.extra || [])).map(function (t, i) { return { t: t, i: i }; });
      var ans = [], fixed = 0, done = false;
      var rowA = h('div', { class: 'pt-tiles answer', 'aria-label': L('你的句子', 'Your sentence') }), rowB = h('div', { class: 'pt-tiles', 'aria-label': L('词卡', 'Word tiles') });
      var fb = h('div', { class: 'kb-feedback', hidden: true, role: 'status' });
      var root = h('div', {}, [rowA, rowB]);
      function joined() { return ans.map(function (x) { return x.t; }).join(isCJK ? '' : ' '); }
      function draw() {
        rowA.innerHTML = ''; rowB.innerHTML = '';
        ans.forEach(function (x, k) {
          rowA.append(h('button', { class: 'pt-tile' + (k < fixed ? ' fixed' : ''), type: 'button', lang: pack.lang, disabled: done || k < fixed,
            onclick: function () { ans.splice(k, 1); B.emit('drop', { item: o.id, tile: x.t, to: 'bank' }); draw(); } }, x.t));
        });
        rowA.append(h('span', { class: 'pt-end', text: o.end || '' }));
        bank.filter(function (x) { return ans.indexOf(x) < 0; }).forEach(function (x) {
          rowB.append(h('button', { class: 'pt-tile', type: 'button', lang: pack.lang, disabled: done,
            onclick: function () { ans.push(x); B.emit('drop', { item: o.id, tile: x.t, to: 'sentence' }); draw(); } }, x.t));
        });
      }
      function finish(ok) { done = true; draw(); buttons.hidden = true; o.onDone(ok, joined()); }
      function check() {
        if (!ans.length) return;
        var text = joined(), ok = o.accept.some(function (a) { return norm(a) === norm(text); });
        B.attempt(o.id, { correct: ok, response: text });
        fb.hidden = false;
        if (ok) { fb.className = 'kb-feedback'; fb.textContent = L('对上了。', 'That matches.'); finish(true); return; }
        fb.className = 'kb-feedback bad';
        var a = analyse(text, o.el);
        var msg = a.traps[0] || (a.pos && a.pos.status === 'mismatch' ? L('句子通顺，但位置和图不一致：看图上半透明的副本。', 'The sentence reads well, but the position does not match the picture: look at the see-through copy in the picture.') : null) || o.tip || L('用词或顺序还不对，再排一次。有的词卡是多余的。', 'The words or their order are not right yet. Arrange them again. Some tiles are extra.');
        fb.textContent = msg;
        if (a.pos && a.pos.status === 'mismatch') showGhost(o.el, a.pos.prep, a.pos.ref);
      }
      var buttons = h('div', { class: 'pt-row' }, [
        h('button', { class: 'kb-btn primary', type: 'button', onclick: check }, L('检查', 'Check')),
        h('button', { class: 'kb-btn', type: 'button', onclick: function () {
          B.hint(o.id, fixed + 1);
          if (fixed >= correctTiles.length) return;
          fixed += 1;                                   // the first `fixed` tiles are placed for the learner; the rest go back to the bank
          var pool = bank.slice();
          ans = correctTiles.slice(0, fixed).map(function (t) { var k = pool.findIndex(function (x) { return x.t === t; }); return pool.splice(k, 1)[0]; });
          draw();
        } }, L('提示：放好下一张', 'Hint: place the next tile')),
        h('button', { class: 'kb-btn', type: 'button', onclick: function () {
          B.reveal(o.id); fixed = correctTiles.length;
          var pool = bank.slice(); ans = correctTiles.map(function (t) { var k = pool.findIndex(function (x) { return x.t === t; }); return pool.splice(k, 1)[0]; });
          fb.hidden = false; fb.className = 'kb-feedback warn'; fb.textContent = L('答案已摆好（记为看过答案）。', 'The answer is laid out (recorded as answer shown).'); finish(false);
        } }, L('看答案', 'Show the answer'))
      ]);
      root.append(buttons, fb);
      draw();
      return root;
    }

    /* ================= 指认 ================= */
    function resetPoint() {
      var els = active();

              } }, L(o[0], o[2]));                       // the evidence keeps o[0] as the response in both languages
            })));
        }
        panel.append(body, coverCard);
        return;
      }
      if (!finished) {
        panel.append(h('div', { class: 'kb-card' }, [
          h('p', { class: 'kb-prompt', text: L('灰色的是还没说到的。点一个来补说（还要补 ' + (target - D.sup.done.length) + ' 个）。', 'The grey ones have not been mentioned yet. Tap one to add it (' + (target - D.sup.done.length) + ' more to go).') }),
          h('div', { class: 'pt-row' }, [h('button', { class: 'kb-btn', type: 'button', onclick: function () { var el = shuffle(left)[0]; B.hint('supplement', 2); flashEl(el); } }, L('找不到？闪一个（算提示）', 'Cannot find one? Flash one (counts as a hint)'))])
        ]), coverCard);
        return;
      }
      if (!D.sup.compared) {
        panel.append(h('div', { class: 'kb-card' }, [
          h('p', { class: 'kb-prompt', text: left.length ? L('补说完成。图上还有 ' + left.length + ' 样没说到，不用都说完。', 'Additions done. ' + left.length + (left.length === 1 ? ' thing in the picture is' : ' things in the picture are') + ' still unmentioned; you do not have to cover them all.') : L('图上的每一样都说到了。', 'Everything in the picture has been mentioned.') }),
          h('div', { class: 'pt-row' }, [h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { D.sup.compared = true; B.emit('compare', { item: 'model-description', firstDraft: D.first, spoken: D.path === 'speak' }); render(); } }, L('和范例描述对照', 'Compare with the model description'))])
        ]), coverCard);
        return;
      }
      var models = pack.modelOrder.filter(isActive).map(function (el) { return pack.els[el].models[0]; });
      panel.append(h('div', { class: 'kb-card' }, [
        h('h3', { class: 'pt-h', text: L('对照：你的首稿和一份范例', 'Compare: your first draft and a model') }),
        h('div', { class: 'pt-two' }, [
          h('div', {}, [h('h4', { text: L('你的首稿（锁定）', 'Your first draft (locked)') })].concat(D.path === 'speak' ? [h('p', { class: 'kb-note', text: L('口头说的，页面没有记录。', 'Said aloud; the page has no record of it.') })] : D.first.map(function (t) { return h('p', { lang: pack.lang, text: t }); }))),
          h('div', {}, [h('h4', { text: L('范例（只是一种说法）', 'Model (just one way to say it)') })].concat(models.map(function (m) { return h('p', { lang: pack.lang }, [m.t, m.src === 'kc' ? ' ★' : '']); })))
        ]),
        h('div', { class: 'pt-row' }, [h('button', { class: 'speak-btn', type: 'button', onclick: function () { B.speakSequence(models.map(function (m) { return { text: m.t, pause: 250 }; }), pack.speech); } }, L('▶ 听范例', '▶ Listen to the model')),
          D.path === 'write' ? h('button', { class: 'kb-btn', type: 'button', onclick: function () { D.step = 2; D.sel = 0; render(); } }, L('回去改我的句子', 'Go back and edit my sentences')) : null]),
        h('p', { class: 'kb-note', text: T(pack, 'sourceNote') + L(' 范例从左到右、先物后人地说。挑一处你想学的差别，改进自己的句子；不用照抄。', ' The model goes from left to right, things first and then people. Pick one difference you want to learn from and improve your own sentences; there is no need to copy.') }),
        h('p', { class: 'kb-note', text: T(pack, 'partner') })
      ]), coverCard);
    }

    /* ================= 判断 ================= */
    function resetJudge() {
      var items = pack.judge.filter(function (j) { return isActive(j.el) && (!child() || j.child); });
      J = { queue: shuffle(items), i: 0, picked: null };
    }
    function renderJudge() {
      var it = J.queue[J.i];
      if (!it) {
        panel.append(h('div', { class: 'kb-card' }, [h('h3', { class: 'pt-h', text: L('判断完了', 'Judging done') }),
          h('p', { class: 'kb-note', text: L('看图说话不是说得越多越好：位置、数量要对得上，状态和动作要分开，图上看不见的要标成推断。', 'Describing a picture is not about saying as much as possible: positions and numbers must match, states and actions must be kept apart, and what cannot be seen in the picture must be marked as an inference.') }),
          h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { resetJudge(); clearMarks(); render(); } }, L('再来一轮', 'Another round'))]));
        return;
      }
      var cats = child() ? [{ id: 'ok', label: L('对', 'Right') }, { id: 'no', label: L('不对', 'Wrong') }] : pack.judgeCats;
      var truth = child() ? (it.v === 'ok' ? 'ok' : 'no') : it.v;
      var done = J.picked !== null && J.resolved;
      var card = h('div', { class: 'kb-card' }, [
        h('p', { class: 'kb-prompt', text: L('有人这样描述这幅图。对着图看，这句话怎么样？', 'Someone described the picture like this. Check it against the picture: how is this sentence?') }),
        sentence(it), h('div', { class: 'pt-row' }, [speakBtn(it.t)]),
        h('div', { class: 'pt-cats' }, cats.map(function (c) {
          return h('button', { type: 'button', disabled: done, class: done && c.id === truth ? 'right' : J.picked === c.id && c.id !== truth ? 'wrongpick' : '', onclick: function () {
            var ok = c.id === truth;
            B.attempt('judge:' + it.id, { correct: ok, response: c.id });
            J.picked = c.id; J.resolved = true;
            render();
          } }, T(c, 'label'));
        }))
      ]);
      if (done) {
        card.append(h('div', { class: 'kb-feedback ' + (J.picked === truth ? '' : 'bad'), role: 'status' }, [(J.picked === truth ? L('判断对了。', 'You judged it right. ') : L('没判断对。', 'You did not judge it right. ')) + T(it, 'why')]),
          h('div', { class: 'pt-row', hidden: !it.fix }, [h('span', { class: 'kb-note', text: L('可以这样说：', 'You could say:') }), h('span', { lang: pack.lang, text: it.fix || '' }), it.fix ? speakBtn(it.fix) : null]),
          h('div', { class: 'pt-row' }, [h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { J.i += 1; J.picked = null; J.resolved = false; clearMarks(); render(); } }, L('下一句', 'Next sentence'))]));
        mark(it.el, it.v === 'ok' ? 'ok' : 'sel');
        if (it.claim) showGhost(it.el, it.claim.prep, it.claim.ref);
      }
      card.append(h('p', { class: 'kb-note', text: L('第 ' + (J.i + 1) + ' / ' + J.queue.length + ' 句。', 'Sentence ' + (J.i + 1) + ' of ' + J.queue.length + '.') }));
      panel.append(card);
    }

    /* ================= 提问 ================= */
    function resetAsk() { A = { el: null, cur: null, answered: null, done: {} }; }
    function questions() {
      return pack.questions.filter(function (q) {
        if (!factHolds(q.fact)) { if (window.console) console.warn('picture-talk: question dropped, fact does not match the scene', q.id); return false; }
        return isActive(q.el) && (!child() || q.child);
      });
    }
    function renderAsk() {
      var qs = questions();
      if (A.cur) {
        var q = A.cur, text = q.k.filter(function (t) { return !/^[?？]$/.test(t); }).join(isCJK ? '' : ' ') + (isCJK ? '？' : '?');
        mark(q.el, 'sel');
        var card = h('div', { class: 'kb-card' }, [h('p', { class: 'kb-prompt', text: L('你想：' + q.intent + '。把问句排出来。', 'Your aim: ' + T(q, 'intent') + '. Arrange the tiles into the question.') })]);
        if (!A.answered) {
          card.append(tileBuilder({ id: 'ask:' + q.id, el: q.el, tiles: q.k, accept: [text], end: isCJK ? '？' : '?', tip: T(pack, 'askTip'),
            onDone: function (ok) { A.answered = { ok: ok }; A.done[q.id] = true; B.emit('explain', { item: 'ask:' + q.id, answerFrom: 'scene-facts', fact: q.fact }); render(); say(text); } }));
        } else {
          var ref = q.fact.ref; if (ref) mark(ref, 'ref');
          card.append(h('div', { class: 'pt-row' }, [h('span', { class: 'pt-sent', lang: pack.lang, text: text }), speakBtn(text)]),
            h('p', { class: 'pt-read', hidden: !(q.r && st.showReading), text: q.r || '' }),
            h('div', { class: 'kb-card pt-answer', style: 'margin-top:10px' }, [
              h('h4', { class: 'kb-note', style: 'margin:0', text: L('图的回答', 'The picture\'s answer') }),
              sentence({ t: q.a, r: q.ar, g: q.ag }, { gloss: true }), speakBtn(q.a),
              h('p', { class: 'kb-note', text: L('依据是图的元素清单里的一条：' + factText(q.fact) + '。页面只会回答清单里有的事。', 'Based on one entry in the picture\'s element list: ' + factText(q.fact) + '. The page only answers what is in the list.') })
            ]),
            h('div', { class: 'pt-row' }, [h('button', { class: 'kb-btn primary', type: 'button', onclick: function () { A.cur = null; A.answered = null; clearMarks(); render(); } }, L('再问一个', 'Ask another'))]));
        }
        panel.append(card);
        return;
      }
      var shown = A.el ? qs.filter(function (q) { return q.el === A.el; }) : qs;
      if (A.el) mark(A.el, 'sel');
      panel.append(h('div', { class: 'kb-card' }, [
        h('p', { class: 'kb-prompt', text: L('对着图提问。点图上的一样东西，看看能问它什么；或者直接选。', 'Ask questions about the picture. Tap something in the picture to see what you can ask about it, or just pick a question.') }),
        A.el && !shown.length ? h('p', { class: 'kb-note', text: L('这一样暂时没有准备好的问题。换一个点点看。', 'There are no prepared questions for this one yet. Try tapping another.') }) : null,
        h('div', { class: 'pt-q' }, shown.map(function (q) {
          return h('button', { type: 'button', class: A.done[q.id] ? 'done' : '', onclick: function () { A.cur = q; A.answered = null; B.emit('select', { item: 'ask:' + q.id, el: q.el }); clearMarks(); render(); } }, (A.done[q.id] ? '✓ ' : '') + T(q, 'intent'));
        })),
        A.el ? h('div', { class: 'pt-row' }, [h('button', { class: 'kb-btn', type: 'button', onclick: function () { A.el = null; clearMarks(); render(); } }, L('看全部问题', 'See all questions'))]) : null,
        h('p', { class: 'kb-note', text: T(pack, 'partner') })
      ]));
    }

    /* ---- routing ---- */
    function tap(el) {
      if (!isActive(el)) return;
      B.emit('select', { el: el, mode: st.mode });
      if (st.mode === 'point') return pointAnswer(el);
      if (st.mode === 'describe') return describeTap(el);
      if (st.mode === 'ask' && !A.cur) { A.el = el; clearMarks(); render(); }
    }
    function resetAll() { resetPoint(); resetDescribe(); resetJudge(); resetAsk(); }
    function renderBar() {
      bar.innerHTML = '';
      if (pack.readingLabel) bar.append(h('label', { class: 'kb-variant' }, [h('input', { type: 'checkbox', checked: st.showReading, onchange: function (e) { st.showReading = e.target.checked; B.emit('highlight', { showReading: st.showReading }); render(); } }), L(' 显示' + pack.readingLabel, ' Show ' + T(pack, 'readingLabel'))]));
      if (st.mode === 'point') bar.append(h('label', { class: 'kb-variant' }, [h('input', { type: 'checkbox', checked: st.hideText, onchange: function (e) { st.hideText = e.target.checked; B.emit('highlight', { hideText: st.hideText }); render(); } }), L(' 只听，不看字', ' Listen only, no text')]));
      bar.append(h('span', { class: 'kb-note', text: L('声音来自浏览器的语音合成，只放音，不录音、不打分。', 'Sound comes from the browser\'s speech synthesis: playback only, no recording, no scoring.') }));
    }
    function renderPanel() {
      panel.innerHTML = '';
      if (st.mode === 'point') renderPoint();
      else if (st.mode === 'describe') renderDescribe();
      else if (st.mode === 'judge') renderJudge();
      else renderAsk();
    }
    function render() {
      clearMarks(); setLit(null); renderBar(); renderPanel();
    }
    resetAll();
    render();
    window.__ptReady = true;
  }
})();
</script>
</body>
</html>
