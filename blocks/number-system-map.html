<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number-system map</title>
<link rel="stylesheet" href="runtime/block.css">
<style>
  .nm-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .nm-layout { grid-template-columns: 1fr; } }
  .nm-stage { display: grid; gap: 12px; min-width: 0; }
  .nm-side { display: grid; gap: 12px; }
  .ctx { font-size: 1.15rem; margin: 0; }
  .ctx .say { font-weight: 700; color: var(--accent); }
  .steph { font-size: .82rem; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  /* number line */
  .line { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; position: relative; padding-top: 4px; }
  .band { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 2px 6px; font-size: .74rem; text-align: center; font-variant-numeric: tabular-nums; position: relative; min-height: 44px; overflow-wrap: anywhere; }
  .band[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .band.truth { outline: 3px solid var(--t2); outline-offset: 1px; }
  .band .tag { display: block; font-size: .68rem; font-weight: 700; }
  @media (max-width: 560px) { .line { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .gapline { font-size: .9rem; margin: 8px 0 0; }
  .gapline.far { color: var(--bad); font-weight: 600; }
  /* grouping bar */
  .digits { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; font-family: ui-monospace, Menlo, monospace; font-size: 1.6rem; margin: 6px 0; }
  .dg { padding: 4px 3px; min-width: 1.05em; text-align: center; }
  .gap { border: 0; background: transparent; width: 16px; padding: 0; position: relative; color: var(--muted); font: inherit; font-size: 1rem; }
  .gap::after { content: ""; position: absolute; left: 7px; top: 15%; bottom: 15%; width: 2px; background: var(--line); }
  .gap.on::after { width: 4px; left: 6px; background: var(--accent); }
  .gap.on.wan::after { width: 6px; left: 5px; background: var(--t3); }
  .gap:focus-visible { outline: 3px solid var(--focus); }
  .gap .mk { position: absolute; bottom: -2px; left: 0; right: 0; font-size: .8rem; font-weight: 700; color: var(--accent); }
  .ref { display: flex; flex-wrap: wrap; gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 1.15rem; color: var(--muted); }
  .grp { display: inline-grid; justify-items: center; border-bottom: 3px solid var(--line); padding: 0 4px; }
  .grp.k3 { border-bottom-style: solid; }
  .grp.k4 { border-bottom: 6px double var(--t3); }
  .grp small { font-family: var(--font); font-size: .72rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts .kb-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .readin { width: 100%; font-size: 1.15rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .echo { font-family: ui-monospace, Menlo, monospace; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .chip.ind { background: var(--accent-soft); border-color: var(--accent); }
  .chip.ast { background: var(--warn-soft); border-color: var(--warn); }
  .chip.bad { background: var(--bad-soft); border-color: var(--bad); }
  .estlog { margin: 0; padding-left: 18px; font-size: .84rem; }
  .estlog .far { color: var(--bad); }
  .mc { display: grid; gap: 6px; }
  .mc .kb-btn { text-align: left; border-radius: 10px; font-size: 1.05rem; }
  .mc .kb-btn.right { border-color: var(--t2); border-width: 2px; opacity: 1; font-weight: 700; }
  .mc .kb-btn.wrongpick { border-color: var(--bad); border-width: 2px; }
  .show { font-size: 1.5rem; font-weight: 700; margin: 4px 0 10px; }
  .done { font-size: 2.4rem; text-align: center; }
</style>
<script src="runtime/block.js"></script>
<script src="registry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Number-system map (prim:number-system-map). Packs: data/number-system-map.js (format in its header).
 * Modes: card (step 1: from the source-language reading only, pick the order of magnitude on a number line — locked
 * before anything else is shown; step 2: place the target language's group separators on the digits (three-digit
 * commas for English, four-digit 万 lines for Chinese) and name the highest level; step 3: write the full quantity in
 * the target language — the page parses it back into a number and shows "you wrote X, the number is Y"),
 * rule (the reverse half: years, phone numbers, 成, fractions, plurals, 零, numbers under 10,000 — where the
 * conversion rule does not apply), own (convert a number of your own; no example is shown).
 * Readings are checked deterministically: value, approximation word, unit, and number-word form (no -s after a
 * specific number, no "fifteen ten thousand", no 一百千, 多 in the right place, not digits only). Nothing spoken is
 * heard or scored. */
(function () {
  'use strict';
  var h = KTBlock.h, L = KTBlock.L, T = KTBlock.t;

  /* ---------- parsers (also exposed as window.NSMParse for checking) ---------- */
  var SMALL = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  var TENS = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  var SCALE = { thousand: 1e3, million: 1e6, billion: 1e9 };
  var APPROX_EN = { over: ['more than', 'just over', 'over'], about: ['approximately', 'roughly', 'around', 'about', 'some'] };
  function err(code) { return { err: code }; }
  /** English quantity phrase → {value, approx, rest, err}. */
  function parseEn(text) {
    var x = String(text || '').normalize('NFKC').toLowerCase().replace(/[‘’]/g, "'").replace(/(\d),(?=\d{3}\b)/g, '$1').replace(/[-–]/g, ' ').replace(/[.!]+$/, '').replace(/\band a half\b/g, 'point five').trim();
    var approx = null;
    ['over', 'about'].forEach(function (k) { APPROX_EN[k].forEach(function (p) { if (!approx && (x + ' ').indexOf(p + ' ') === 0) { approx = k; x = x.slice(p.length).trim(); } }); });
    if (/^(nearly|almost|under|less than|just under)\b/.test(x)) return err('approx-other');
    var toks = x.split(/\s+/).filter(Boolean), i = 0, total = 0, cur = null, last = null, scales = [], words = 0, decimal = null;
    for (; i < toks.length; i++) {
      var t = toks[i], nx = toks[i + 1];
      if (t === 'and') { if (last === 'hundred' || last === 'scale') continue; break; }
      if ((t === 'a' || t === 'one') && (nx === 'hundred' || SCALE[nx]) && cur === null) { cur = 1; last = 'unit'; words++; continue; }
      if (/^\d+(\.\d+)?$/.test(t)) { if (cur !== null) return err('order'); cur = parseFloat(t); last = 'digit'; continue; }
      if (t in SMALL || t in TENS) {
        var v = t in SMALL ? SMALL[t] : TENS[t]; words++;
        if (decimal !== null) { if (!(t in SMALL) || v > 9) return err('decimal'); decimal += String(v); continue; }
        if (last === 'tens' && v < 10 && v > 0) { cur += v; last = 'unit'; continue; }
        if (last === 'unit' || last === 'teen' || last === 'tens' || last === 'digit') return err('adjacent');
        cur = (cur || 0) + v; last = v >= 20 ? 'tens' : v >= 10 ? 'teen' : 'unit'; continue;
      }
      if (t === 'point') { if (cur === null || decimal !== null) return err('order'); decimal = ''; last = 'point'; continue; }
      if (t === 'hundred') { words++; if (cur === null || cur >= 100 || decimal !== null) return err('order'); cur *= 100; last = 'hundred'; continue; }
      if (t === 'hundreds' || t === 'thousands' || t === 'millions' || t === 'billions') return err(cur === null ? 'plural-nonum' : 'plural');
      if (SCALE[t]) {
        words++;
        if (cur === null) return err('order');
        if (decimal !== null) { cur = parseFloat(String(cur) + '.' + (decimal || '0')); decimal = null; }
        if (scales.length && SCALE[t] >= scales[scales.length - 1]) return err('adjacent');
        scales.push(SCALE[t]); total += cur * SCALE[t]; cur = null; last = 'scale'; continue;
      }
      break;
    }
    if (decimal !== null) { if (!decimal) return err('decimal'); cur = parseFloat(String(cur) + '.' + decimal); }
    if (cur !== null) total += cur;
    if (i === 0 && cur === null && !scales.length) return err('nonumber');
    if (!words) return err('digits');
    var rest = toks.slice(i).join(' ');
    if (/^of\b/.test(rest)) return err('of');
    return { value: Math.round(total * 1000) / 1000, approx: approx, rest: rest };
  }
  var ZD = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  var ZU = { '十': 10, '百': 100, '千': 1000 };
  /** Chinese number expression (no unit) → {value, err, liang2}. */
  function parseZhNum(s) {
    var m = /^(\d+(?:\.\d+)?)(万|亿)?$/.exec(s);
    if (m) return m[2] ? { value: Math.round(parseFloat(m[1]) * (m[2] === '亿' ? 1e8 : 1e4)) } : err('digits');
    m = /^(.+?)点([零〇一二三四五六七八九]+)(万|亿)?$/.exec(s);
    if (m) {
      var ip = parseZhNum(m[1]); if (ip.err) return ip;
      if (/(十|百|千)/.test(m[2])) return err('decimal');
      var frac = parseFloat('0.' + m[2].split('').map(function (c) { return ZD[c]; }).join(''));
      return { value: Math.round((ip.value + frac) * (m[3] === '亿' ? 1e8 : m[3] === '万' ? 1e4 : 1) * 1000) / 1000 };
    }
    if (/(十|百|千)点/.test(s)) return err('decimal');
    var total = 0, section = 0, num = null, zero = false, lastSmall = null, lastBig = Infinity, prevUnit = false, any = false;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c in ZD) {
        if (ZD[c] === 0) { zero = true; num = null; prevUnit = false; continue; }
        if (num !== null) return err('adjacent');
        num = ZD[c]; prevUnit = false; any = true; continue;
      }
      if (c in ZU) {
        var u = ZU[c];
        if (lastSmall !== null && u >= lastSmall) return err('baiqian');
        if (num === null) { if (c === '十' && section === 0 && !zero) num = 1; else return err('order'); }
        section += num * u; num = null; lastSmall = u; zero = false; prevUnit = true; any = true; continue;
      }
      if (c === '万' || c === '亿') {
        var big = c === '万' ? 1e4 : 1e8, val = section + (num || 0);
        if (!val) return err('order');
        if (big >= lastBig) return err('baiqian');
        total += val * big; section = 0; num = null; lastSmall = null; lastBig = big; zero = false; prevUnit = true; continue;
      }
      return err('nonumber');
    }
    if (!any) return err('nonumber');
    if (num !== null) {
      if (prevUnit === false && !zero && i > 1) {
        var prev = s[s.length - 2];
        if (prev in ZU) num *= ZU[prev] / 10; else if (prev === '万') num *= 1000; else if (prev === '亿') num *= 1e7;
      }
      section += num;
    }
    return { value: total + section, liang2: /^二[百千万亿]/.test(s) };
  }
  /** Chinese quantity phrase → {value, approx, unitOk, err}. units = accepted unit strings. */
  function parseZh(text, units) {
    var x = String(text || '').normalize('NFKC').replace(/[\s,，。.!！]+$/g, '').replace(/\s+/g, '');
    var approx = null, mm;
    if ((mm = /^(大约|大概|约|差不多)/.exec(x))) { approx = 'about'; x = x.slice(mm[1].length); }
    else if ((mm = /^(超过|多于)/.exec(x))) { approx = 'over'; x = x.slice(mm[1].length); }
    mm = /^[\d.零〇一二两三四五六七八九十百千万亿点]+/.exec(x);
    if (!mm) return err('nonumber');
    var numStr = mm[0], rest = x.slice(numStr.length);
    var p = parseZhNum(numStr); if (p.err) return p;
    if (/^多[万亿]/.test(rest) && !/[十百千]$/.test(numStr)) return err('duo');
    if (/^多[万亿]/.test(rest) && !/[万亿]/.test(numStr)) { if (approx) return err('approx-double'); approx = 'over'; p = { value: p.value * (rest[1] === '万' ? 1e4 : 1e8), liang2: p.liang2 }; rest = rest.slice(2); }
    else if (rest[0] === '多') { if (approx) return err('approx-double'); approx = 'over'; rest = rest.slice(1); }
    if (/^左右/.test(rest)) { if (approx) return err('approx-double'); approx = 'about'; rest = rest.slice(2); }
    rest = rest.replace(/^的/, '');
    var unit = (units || []).filter(function (u) { return rest.indexOf(u) === 0; }).sort(function (a, b) { return b.length - a.length; })[0];
    if (unit) rest = rest.slice(unit.length);
    if (/^多/.test(rest) || /^[个名本位张]多/.test(rest)) return err('duo');
    if (/^左右/.test(rest)) { if (approx) return err('approx-double'); approx = 'about'; rest = rest.slice(2); }
    return { value: p.value, approx: approx, unitOk: !units || !units.length || !!unit, rest: rest, liang2: p.liang2 };
  }
  window.NSMParse = { en: parseEn, zh: parseZh, zhNum: parseZhNum };

  var params = new URLSearchParams(location.search);
  var setId = params.get('set') || 'number-system-map-en';
  var entry = (window.KT_REGISTRY && KT_REGISTRY.packs && KT_REGISTRY.packs[setId]) || { file: 'data/number-system-map.js', block: 'number-system-map' };
  var app = document.getElementById('app');
  if (entry.block !== 'number-system-map') { app.textContent = L('数据包 ' + setId + ' 属于积木 ' + entry.block + '，不能在这里打开。', 'Data pack ' + setId + ' belongs to the block ' + entry.block + ' and cannot be opened here.'); return; }
  var sc = document.createElement('script');
  sc.src = entry.file;
  sc.onload = function () { if (KT_DATA[setId]) start(KT_DATA[setId]); else app.textContent = L('数据包里没有 ' + setId, 'The data pack file does not contain ' + setId); };
  sc.onerror = function () { app.textContent = L('数据包加载失败：', 'Could not load the data pack: ') + entry.file; };
  document.head.appendChild(sc);

  function start(pack) {
    var title = T(pack, 'title');
    var B = KTBlock.init({ id: 'number-system-map', primitive: 'prim:number-system-map', title: title, set: pack.id });
    document.title = title + ' · Number-system map';
    var EN_T = pack.lang === 'en';                       // target language
    var tlang = EN_T ? 'en' : 'zh-CN', slang = pack.src === 'zh' ? 'zh-CN' : 'en';
    var K = EN_T ? 3 : 4;                                // target grouping size
    var LEVELS = EN_T
      ? [{ v: 'none', zh: '不到一千', en: 'under a thousand' }, { v: 'thousand', zh: 'thousand', en: 'thousand' }, { v: 'million', zh: 'million', en: 'million' }, { v: 'billion', zh: 'billion', en: 'billion' }]
      : [{ v: 'none', zh: '不到一万', en: 'under 万 (10,000)' }, { v: 'wan', zh: '万', en: '万 (10,000)' }, { v: 'yi', zh: '亿', en: '亿 (100,000,000)' }];
    function levelOf(n) { return EN_T ? (n < 1e3 ? 'none' : n < 1e6 ? 'thousand' : n < 1e9 ? 'million' : 'billion') : (n < 1e4 ? 'none' : n < 1e8 ? 'wan' : 'yi'); }
    function bands() { return B.variant === 'child' ? [1, 2, 3, 4] : [2, 3, 4, 5, 6, 7, 8, 9, 10]; }
    function truthBand(n) { var bb = bands(); return Math.min(Math.max(Math.floor(Math.log10(n)), bb[0]), bb[bb.length - 1]); }
    function comma(n) { return Number(n).toLocaleString('en-US'); }
    function wanGroup(n) { var s = String(Math.round(n)), out = []; while (s.length > 4) { out.unshift(s.slice(-4)); s = s.slice(0, -4); } out.unshift(s); return out.join('|'); }
    var cards;
    function pickCards() {
      cards = (B.variant === 'child' && pack.childCards ? pack.childCards : pack.cards).slice();
      if (B.kc && cards.some(function (c) { return c.kc === B.kc; })) cards = cards.filter(function (c) { return c.kc === B.kc; });
      st.ci = 0;
    }
    var modes = [{ id: 'card', label: L('估·算·读', 'Estimate · convert · say') }, { id: 'rule', label: L('规则之外', 'Where the rule stops') }, { id: 'own', label: L('自己的数', 'Your own number') }];
    var st = { mode: modes.some(function (m) { return m.id === params.get('mode'); }) ? params.get('mode') : 'card', ci: 0, streak: 0, est: [], ri: 0, ownN: 0 };
    var ui = KTBlock.chrome(B, { title: title, subtitle: T(pack, 'subtitle'), modes: modes, mode: st.mode,
      onMode: function (m) { st.mode = m; ui.setMode(m); B.emit('view', { mode: m }); enter(); },
      onVariant: function () { pickCards(); enter(); } });
    var bar = h('div', { class: 'kb-bar' });
    var stage = h('div', { class: 'nm-stage' });
    var side = h('aside', { class: 'nm-side' });
    app.append(ui.header, h('main', { class: 'kb-main' }, [bar, h('div', { class: 'nm-layout' }, [stage, side])]), ui.drawer);
    B.emit('view', { mode: st.mode, set: pack.id });

    pickCards();
    function enter() {
      if (st.mode === 'card') { loadCard(); return; }
      if (st.mode === 'rule') { st.rq = KTBlock.shuffle(pack.rule); st.ri = 0; loadRule(); return; }
      st.own = { n: '', what: '', text: '', res: null }; render();
    }
    function cur() { return cards[st.ci % cards.length]; }
    function faded() { return st.streak >= 5; }
    function loadCard() {
      var c = cur();
      st.c = { phase: 'est', est: null, t0: Date.now(), gaps: {}, level: null, grpRes: null, text: '', readRes: null, hints: {}, skipGrp: faded() };
      B.emit('view', { item: c.id });
      render();
    }

    /* ---- step 1 ---- */
    function estimate(b) {
      var c = cur(), C = st.c; if (C.est !== null) return;
      C.est = b; var truth = truthBand(c.n), gap = b - truth, ms = Date.now() - C.t0;
      C.gap = gap;
      B.attempt('est:' + c.id, { correct: gap === 0, response: { band: b, truth: truth, gap: gap, ms: ms, slow: ms > 20000 } });
      st.est.push({ id: c.id, gap: gap });
      C.phase = C.skipGrp ? 'read' : 'grp';
      B.emit('select', { item: 'est:' + c.id, band: b });
      render();
    }
    /* ---- step 2 ---- */
    function toggleGap(i) {
      var c = cur(), C = st.c; if (C.grpRes && C.grpRes.ok) return;
      C.gaps[i] = !C.gaps[i];
      B.emit(C.gaps[i] ? 'drop' : 'drag', { item: 'grp:' + c.id, gapAfterDigit: i, on: !!C.gaps[i] });
      render();
      setTimeout(function () { var g = stage.querySelector('[data-gap="' + i + '"]'); if (g) g.focus(); }, 0);
    }
    function checkGrp() {
      var c = cur(), C = st.c, s = String(c.n), want = [];
      for (var i = 0; i < s.length - 1; i++) if ((s.length - 1 - i) % K === 0) want.push(i);
      var have = Object.keys(C.gaps).filter(function (k) { return C.gaps[k]; }).map(Number).sort(function (a, b) { return a - b; });
      if (!C.level) { C.grpRes = { ok: false, t: L('再选一下：读到哪一级？', 'Also choose the highest level.'), tone: 'warn' }; render(); return; }
      var sepOk = want.join() === have.join(), lvOk = C.level === levelOf(c.n);
      B.attempt('grp:' + c.id, { correct: sepOk && lvOk, response: { gaps: have, level: C.level, sepOk: sepOk, levelOk: lvOk } });
      C.grpRes = { ok: sepOk && lvOk, sepOk: sepOk, lvOk: lvOk };
      C.grpRes.t = sepOk && lvOk ? L('分组对了。', 'Grouping right.') : (!sepOk ? (EN_T ? L('英语从右往左每三位一组（逗号）。', 'English groups three digits at a time from the right (commas).') : L('中文从右往左每四位一组（万、亿）。', 'Chinese groups four digits at a time from the right (万, 亿).')) : '') + (!lvOk ? L(' 最高一级选得不对。', ' The highest level is not right.') : '') + (sepOk && lvOk ? '' : L(' 改一改再核对。', ' Adjust and check again.'));
      C.grpRes.tone = sepOk && lvOk ? '' : 'bad';
      render();
    }
    /* ---- step 3 ---- */
    function readMsg(code) {
      var M = {
        'adjacent': EN_T ? L('这几个数词不能这样连在一起。英语三位一级：一万 = ten thousand，十五万 = one hundred and fifty thousand，没有 *fifteen ten thousand。', 'These number words cannot go together like that. English groups by three: 10,000 = ten thousand, 150,000 = one hundred and fifty thousand; there is no *fifteen ten thousand.') : L('数字和单位的顺序不对，两个数字不能直接连在一起。', 'The digits and units are in the wrong order; two digits cannot stand side by side.'),
        'plural': L('前面有具体数字时，hundred、thousand、million 不加 -s：three million people。', 'After a specific number, hundred, thousand and million take no -s: three million people.'),
        'plural-nonum': L('没有具体数字时才用 millions of / thousands of。这里有具体数字。', 'millions of / thousands of is only for when there is no specific number. Here there is one.'),
        'of': L('具体数字后面直接接名词，不加 of：two million people。', 'After a specific number, the noun follows directly, without of: two million people.'),
        'decimal': EN_T ? L('小数点后面一位一位读：two point seven five，不读 *seventy-five。', 'After the point, read digit by digit: two point seven five, not *seventy-five.') : L('小数点后面一位一位读：零点二五。', 'After 点, read digit by digit: 零点二五.'),
        'digits': L('只写了阿拉伯数字。这一步要写出读法（数词）。', 'Only digits. This step asks for the words.'),
        'nonumber': L('没找到数。', 'No number found.'),
        'order': L('数词的顺序不对。', 'The number words are in the wrong order.'),
